# api/myorg.yaml
openapi: 3.1.0
info:
  title: zeroauthy My Organization API
  version: 0.1.0
  summary: Organization administrators manage their own organization (Plan 42b, D-0220 and D-0221).
  description: |
    Each tenant host serves the My Organization API at `https://{host}/my-org/v1`
    once the tenant has activated it (the system API `https://{canonical
    host}/my-org/` exists). Calls carry a user access token for
    `https://{host}/my-org/`, issued on the host being called, for a login
    in an organization: every operation acts on the token's `org_id`; no path
    or body names an organization. Permissions are `my_org` scopes the user
    holds through organization member roles, within the application's client
    grant. The application needs a `my_organization_configuration`.

    Phase A: configuration, details, members, memberships, member roles,
    roles, invitations and user stores (D-0220). Phase B: domains with DNS
    verification, the organization's enterprise identity providers, their
    domains and SCIM provisioning (D-0221). Auth0 marks the whole API
    Early Access; this contract follows its OpenAPI 1.0.0.
    zeroauthy is a clean-room implementation; see `CLEAN_ROOM.md`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://{host}/my-org/v1
  variables:
    host:
      default: tenant.example.com
      description: The canonical host or a custom domain of the tenant.
security:
- myOrgToken: []
paths:
  /config:
    get:
      operationId: GetMyOrgConfiguration
      summary: The application's My Organization configuration
      x-source: &src
      - https://auth0.com/docs/oas/myorganization/myorganization-api-oas.json
      - https://auth0.com/docs/manage-users/my-organization-api
      security:
      - myOrgToken: [read:my_org:configuration]
      responses:
        '200':
          description: Configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /details:
    get:
      operationId: GetMyOrgDetails
      summary: The organization's details
      x-source: *src
      security:
      - myOrgToken: [read:my_org:details]
      responses:
        '200':
          description: Details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgDetails'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: UpdateMyOrgDetails
      summary: Update the organization's details
      description: '`name`, `display_name`, `branding` and `third_party_client_access` (within the application''s allowed values).'
      x-source: *src
      security:
      - myOrgToken: [update:my_org:details]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrgDetails'}
      responses:
        '200':
          description: Details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgDetails'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /members:
    get:
      operationId: ListMyOrgMembers
      summary: List the organization's members
      description: '`roles` (at most 10 per member) is included only when the token also carries `read:my_org:member_roles`.'
      x-source: *src
      security:
      - myOrgToken: [read:my_org:members]
      parameters:
      - {$ref: '#/components/parameters/Fields'}
      - {$ref: '#/components/parameters/IncludeFields'}
      - {$ref: '#/components/parameters/From'}
      - {$ref: '#/components/parameters/Take'}
      - {$ref: '#/components/parameters/IncludeTotals'}
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  members:
                    type: array
                    items: {$ref: '#/components/schemas/Member'}
                  next: {type: string}
                  total: {type: integer}
                  total_is_capped: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /members/{user_id}:
    get:
      operationId: GetMyOrgMember
      summary: One member
      x-source: *src
      security:
      - myOrgToken: [read:my_org:members]
      parameters:
      - {$ref: '#/components/parameters/UserID'}
      - {$ref: '#/components/parameters/Fields'}
      - {$ref: '#/components/parameters/IncludeFields'}
      responses:
        '200':
          description: Member.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /delete-memberships:
    post:
      operationId: DeleteMyOrgMemberships
      summary: Remove a member from the organization (the user stays)
      x-source: *src
      security:
      - myOrgToken: [delete:my_org:memberships]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [members]
              properties:
                members:
                  type: array
                  minItems: 1
                  maxItems: 1
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/UserID'}
      responses:
        '204': {description: Removed.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /members/{user_id}/roles:
    get:
      operationId: ListMyOrgMemberRoles
      summary: A member's roles in the organization
      x-source: *src
      security:
      - myOrgToken: [read:my_org:member_roles]
      parameters:
      - {$ref: '#/components/parameters/UserID'}
      - {$ref: '#/components/parameters/From'}
      - {$ref: '#/components/parameters/Take'}
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RolePage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: AssignMyOrgMemberRoles
      summary: Assign roles to a member
      description: Only roles visible to the API; the application's `enforce_permission_ceiling` and `enforce_self_assignment_restriction` apply.
      x-source: *src
      security:
      - myOrgToken: [create:my_org:member_roles]
      parameters:
      - {$ref: '#/components/parameters/UserID'}
      requestBody: {$ref: '#/components/requestBodies/RoleChange'}
      responses:
        '204': {description: Assigned.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /members/{user_id}/unassign-roles:
    post:
      operationId: UnassignMyOrgMemberRoles
      summary: Remove roles from a member
      description: Removing the organization's last role holding `my_org` permissions answers `409`.
      x-source: *src
      security:
      - myOrgToken: [delete:my_org:member_roles]
      parameters:
      - {$ref: '#/components/parameters/UserID'}
      requestBody: {$ref: '#/components/requestBodies/RoleChange'}
      responses:
        '204': {description: Removed.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /roles:
    get:
      operationId: ListMyOrgRoles
      summary: Roles the operator made visible to the API
      x-source: *src
      security:
      - myOrgToken: [read:my_org:member_roles]
      parameters:
      - {$ref: '#/components/parameters/From'}
      - {$ref: '#/components/parameters/Take'}
      - name: name
        in: query
        description: Case-insensitive name filter.
        schema: {type: string, minLength: 1, maxLength: 300}
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RolePage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /member-invitations:
    get:
      operationId: ListMyOrgInvitations
      summary: Pending invitations
      x-source: *src
      security:
      - myOrgToken: [read:my_org:member_invitations]
      parameters:
      - {$ref: '#/components/parameters/Fields'}
      - {$ref: '#/components/parameters/IncludeFields'}
      - {$ref: '#/components/parameters/From'}
      - {$ref: '#/components/parameters/Take'}
      - name: sort
        in: query
        schema: {type: string, pattern: '^created_at:(1|-1)$', default: 'created_at:-1'}
      - {$ref: '#/components/parameters/IncludeTotals'}
      responses:
        '200':
          description: Invitations.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  invitations:
                    type: array
                    items: {$ref: '#/components/schemas/Invitation'}
                  next: {type: string}
                  total: {type: integer}
                  total_is_capped: {type: boolean}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: CreateMyOrgInvitations
      summary: Invite up to ten people
      description: A new invitation for an email revokes its earlier pending ones. The landing application is the configuration's `invitation_landing_client_id`; roles must be visible to the API.
      x-source: *src
      security:
      - myOrgToken: [create:my_org:member_invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitees]
              properties:
                invitees:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [email]
                    properties:
                      email: {type: string, format: email, minLength: 1, maxLength: 320}
                      roles:
                        type: array
                        maxItems: 10
                        uniqueItems: true
                        items: {$ref: '#/components/schemas/RoleID'}
                inviter:
                  type: object
                  additionalProperties: false
                  properties:
                    name: {type: string, minLength: 1, maxLength: 300}
                identity_provider_id: {type: string, pattern: '^con_[A-Za-z0-9]+$'}
                user_store_id: {type: string, pattern: '^con_[A-Za-z0-9]+$'}
                ttl_sec: {type: integer, minimum: 0, maximum: 2592000, default: 604800}
      responses:
        '201':
          description: The invitations.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Invitation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /member-invitations/{invitation_id}:
    get:
      operationId: GetMyOrgInvitation
      summary: One invitation
      x-source: *src
      security:
      - myOrgToken: [read:my_org:member_invitations]
      parameters:
      - {$ref: '#/components/parameters/InvitationID'}
      - {$ref: '#/components/parameters/Fields'}
      - {$ref: '#/components/parameters/IncludeFields'}
      responses:
        '200':
          description: Invitation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invitation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /member-invitations/{invitation_id}/roles:
    get:
      operationId: ListMyOrgInvitationRoles
      summary: The roles an invitation grants
      x-source: *src
      security:
      - myOrgToken: [read:my_org:member_roles]
      parameters:
      - {$ref: '#/components/parameters/InvitationID'}
      responses:
        '200':
          description: Roles.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /delete-member-invitations:
    post:
      operationId: DeleteMyOrgInvitations
      summary: Revoke invitations
      x-source: *src
      security:
      - myOrgToken: [delete:my_org:member_invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitations]
              properties:
                invitations:
                  type: array
                  minItems: 1
                  maxItems: 10
                  uniqueItems: true
                  items: {type: string, maxLength: 100}
      responses:
        '204': {description: Revoked.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /user-stores:
    get:
      operationId: ListMyOrgUserStores
      summary: The organization's database connections, for invitations
      x-source: *src
      security:
      - myOrgToken: [read:my_org:user_stores]
      responses:
        '200':
          description: User stores.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_stores]
                properties:
                  user_stores:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        name: {type: string}
                        display_name: {type: string}
                        access_level: {type: string, enum: [none, readonly, limited, full]}
                        is_enabled: {type: boolean}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /config/identity-providers:
    get:
      operationId: GetMyOrgIdentityProviderConfiguration
      summary: What administrators may configure for identity providers (the application's connection profile)
      x-source: *src
      security:
      - myOrgToken: [read:my_org:configuration]
      responses:
        '200':
          description: Identity provider configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityProvidersConfig'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /domains:
    get:
      operationId: ListMyOrgDomains
      summary: The organization's pending, failed and verified domains
      x-source: *src
      security:
      - myOrgToken: [read:my_org:domains]
      parameters:
      - {$ref: '#/components/parameters/From'}
      - name: take
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Domains.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [organization_domains]
                properties:
                  organization_domains:
                    type: array
                    items: {$ref: '#/components/schemas/OrgDomain'}
                  next: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: CreateMyOrgDomain
      summary: Claim a domain (pending until verified through DNS)
      x-source: *src
      security:
      - myOrgToken: [create:my_org:domains]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain]
              properties:
                domain: {$ref: '#/components/schemas/OrgDomainName'}
      responses:
        '201':
          description: The claimed domain.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgDomain'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /domains/{domain_id}:
    parameters:
    - {$ref: '#/components/parameters/DomainID'}
    get:
      operationId: GetMyOrgDomain
      summary: One domain
      x-source: *src
      security:
      - myOrgToken: [read:my_org:domains]
      responses:
        '200':
          description: The domain.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgDomain'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: DeleteMyOrgDomain
      summary: Delete a domain and remove it from the organization's identity providers
      x-source: *src
      security:
      - myOrgToken: [delete:my_org:domains]
      responses:
        '204': {description: Deleted.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /domains/{domain_id}/verify:
    parameters:
    - {$ref: '#/components/parameters/DomainID'}
    post:
      operationId: VerifyMyOrgDomain
      summary: Look up the verification TXT record (D-0221 LR42b-16)
      x-source: *src
      security:
      - myOrgToken: [update:my_org:domains]
      responses:
        '202':
          description: The domain after the lookup.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrgDomain'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /domains/{domain_id}/identity-providers:
    parameters:
    - {$ref: '#/components/parameters/DomainID'}
    get:
      operationId: ListMyOrgDomainIdentityProviders
      summary: The organization's identity providers that have the domain
      x-source: *src
      security:
      - myOrgToken: [read:my_org:domains, read:my_org:identity_providers]
      responses:
        '200':
          description: Identity providers.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  identity_providers:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: {$ref: '#/components/schemas/IdpID'}
                        name: {type: string}
                        display_name: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /identity-providers:
    get:
      operationId: ListMyOrgIdentityProviders
      summary: The organization's enterprise identity providers
      x-source: *src
      security:
      - myOrgToken: [read:my_org:identity_providers]
      parameters:
      - name: member_access_level
        in: query
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/AccessLevel'}
      - name: is_enabled
        in: query
        schema: {type: boolean}
      responses:
        '200':
          description: Identity providers.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  identity_providers:
                    type: array
                    items: {$ref: '#/components/schemas/IdentityProvider'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: CreateMyOrgIdentityProvider
      summary: Create an enterprise connection enabled only on this organization
      x-source: *src
      security:
      - myOrgToken: [create:my_org:identity_providers]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityProviderCreate'}
      responses:
        '201':
          description: The identity provider.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityProvider'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /identity-providers/{idp_id}:
    parameters:
    - {$ref: '#/components/parameters/IdpID'}
    get:
      operationId: GetMyOrgIdentityProvider
      summary: One identity provider
      x-source: *src
      security:
      - myOrgToken: [read:my_org:identity_providers]
      responses:
        '200':
          description: The identity provider.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityProvider'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      operationId: UpdateMyOrgIdentityProvider
      summary: Update an identity provider (fields gated by its access level)
      x-source: *src
      security:
      - myOrgToken: [update:my_org:identity_providers]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityProviderUpdate'}
      responses:
        '200':
          description: The identity provider.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityProvider'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: DeleteMyOrgIdentityProvider
      summary: Delete the identity provider's connection (access level full)
      x-source: *src
      security:
      - myOrgToken: [delete:my_org:identity_providers]
      responses:
        '204': {description: Deleted.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /identity-providers/{idp_id}/update-attributes:
    parameters:
    - {$ref: '#/components/parameters/IdpID'}
    put:
      operationId: RefreshMyOrgIdentityProviderAttributes
      summary: Refresh attribute mappings (unchanged without User Attribute Profiles, LR42b-20)
      x-source: *src
      security:
      - myOrgToken: [update:my_org:identity_providers]
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: The identity provider.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityProvider'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /identity-providers/{idp_id}/detach:
    parameters:
    - {$ref: '#/components/parameters/IdpID'}
    post:
      operationId: DetachMyOrgIdentityProvider
      summary: Remove the identity provider from the organization; the connection stays
      x-source: *src
      security:
      - myOrgToken: [update:my_org:identity_providers_detach]
      responses:
        '204': {description: Detached.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /identity-providers/{idp_id}/domains:
    parameters:
    - {$ref: '#/components/parameters/IdpID'}
    post:
      operationId: AddMyOrgIdentityProviderDomain
      summary: Link a verified organization domain for home realm discovery
      x-source: *src
      security:
      - myOrgToken: [create:my_org:identity_providers_domains]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain]
              properties:
                domain: {$ref: '#/components/schemas/OrgDomainName'}
      responses:
        '201':
          description: The linked domain.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [domain]
                properties:
                  domain: {$ref: '#/components/schemas/OrgDomainName'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /identity-providers/{idp_id}/domains/{domain}:
    parameters:
    - {$ref: '#/components/parameters/IdpID'}
    - name: domain
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OrgDomainName'}
    delete:
      operationId: RemoveMyOrgIdentityProviderDomain
      summary: Unlink a domain
      x-source: *src
      security:
      - myOrgToken: [delete:my_org:identity_providers_domains]
      responses:
        '204': {description: Unlinked.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /identity-providers/{idp_id}/provisioning:
    parameters:
    - {$ref: '#/components/parameters/IdpID'}
    get:
      operationId: GetMyOrgProvisioning
      summary: The identity provider's SCIM provisioning configuration
      x-source: *src
      security:
      - myOrgToken: [read:my_org:identity_providers_provisioning]
      responses:
        '200':
          description: Provisioning configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvisioningConfig'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: CreateMyOrgProvisioning
      summary: Enable SCIM provisioning
      x-source: *src
      security:
      - myOrgToken: [create:my_org:identity_providers_provisioning]
      responses:
        '201':
          description: Provisioning configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvisioningConfig'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: DeleteMyOrgProvisioning
      summary: Disable SCIM provisioning and revoke its tokens
      x-source: *src
      security:
      - myOrgToken: [delete:my_org:identity_providers_provisioning]
      responses:
        '204': {description: Deleted.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /identity-providers/{idp_id}/provisioning/update-attributes:
    parameters:
    - {$ref: '#/components/parameters/IdpID'}
    put:
      operationId: RefreshMyOrgProvisioningAttributes
      summary: Refresh provisioning attribute mappings (unchanged, LR42b-20)
      x-source: *src
      security:
      - myOrgToken: [update:my_org:identity_providers_provisioning]
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Provisioning configuration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvisioningConfig'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /identity-providers/{idp_id}/provisioning/scim-tokens:
    parameters:
    - {$ref: '#/components/parameters/IdpID'}
    get:
      operationId: ListMyOrgSCIMTokens
      summary: SCIM tokens (values are never returned)
      x-source: *src
      security:
      - myOrgToken: [read:my_org:identity_providers_scim_tokens]
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  scim_tokens:
                    type: array
                    items: {$ref: '#/components/schemas/SCIMToken'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    post:
      operationId: CreateMyOrgSCIMToken
      summary: Create a SCIM token; its value is returned only here
      x-source: *src
      security:
      - myOrgToken: [create:my_org:identity_providers_scim_tokens]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token_lifetime: {type: [integer, 'null'], exclusiveMinimum: 900}
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/SCIMTokenScope'}
      responses:
        '201':
          description: The token, with its value.
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/SCIMToken'}
                - type: object
                  required: [token]
                  properties:
                    token: {type: string}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /identity-providers/{idp_id}/provisioning/scim-tokens/{idp_scim_token_id}:
    parameters:
    - {$ref: '#/components/parameters/IdpID'}
    - name: idp_scim_token_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 255}
    get:
      operationId: GetMyOrgSCIMToken
      summary: A SCIM token's metadata
      x-source: *src
      security:
      - myOrgToken: [read:my_org:identity_providers_scim_tokens]
      responses:
        '200':
          description: Token metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SCIMToken'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      operationId: DeleteMyOrgSCIMToken
      summary: Revoke a SCIM token
      x-source: *src
      security:
      - myOrgToken: [delete:my_org:identity_providers_scim_tokens]
      responses:
        '204': {description: Revoked.}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    myOrgToken:
      type: http
      scheme: bearer
      description: A user access token for `https://{host}/my-org/` with `org_id`, issued on the host being called.
  parameters:
    Fields:
      name: fields
      in: query
      schema: {type: string, minLength: 1, maxLength: 255}
    IncludeFields:
      name: include_fields
      in: query
      schema: {type: boolean, default: true}
    From:
      name: from
      in: query
      description: Opaque cursor from a previous page's `next`.
      schema: {type: string, minLength: 1, maxLength: 1000}
    Take:
      name: take
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IncludeTotals:
      name: include_totals
      in: query
      description: Adds `total` (capped at 1000) and `total_is_capped`.
      schema: {type: boolean, default: false}
    UserID:
      name: user_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UserID'}
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema: {type: string, maxLength: 100}
    DomainID:
      name: domain_id
      in: path
      required: true
      description: An `ord_` ID, or a `dd_` ID of a domain created through the Management API (LR42b-15).
      schema: {type: string, pattern: '^(ord_[A-Za-z0-9]{22}|dd_[A-Za-z0-9]{24})$'}
    IdpID:
      name: idp_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/IdpID'}
  requestBodies:
    RoleChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [role_ids]
            properties:
              role_ids:
                type: array
                minItems: 1
                maxItems: 10
                uniqueItems: true
                items: {$ref: '#/components/schemas/RoleID'}
  responses:
    Problem:
      description: An error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    UserID:
      type: string
      minLength: 3
      maxLength: 1024
      pattern: '^.+\|.+$'
    RoleID:
      type: string
      pattern: '^rol_[A-Za-z0-9_]+$'
    Role:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: '#/components/schemas/RoleID'}
        name: {type: string}
        description: {type: string}
    RolePage:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
        next: {type: string}
    Configuration:
      type: object
      additionalProperties: false
      properties:
        allowed_strategies:
          type: array
          items: {type: string, enum: [adfs, google-apps, oidc, okta, pingfederate, samlp, waad]}
        connection_deletion_behavior: {type: string, enum: [allow, allow_if_empty]}
        organization_deletion_behavior: {type: string, enum: [allow, allow_if_empty]}
        third_party_client_access:
          type: object
          additionalProperties: false
          required: [default_value, allowed_values]
          properties:
            default_value: {type: string, enum: [allow, block]}
            allowed_values:
              type: array
              minItems: 1
              items: {type: string, enum: [allow, block]}
    OrgDetails:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        id: {type: string, readOnly: true}
        name: {type: string, minLength: 1, maxLength: 50}
        display_name: {type: string, minLength: 1, maxLength: 255}
        branding:
          type: object
          additionalProperties: false
          properties:
            logo_url: {type: ['string', 'null'], format: uri, pattern: '^https://.*'}
            colors:
              type: object
              additionalProperties: false
              required: [primary, page_background]
              properties:
                primary: {type: string, pattern: '^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'}
                page_background: {type: string, pattern: '^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$'}
        third_party_client_access: {type: string, enum: [allow, block]}
    Member:
      type: object
      properties:
        user_id: {type: string}
        email: {type: string}
        name: {type: string}
        nickname: {type: string}
        given_name: {type: string}
        family_name: {type: string}
        phone_number: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_login: {type: string, format: date-time}
        roles:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/Role'}
    Invitation:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        organization_id: {type: string}
        inviter:
          type: object
          properties:
            name: {type: string}
        invitee:
          type: object
          properties:
            email: {type: string}
        identity_provider_id: {type: string}
        user_store_id: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleID'}
        invitation_url: {type: string, format: uri}
        ticket_id: {type: string}
    ValidationError:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail: {type: string}
        field: {type: string}
        pointer: {type: string}
        source: {type: string}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [type, status, title]
      properties:
        type: {type: string}
        status: {type: integer}
        title: {type: string}
        detail: {type: string}
        validation_errors:
          type: array
          items: {$ref: '#/components/schemas/ValidationError'}
    OrgDomainName:
      type: string
      maxLength: 253
      pattern: '^(([a-zA-Z0-9]|[a-zA-Z0-9][a-zA-Z0-9-]*[a-zA-Z0-9])\.)*([A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9-]*[A-Za-z0-9])$'
    OrgDomain:
      type: object
      additionalProperties: false
      required: [id, org_id, domain, status, verification_txt, verification_host]
      properties:
        id: {type: string}
        org_id: {type: string}
        domain: {$ref: '#/components/schemas/OrgDomainName'}
        status: {type: string, enum: [failed, pending, verified]}
        verification_txt: {type: string}
        verification_host: {type: string}
        identity_provider_association: {type: string, enum: [associated, unassociated], readOnly: true}
    IdpID:
      type: string
      pattern: '^con_[A-Za-z0-9]{16}$'
    AccessLevel:
      type: string
      enum: [none, readonly, limited, full]
    IdpStrategy:
      type: string
      enum: [adfs, google-apps, oidc, okta, pingfederate, samlp, waad]
    IdpOptions:
      type: object
      description: |
        Strategy-specific options, validated per strategy as Auth0's
        `Idp<Strategy>OptionsRequest` schemas describe: `oidc` (`type`,
        `client_id`, `discovery_url`; `client_secret`), `okta` and
        `google-apps` (`domain`, `client_id`, `client_secret`; `icon_url`),
        `waad` (`tenant_domain`, `client_id`, `client_secret`; `icon_url`),
        `adfs` (`adfs_server` or `fedMetadataXml`), `samlp` (`metadataUrl`
        and `signSAMLRequest`, or `signInEndpoint`, `signingCert` and
        `signSAMLRequest`; signing, binding, `idpInitiated`, `icon_url`),
        `pingfederate` (`pingFederateBaseUrl`, `signingCert`,
        `signatureAlgorithm`, `digestAlgorithm`, `signSAMLRequest`).
        Responses never contain `client_secret` or `signingCert`.
      additionalProperties: true
    UserAttributeMap:
      type: object
      required: [is_required, is_extra, is_missing]
      properties:
        user_attribute: {type: string}
        description: {type: string}
        label: {type: string}
        is_required: {type: boolean}
        is_extra: {type: boolean}
        is_missing: {type: boolean}
        sso_field:
          type: array
          items: {type: string}
        provisioning_field: {type: string}
    IdentityProvider:
      type: object
      required: [strategy]
      properties:
        id: {$ref: '#/components/schemas/IdpID'}
        name: {type: [string, 'null'], maxLength: 128}
        strategy: {$ref: '#/components/schemas/IdpStrategy'}
        domains:
          type: array
          items: {type: string}
        display_name: {type: string}
        show_as_button: {type: boolean}
        assign_membership_on_login: {type: boolean}
        is_enabled: {type: boolean}
        access_level: {$ref: '#/components/schemas/AccessLevel'}
        member_access_level: {$ref: '#/components/schemas/AccessLevel'}
        use_for_third_party_client_access: {type: boolean}
        options: {$ref: '#/components/schemas/IdpOptions'}
        attributes:
          type: array
          items: {$ref: '#/components/schemas/UserAttributeMap'}
    IdentityProviderCreate:
      type: object
      additionalProperties: false
      required: [name, strategy]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        strategy: {$ref: '#/components/schemas/IdpStrategy'}
        domains:
          type: array
          items: {$ref: '#/components/schemas/OrgDomainName'}
        display_name: {type: string, minLength: 1, maxLength: 128}
        show_as_button: {type: boolean}
        assign_membership_on_login: {type: boolean}
        is_enabled: {type: boolean}
        use_for_third_party_client_access: {type: boolean}
        options: {$ref: '#/components/schemas/IdpOptions'}
    IdentityProviderUpdate:
      type: object
      additionalProperties: false
      description: |
        `display_name`, `options` and `use_for_third_party_client_access`
        need access level `full`; `show_as_button`,
        `assign_membership_on_login` and `is_enabled` need `full` or
        `limited` (LR42b-18).
      properties:
        display_name: {type: string, minLength: 1, maxLength: 128}
        show_as_button: {type: boolean}
        assign_membership_on_login: {type: boolean}
        is_enabled: {type: boolean}
        use_for_third_party_client_access: {type: boolean}
        options: {$ref: '#/components/schemas/IdpOptions'}
    IdentityProvidersConfig:
      type: object
      additionalProperties: false
      required: [organization, strategies, domain_aliases_config]
      properties:
        organization:
          type: object
          additionalProperties: false
          required: [can_set_show_as_button, can_set_assign_membership_on_login]
          properties:
            can_set_show_as_button: {type: boolean}
            can_set_assign_membership_on_login: {type: boolean}
        strategies:
          type: object
          description: One entry per strategy the administrator may use (`googleapps` for `google-apps`).
          additionalProperties:
            type: object
            required: [enabled_features, provisioning_methods]
            properties:
              enabled_features:
                type: array
                uniqueItems: true
                items: {type: string, enum: [provisioning, universal_logout]}
              provisioning_methods:
                type: array
                items: {type: string, enum: [scim, google_workspace]}
              provisioning:
                type: [object, 'null']
                properties:
                  on_login: {type: string, enum: [never_on_login, on_first_login, on_each_login]}
                  scim:
                    type: [object, 'null']
                    properties:
                      tokens:
                        type: object
                        properties:
                          scopes:
                            type: array
                            items: {$ref: '#/components/schemas/SCIMTokenScope'}
                          default_expiry: {type: [integer, 'null'], minimum: 900}
                          max_allowed_expiry: {type: [integer, 'null'], minimum: 900}
        domain_aliases_config:
          type: object
          additionalProperties: false
          required: [domain_verification]
          properties:
            domain_verification: {type: string, enum: [none, optional, required]}
    ProvisioningConfig:
      type: object
      required: [identity_provider_id, identity_provider_name, strategy, method, attributes, user_id_attribute]
      properties:
        identity_provider_id: {$ref: '#/components/schemas/IdpID'}
        identity_provider_name: {type: string}
        strategy: {$ref: '#/components/schemas/IdpStrategy'}
        method: {type: string, enum: [none, scim]}
        attributes:
          type: array
          items: {$ref: '#/components/schemas/UserAttributeMap'}
        user_id_attribute: {type: string}
    SCIMTokenScope:
      type: string
      enum: ['get:users', 'post:users', 'patch:users', 'delete:users', 'put:users']
    SCIMToken:
      type: object
      required: [token_id, created_at]
      properties:
        token_id: {type: string}
        scopes:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
