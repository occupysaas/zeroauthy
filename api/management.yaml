  /api/v2/connections:
    get:
      operationId: getConnections
      tags: [connections]
      summary: List connections
      description: |
        The tenant's connections ordered by name (case-insensitive). Requires
        `read:connections`. `enabled_clients` is not part of the list; use
        `/connections/{id}/clients`.

        Offset paging (`page`, `per_page` 1 to 100, 100 by default,
        `include_totals`) answers a bare array, or with totals an object with
        `connections`, `start`, `limit` and `total`. Checkpoint paging, when
        `take` or `from` is present, answers `{connections, next}`: `take` is
        the page size (1 to 100, 50 by default) and `next`, an opaque cursor
        to pass back as `from`, is absent on the last page. It wins over
        `page`, `per_page` and `include_totals`. A `from` that is not a
        cursor this API issued is `400 invalid_query_string`.

        `name` (exact) and `strategy` (repeatable) filter. `fields` always
        returns `id` and `is_domain_connection` too.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/get-connections
      parameters:
        - name: page
          in: query
          description: Page index of the results, from 0.
          schema: {type: integer, minimum: 0, default: 0}
        - name: per_page
          in: query
          description: Number of results per page, 1 to 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - $ref: "#/components/parameters/include_totals"
        - name: take
          in: query
          description: Checkpoint paging page size, 1 to 100 (50 by default).
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: from
          in: query
          description: Checkpoint paging cursor, the `next` of the previous page.
          schema: {type: string}
        - name: name
          in: query
          description: Only the connection with exactly this name.
          schema: {type: string}
        - name: strategy
          in: query
          description: Only connections of these strategies. Repeat the parameter for several.
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - name: fields
          in: query
          description: Comma-separated fields to include or, with `include_fields=false`, to leave out. `id` and `is_domain_connection` are always returned.
          schema: {type: string}
        - $ref: "#/components/parameters/include_fields"
      responses:
        "200":
          description: The page of connections.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items: {$ref: "#/components/schemas/Connection"}
                  - $ref: "#/components/schemas/ConnectionPage"
                  - $ref: "#/components/schemas/ConnectionCheckpointPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createConnection
      tags: [connections]
      summary: Create a connection
      description: |
        Requires `create:connections`. Only the `auth0` (database) strategy is
        supported. Auth0's create defaults apply to what the body leaves out.
        `enabled_clients` is accepted here only, and every ID must be an
        application of the tenant (`400 inexistent_client`). A used name is
        `409 connection_conflict`. Unknown properties are `400 invalid_body`;
        unknown keys inside `options` are stored and returned as sent.
        `options.configuration` values are sealed at rest and returned as
        opaque blobs, never as plaintext.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/post-connections
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConnectionCreate"}
      responses:
        "201":
          description: The new connection, with `enabled_clients`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Connection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v2/connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The connection's ID, `con_` followed by letters and digits; anything else is `400 invalid_uri`.
        schema: {type: string}
    get:
      operationId: getConnection
      tags: [connections]
      summary: Get a connection
      description: |
        Requires `read:connections`. A well-formed unknown ID is
        `404 inexistent_connection`. The body has no `enabled_clients`.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/get-connections
      parameters:
        - name: fields
          in: query
          description: Comma-separated fields to include or, with `include_fields=false`, to leave out. `id` and `is_domain_connection` are always returned.
          schema: {type: string}
        - $ref: "#/components/parameters/include_fields"
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Connection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateConnection
      tags: [connections]
      summary: Update a connection
      description: |
        Requires `update:connections`. `options`, when sent, is replaced
        whole: keys not sent are dropped (`configuration` and the scripts
        included), and the parts of `password_options` not sent take their
        defaults. `name`, `strategy` and `enabled_clients` are unknown
        properties (`400 invalid_body`), as is an empty body. A
        `configuration` value equal to the blob the API returned for that key
        keeps the stored secret; any other string is new plaintext, and
        `null` removes the key.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/patch-connections-by-id
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConnectionUpdate"}
      responses:
        "200":
          description: The updated connection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Connection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteConnection
      tags: [connections]
      summary: Delete a connection
      description: |
        Requires `delete:connections`. Answers `202` with the deletion time;
        the connection is gone at once, with its users (their sessions,
        refresh tokens, grants and password history). The tenant's
        `default_directory` is cleared when it names the connection. A
        second delete of a well-formed ID answers `204`.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/delete-connections-by-id
      responses:
        "202":
          description: Deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionDeleted"}
        "204": {description: "Already deleted."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/connections/{id}/clients:
    parameters:
      - name: id
        in: path
        required: true
        description: The connection's ID, `con_` followed by letters and digits; anything else is `400 invalid_uri`.
        schema: {type: string}
    get:
      operationId: getConnectionClients
      tags: [connections]
      summary: List the applications enabled on a connection
      description: |
        Requires `read:connections`. Checkpoint paging: `take` (1 to 100, 50
        by default) and `from` (the `next` of the previous page; anything else
        is `400 invalid_query_string`). `next` is absent on the last page.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/get-connection-clients
      parameters:
        - name: take
          in: query
          description: Page size, 1 to 100 (50 by default).
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: from
          in: query
          description: Cursor, the `next` of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: The enabled applications.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionClients"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateConnectionClients
      tags: [connections]
      summary: Enable or disable applications on a connection
      description: |
        Requires `update:connections`. A non-empty array of
        `{client_id, status}`: `true` enables, `false` disables. An unknown
        application, or one of another tenant, is `400 inexistent_client`; a
        malformed client ID or an empty array is `400 invalid_body`. Nothing
        changes when any entry is refused.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/patch-clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items: {$ref: "#/components/schemas/ConnectionClientStatus"}
      responses:
        "204": {description: Updated.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v2/users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List or search users
      description: |
        Requires `read:users`. `q` is Auth0's v3 query syntax; `search_engine`
        absent, `v2` or `v3` all mean v3, `v1` is `400 operation_not_supported`
        and anything else `400 invalid_query_string`. Search errors are `400`
        without `errorCode`, with Auth0's `invalid query: …` messages. Results
        are immediately consistent with writes (D-0043).

        `sort` is `field:1` or `field:-1` (`400 invalid_query_string`
        otherwise); unknown and metadata fields are ignored. Without `sort`,
        users are ordered by `last_login` descending, those who never logged
        in last. `connection` keeps users with an identity on that connection.

        Offset paging (`page`, `per_page` 1 to 100, 50 by default). Only the
        first 1000 results can be reached: `(page + 1) × per_page` above 1000
        is `400 invalid_paging`. `include_totals=true` answers
        `{start, limit, length, total, users}`.
      x-source:
        - https://auth0.com/docs/api/management/v2/users/get-users
        - https://auth0.com/docs/manage-users/user-search/user-search-query-syntax
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/include_totals"
        - name: sort
          in: query
          description: "`field:1` (ascending) or `field:-1` (descending)."
          schema: {type: string}
        - name: connection
          in: query
          description: Only users with an identity on this connection.
          schema: {type: string}
        - name: fields
          in: query
          description: Comma-separated fields to include or, with `include_fields=false`, to leave out.
          schema: {type: string}
        - $ref: "#/components/parameters/include_fields"
        - name: q
          in: query
          description: The search, in Auth0's v3 query syntax.
          schema: {type: string}
        - name: search_engine
          in: query
          description: "`v3` (the default); `v2` behaves as `v3`, `v1` is refused."
          schema: {type: string}
      responses:
        "200":
          description: The page of users.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items: {$ref: "#/components/schemas/User"}
                  - $ref: "#/components/schemas/UserPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      description: |
        Requires `create:users`; `app_metadata` also needs
        `create:users_app_metadata` or `update:users_app_metadata`. A missing
        `connection` is `400 invalid_body`; an unknown connection is
        `400 inexistent_connection`. A user whose email (or username) the
        connection already has is `409 auth0_idp_error`. A password the
        connection's policy refuses is `400` without `errorCode`. A supplied
        `user_id` is always prefixed with `auth0|`. `verify_email` (true by
        default for an unverified email) sends the verification email.

        On a custom database connection that is not in import mode, the
        `create` script runs first; its failures are `400 auth0_idp_error`
        (`409` for a `user_exists` ValidationError).
      x-source:
        - https://auth0.com/docs/api/management/v2/users/post-users
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserCreate"}
      responses:
        "201":
          description: The new user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ScriptRuntimeUnavailable"}
  /api/v2/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The user's ID, `provider|id`; anything else is `400 invalid_uri`.
        schema: {type: string}
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      description: |
        Requires `read:users`. A well-formed unknown ID is
        `404 inexistent_user`. A client also granted `read:user_idp_tokens`
        (explicitly: `allow_all_scopes` never implies it) receives
        `identities[].access_token` and `identities[].refresh_token` of
        federated identities, with `Cache-Control: no-store`; lists,
        search, link responses, exports and operators never do (Plan 24).
      x-source:
        - https://auth0.com/docs/api/management/v2/users/get-users-by-id
      parameters:
        - name: fields
          in: query
          description: Comma-separated fields to include or, with `include_fields=false`, to leave out.
          schema: {type: string}
        - $ref: "#/components/parameters/include_fields"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      description: |
        Requires `update:users`; `app_metadata` needs
        `update:users_app_metadata` (which alone allows a body with only
        `app_metadata`). Metadata merges at the top level: a key set to `null`
        is removed, nested objects are replaced, `{}` empties the object. An
        email change clears `email_verified` unless the body sets it. `email`
        and `password` together are `400 operation_not_supported`. An email or
        username another user of the connection has is `409 auth0_idp_error`,
        and nothing changes. Neither a password change nor `blocked: true`
        revokes sessions or refresh tokens.

        On a custom database connection that is not in import mode, an email
        change runs `change_email` and a password change `change_password`
        before anything is stored.
      x-source:
        - https://auth0.com/docs/api/management/v2/users/patch-users-by-id
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserUpdate"}
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ScriptRuntimeUnavailable"}
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: |
        Requires `delete:users`. Answers `204`, also for a well-formed unknown
        ID. The user's sessions, refresh tokens, grants, open tickets, auth
        codes and device codes go with it. On a custom database connection
        that is not in import mode, the `delete` script runs first.
      x-source:
        - https://auth0.com/docs/api/management/v2/users/delete-users-by-id
      responses:
        "204": {description: Deleted.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ScriptRuntimeUnavailable"}
  /api/v2/users/{id}/identities:
    parameters:
      - name: id
        in: path
        required: true
        description: The primary user's ID, `provider|id`; anything else is `400 invalid_uri`.
        schema: {type: string}
    post:
      operationId: linkUserIdentity
      tags: [users]
      summary: Link a user account to this user
      description: |
        Requires `update:users`. The secondary account is named by `provider`
        and `user_id` (its ID without the `provider|` prefix, optionally with
        `connection_id`), or by `link_with`, an ID token issued by this tenant
        to the calling client (its `aud` must be the caller's client ID; its
        `sub` is the secondary). The secondary user stops existing: its
        identity, with its password, moves to the primary with `profileData`
        (`email`, `email_verified`, and `username` when it has one), and its
        sessions, refresh tokens and grants are deleted. Logging in with the
        secondary's credentials then yields the primary user.

        Answers `201` with the primary's identities, each with `profileData`.
        An identity already linked is `409 identity_conflict`; the primary
        itself is `400 operation_not_supported`; an unknown `auth0` secondary
        is `400` without an error code; an unknown secondary of another
        provider, a missing `user_id` and a bad `link_with` are
        `400 invalid_body`; an unknown primary is `404 inexistent_user`.
      x-source:
        - https://auth0.com/docs/api/management/v2/users/post-identities
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserIdentityLink"}
      responses:
        "201":
          description: The primary user's identities.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/UserIdentity"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v2/users/{id}/identities/{provider}/{user_id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The primary user's ID, `provider|id`; anything else is `400 invalid_uri`.
        schema: {type: string}
      - name: provider
        in: path
        required: true
        description: The linked identity's provider, e.g. `auth0`.
        schema: {type: string}
      - name: user_id
        in: path
        required: true
        description: The linked identity's ID within the provider.
        schema: {type: string}
    delete:
      operationId: unlinkUserIdentity
      tags: [users]
      summary: Unlink an identity from a user
      description: |
        Requires `update:users`. The identity leaves the primary and comes
        back as a new user with the same `user_id`, `created_at` = now, only
        `email` and `email_verified` from its `profileData` (and `username`
        when it had one), the default `name` and `nickname`, no picture or
        metadata, and `logins_count` 0. Its password still works.

        Answers `200` with the primary's remaining identities, each with
        `profileData`, also when the identity was not linked. Removing the
        primary's own identity is `400 delete_main_user_identity`.
      x-source:
        - https://auth0.com/docs/api/management/v2/users/delete-user-identity-by-user-id
      responses:
        "200":
          description: The primary user's remaining identities.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/UserIdentity"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v2/users/{id}/sessions:
    parameters:
      - name: id
        in: path
        required: true
        description: The user's ID, `provider|id`; anything else is `400 invalid_uri`.
        schema: {type: string}
    get:
      operationId: getUserSessions
      tags: [users]
      summary: List a user's sessions
      description: |
        Requires `read:sessions`. The user's unexpired sessions, newest first,
        by checkpoint paging only: `take` is 1 to 100 (50 by default) and
        `from` the opaque `next` of the previous page. `next` is present
        whenever the page is not empty, the last page included; an empty list
        has none. `page`, `per_page` and `include_totals` are ignored. A bad
        `from` is `400 invalid_query_string`; an unknown user is
        `404 inexistent_user`.
      x-source:
        - https://auth0.com/docs/api/management/v2/users/get-sessions-for-user
      parameters:
        - name: take
          in: query
          description: Page size, 1 to 100 (50 by default).
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: from
          in: query
          description: The `next` of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: A page of sessions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserSessionPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteUserSessions
      tags: [users]
      summary: Delete a user's sessions
      description: |
        Requires `delete:sessions`. Deletes every session of the user, which
        ends their single sign-on, and bumps the user's version. Refresh
        tokens are not revoked. Answers `202 {}`, also when there were none;
        an unknown user is `404 inexistent_user`.
      x-source:
        - https://auth0.com/docs/api/management/v2/users/delete-sessions-for-user
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v2/users/{id}/refresh-tokens:
    parameters:
      - name: id
        in: path
        required: true
        description: The user's ID, `provider|id`; anything else is `400 invalid_uri`.
        schema: {type: string}
    get:
      operationId: getUserRefreshTokens
      tags: [users]
      summary: List a user's refresh tokens
      description: |
        Requires `read:refresh_tokens`. The user's live refresh tokens (not
        revoked, rotated or expired), newest first, by checkpoint paging only
        as for sessions: `take`, `from`, and `next` on every non-empty page.
        An unknown user is `404 inexistent_user`.
      x-source:
        - https://auth0.com/docs/api/management/v2/users/get-refresh-tokens-for-user
      parameters:
        - name: take
          in: query
          description: Page size, 1 to 100 (50 by default).
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: from
          in: query
          description: The `next` of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: A page of refresh tokens.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserRefreshTokenPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteUserRefreshTokens
      tags: [users]
      summary: Delete a user's refresh tokens
      description: |
        Requires `delete:refresh_tokens`. Revokes every refresh token of the
        user; a refresh grant with one answers `invalid_grant`. Answers
        `202 {}`, also when there were none; an unknown user is
        `404 inexistent_user`.
      x-source:
        - https://auth0.com/docs/api/management/v2/users/delete-refresh-tokens-for-user
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v2/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The session's ID.
        schema: {type: string}
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session
      description: |
        Requires `read:sessions`. An unknown, expired or malformed ID is `404`
        without an `errorCode` ("The session does not exist.").
      x-source:
        - https://auth0.com/docs/api/management/v2/sessions/get-session
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      description: |
        Requires `delete:sessions`. Ends the session, so the next
        `/authorize?prompt=none` answers `login_required`. Answers `202 {}`,
        also when there was no such session.
      x-source:
        - https://auth0.com/docs/api/management/v2/sessions/delete-session
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/refresh-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The refresh token's ID (not the token).
        schema: {type: string}
    get:
      operationId: getRefreshToken
      tags: [refresh-tokens]
      summary: Get a refresh token
      description: |
        Requires `read:refresh_tokens`. An unknown, revoked, expired or
        malformed ID is `404` without an `errorCode` ("The refresh token does
        not exist.").
      x-source:
        - https://auth0.com/docs/api/management/v2/refresh-tokens/get-refresh-token
      responses:
        "200":
          description: The refresh token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserRefreshToken"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteRefreshToken
      tags: [refresh-tokens]
      summary: Delete a refresh token
      description: |
        Requires `delete:refresh_tokens`. Revokes the token and its rotation
        family; a refresh grant with it answers `invalid_grant`. Answers
        `202 {}`, also when there was no such token.
      x-source:
        - https://auth0.com/docs/api/management/v2/refresh-tokens/delete-refresh-token
      responses:
        "202": {$ref: "#/components/responses/Accepted"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/grants:
    get:
      operationId: getGrants
      tags: [grants]
      summary: List user grants
      description: |
        Requires `read:grants`. The users' grants (consents) in grant ID
        order, filtered by `user_id`, `client_id` and `audience`. An unknown
        user is `200 []`. Offset paging; `include_totals=true` answers
        `{grants, start, limit, total}`.
      x-source:
        - https://auth0.com/docs/api/management/v2/grants/get-grants
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/include_totals"
        - name: user_id
          in: query
          description: Only the grants of this user.
          schema: {type: string}
        - name: client_id
          in: query
          description: Only the grants of this application.
          schema: {type: string}
        - name: audience
          in: query
          description: Only the grants for this audience.
          schema: {type: string}
      responses:
        "200":
          description: The page of grants.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items: {$ref: "#/components/schemas/UserGrant"}
                  - $ref: "#/components/schemas/UserGrantPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      operationId: deleteGrantsByUser
      tags: [grants]
      summary: Delete a user's grants
      description: |
        Requires `delete:grants`. Deletes every grant of the user named by
        `user_id`, which is required (`400 invalid_query_string` without it).
        Answers `204`, also when there were none.
      x-source:
        - https://auth0.com/docs/api/management/v2/grants/delete-grants-by-id
      parameters:
        - name: user_id
          in: query
          description: The user whose grants are deleted; required (checked by the handler, for Auth0's error body).
          schema: {type: string}
      responses:
        "204": {description: Deleted.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The grant's ID.
        schema: {type: string}
    delete:
      operationId: deleteGrant
      tags: [grants]
      summary: Delete a grant
      description: |
        Requires `delete:grants`. Answers `204`, also when there was no such
        grant.
      x-source:
        - https://auth0.com/docs/api/management/v2/grants/delete-grants-by-id
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/tickets/password-change:
    post:
      operationId: createPasswordChangeTicket
      tags: [tickets]
      summary: Create a password-change ticket
      description: |
        Requires `create:user_tickets`. A single-use link to the new-password
        form for a database user, named by `user_id` or by `email` together
        with `connection_id`: `https://<tenant host>/u/reset-verify?ticket=<token>#`.
        It is valid for `ttl_sec` seconds (432000, 5 days, when absent or 0).
        `mark_email_as_verified` sets `email_verified` when the password is
        changed. `result_url` is stored, but as on Auth0 the success page
        does not redirect to it.

        `email` without `connection_id`, an empty body, a negative `ttl_sec`,
        `result_url` together with `client_id` and an unknown property are
        `400 invalid_body`; an unknown user is `404 inexistent_user`.
      x-source:
        - https://auth0.com/docs/api/management/v2/tickets/post-password-change
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChangeTicketCreate"}
      responses:
        "201":
          description: The ticket.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ticket"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v2/tickets/email-verification:
    post:
      operationId: createEmailVerificationTicket
      tags: [tickets]
      summary: Create an email verification ticket
      description: |
        Requires `create:user_tickets`. A single-use link that verifies the
        user's email as soon as it is opened:
        `https://<tenant host>/u/email-verification?ticket=<token>#`, valid
        for `ttl_sec` seconds (432000 when absent or 0). With `result_url`
        the page redirects there, appending `success`, `message`, `code`,
        `supportSignUp`, `supportForgotPassword` and, with
        `includeEmailInRedirect`, `email` to its query.

        A missing `user_id`, a negative `ttl_sec`, `result_url` together with
        `client_id` and an unknown property are `400 invalid_body`; an unknown
        user is `404 inexistent_user`.
      x-source:
        - https://auth0.com/docs/api/management/v2/tickets/post-email-verification
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailVerificationTicketCreate"}
      responses:
        "201":
          description: The ticket.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ticket"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v2/jobs/users-imports:
    post:
      operationId: createUsersImportJob
      tags: [jobs]
      summary: Import users from a file
      description: |
        Requires `create:users`. A `multipart/form-data` body of at most
        512000 bytes, framing included (`413` above, without `errorCode`):
        the `users` file (a JSON array of users in Auth0's import schema),
        `connection_id` (a database connection enabled for at least one
        application; a custom database must be in import mode), `upsert`
        (`true` updates the users the file names by email; anything else
        does not), `send_completion_email` (anything but `false` emails the
        tenant's operators when the job ends) and `external_id` (echoed).
        Answers `202` with the job. A tenant may have 2 import jobs pending
        or running; a third is `429` without `errorCode`.

        A missing `users` or `connection_id` part, or a malformed
        `connection_id`, is `400 invalid_body`; an empty file, a connection
        that is not a database connection, or a custom database without
        import mode is `400 operation_not_supported`; an unknown connection
        is `400 inexistent_connection`; a connection enabled for no
        application is `400 connection_is_disabled`. A file that is not a
        JSON array is accepted and the job fails; each record that fails
        is listed by `GET /jobs/{id}/errors`, with its hashes masked.
      x-source:
        - https://auth0.com/docs/api/management/v2/jobs/post-users-imports
        - https://auth0.com/docs/manage-users/user-migration/bulk-user-imports
        - https://auth0.com/docs/manage-users/user-migration/bulk-user-import-database-schema-and-examples
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/UsersImportJobCreate"}
      responses:
        "202":
          description: The job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          description: The body is over 512000 bytes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagementError"}
        "429":
          description: The tenant already has 2 active import jobs.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagementError"}
  /api/v2/jobs/users-exports:
    post:
      operationId: createUsersExportJob
      tags: [jobs]
      summary: Export users to a file
      description: |
        Requires `read:users`. A JSON body (an empty body is `{}`; form-encoded
        bodies are not accepted); unknown
        properties, `limit` below 1, `format` other than `json` or `csv` and
        more than 30 `fields` are `400 invalid_body`. Answers `200` with the
        job, echoing `connection_id`, `connection`, `format` (default `csv`),
        `limit` and `fields` as given. Without `connection_id` every
        connection is exported, and without `limit` every user.

        A worker writes a gzipped file, users in `user_id` order: newline
        delimited JSON (one object per user, the key of each field being its
        `export_as` or its name, fields without a value left out) or CSV
        (a header of the same names; strings quoted with a leading `'`,
        numbers, booleans and dates bare, objects and arrays empty).
        Without `fields`, the columns are `user_id`, `email`, `name`,
        `family_name`, `given_name`, `phone_number`, `nickname`, `username`,
        `last_ip`, `logins_count`, `created_at`, `updated_at`, `deleted_at`,
        `last_login`, `blocked`, `deleted`, `email_verified`,
        `phone_verified` and `identities.[0].connection`. A field name is a
        user property, a dotted path into it (`user_metadata.plan`,
        `identities.[0].connection`) or anything else, which is an empty
        value. A password hash is never exported.

        A completed job has a `location` that works for 60 seconds, new at
        every `GET /jobs/{id}`.
      x-source:
        - https://auth0.com/docs/api/management/v2/jobs/post-users-exports
        - https://auth0.com/docs/manage-users/user-migration/bulk-user-exports
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UsersExportJobCreate"}
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/custom-domains:
    get:
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {$ref: "#/components/parameters/fields"}
        - {$ref: "#/components/parameters/include_fields"}
        - {name: sort, in: query, schema: {type: string}}
      operationId: getCustomDomains
      tags: [custom-domains]
      summary: List custom domains
      description: |
        API custom domains of the tenant. `q` accepts at most eight exact
        quoted `domain`, `status` or `type` terms joined with `AND` (1024 bytes);
        `fields`/`include_fields` project the listed public fields and `sort`
        accepts `domain:1`. Operator aliases never appear here.

        Requires `read:custom_domains`.
      x-source:
        - https://auth0.com/docs/api/management/v2/custom-domains/get-custom-domains
      responses:
        "200":
          description: The custom domains.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CustomDomain"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    post:
      operationId: createCustomDomain
      tags: [custom-domains]
      summary: Create a custom domain
      description: |
        Claims `domain` (pending) and returns its TXT ownership proof. The
        domain is never ready on creation. `auth0_managed_certs` needs this
        deployment's ACME issuance (`503` otherwise); `self_managed_certs` needs
        origin TLS for the origin namespace. At most 100 domains per tenant.

        Requires `create:custom_domains`.
      x-source:
        - https://auth0.com/docs/api/management/v2/custom-domains/post-custom-domains
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustomDomainCreate"}
      responses:
        "201":
          description: The new custom domain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomDomain"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v2/custom-domains/default:
    get:
      operationId: getDefaultCustomDomain
      tags: [custom-domains]
      summary: Get the default custom domain
      description: |
        The configured default custom domain, also while it is temporarily
        unavailable, or `{"domain": <canonical host>}` when the canonical host
        is the default.

        Requires `read:custom_domains`.
      x-source:
        - https://auth0.com/docs/api/management/v2/custom-domains/get-default
      responses:
        "200":
          description: The default domain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomDomain"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    patch:
      operationId: setDefaultCustomDomain
      tags: [custom-domains]
      summary: Set the default custom domain
      description: |
        `domain` names a ready custom domain of this tenant, or the canonical
        host (which clears the default). New notification links use it.

        Requires `update:custom_domains`.
      x-source:
        - https://auth0.com/docs/api/management/v2/custom-domains/patch-default
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustomDomainDefaultUpdate"}
      responses:
        "200":
          description: The default domain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomDomain"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v2/custom-domains/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The custom domain's ID.
        schema: {type: string}
    get:
      operationId: getCustomDomain
      tags: [custom-domains]
      summary: Get a custom domain
      description: |
        One custom domain. Proxy keys and private material are never shown.

        Requires `read:custom_domains`.
      x-source:
        - https://auth0.com/docs/api/management/v2/custom-domains/get-custom-domains-by-id
      responses:
        "200":
          description: The custom domain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomDomain"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    patch:
      operationId: updateCustomDomain
      tags: [custom-domains]
      summary: Update a custom domain
      description: |
        Changes `tls_policy`, `custom_client_ip_header` (null or empty disables
        the override), `domain_metadata` and `relying_party_identifier`.

        Requires `update:custom_domains`.
      x-source:
        - https://auth0.com/docs/api/management/v2/custom-domains/patch-custom-domains-by-id
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CustomDomainUpdate"}
      responses:
        "200":
          description: The custom domain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomDomain"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
    delete:
      operationId: deleteCustomDomain
      tags: [custom-domains]
      summary: Delete a custom domain
      description: |
        Stops serving the domain, releases its names and clears it as default.

        Requires `delete:custom_domains`.
      x-source:
        - https://auth0.com/docs/api/management/v2/custom-domains/delete-custom-domains-by-id
      responses:
        "204": {description: Deleted.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v2/custom-domains/{id}/verify:
    parameters:
      - name: id
        in: path
        required: true
        description: The custom domain's ID.
        schema: {type: string}
    post:
      operationId: verifyCustomDomain
      tags: [custom-domains]
      summary: Verify a custom domain
      description: |
        Checks the TXT proof. A self-managed domain becomes ready here, and
        the first successful call alone returns `cname_api_key`, the proxy key.
        One attempt per domain per 30 seconds and 20 per tenant per minute.

        Requires `update:custom_domains`.
      x-source:
        - https://auth0.com/docs/api/management/v2/custom-domains/post-verify
      responses:
        "200":
          description: The custom domain.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CustomDomainVerified"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /api/v2/custom-domains/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        description: The custom domain's ID.
        schema: {type: string}
    post:
      operationId: testCustomDomain
      tags: [custom-domains]
      summary: Test a custom domain
      description: |
        Fetches the domain's discovery document over a bounded, address-checked
        connection. A not-ready domain is `409`; an observed failure is `200`
        with `success: false`.

        Requires `update:custom_domains`.
      x-source:
        - https://auth0.com/docs/api/management/v2/custom-domains/post-test-domain
