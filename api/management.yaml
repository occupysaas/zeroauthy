# api/management.yaml
openapi: 3.1.0
info:
  title: zeroauthy Management API
  version: 0.1.0
  summary: Auth0-compatible Management API served by every zeroauthy tenant, and zeroauthy's system API.
  description: |
    The Management API of a zeroauthy tenant, at `https://{tenant_domain}/api/v2/`
    on every host of the tenant. It is wire-compatible with the Auth0
    Management API for the operations it lists.

    Callers present a bearer access token of one of two kinds:

    - `managementToken`: a client credentials token of the tenant whose
      audience is the tenant's canonical Management API identifier,
      `https://{name}.{base_domain}/api/v2/` (or the first of the tenant's
      domains when there is no base domain), with scopes from a client grant.
    - `operatorToken`: a token of the `system` tenant for the audience
      `urn:zeroauthy:management`, carrying the
      `https://zeroauthy.dev/operator` claim. It holds every scope on the
      tenants the operator manages.

    The system API, at `/api/system/` on the system host only, accepts
    operator tokens only. It has no Auth0 equivalent.

    Errors have Auth0's shape (`ManagementError`). Lists page with `page`,
    `per_page` and `include_totals`: a bare array without totals, an object
    with the list, `start`, `limit` and `total` with them.

    Every operation lists the public documents it was derived from in
    `x-source`. zeroauthy is a clean-room implementation; see `CLEAN_ROOM.md`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: tenant.example.com
        description: Any domain of the tenant.
tags:
  - name: logs
    description: Tenant authentication and Management event search.
  - name: log-streams
    description: Tenant log stream configuration.
  - name: stats
    description: Daily authentication counters and active users.
  - name: actions
    description: Actions, immutable versions, trigger bindings and executions.
  - name: branding
    description: Tenant branding, themes and Universal Login page template.
  - name: prompts
    description: Universal Login prompt settings, text and partials.
  - name: signing-keys
    description: Tenant managed and stored-only custom signing keys.
  - name: retired-resources
    description: Read-only empty compatibility collections for retired extensibility.
  - name: attack-protection
    description: Tenant attack protection policies.
  - name: user-blocks
    description: Automatic login and suspicious-IP blocks.
  - name: clients
    description: Applications (Auth0's `/api/v2/clients`).
  - name: resource-servers
    description: APIs (Auth0's `/api/v2/resource-servers`).
  - name: client-grants
    description: Applications' access to APIs (Auth0's `/api/v2/client-grants`).
  - name: connections
    description: Database connections (Auth0's `/api/v2/connections`).
  - name: users
    description: Users (Auth0's `/api/v2/users` and `/api/v2/users-by-email`).
  - name: sessions
    description: Login sessions (Auth0's `/api/v2/sessions`).
  - name: refresh-tokens
    description: Refresh tokens (Auth0's `/api/v2/refresh-tokens`).
  - name: grants
    description: Users' consents (Auth0's `/api/v2/grants`).
  - name: tickets
    description: Password-change and email verification links (Auth0's `/api/v2/tickets`).
  - name: jobs
    description: "Background jobs (verification emails; Auth0's `/api/v2/jobs`)."
  - name: organizations
    description: Organizations, their enabled connections and (read-only) client grants.
  - name: system
    description: zeroauthy's own API for tenants and operators (operator tokens only).
security:
  - managementToken: []
  - operatorToken: []
