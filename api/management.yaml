          additionalProperties:
            oneOf:
              - {type: string, maxLength: 1024}
              - {type: array, maxItems: 16, items: {type: string, maxLength: 1024}}
        user_id_attribute: {type: string, maxLength: 1024, description: Attribute used as the user ID; defaults to the NameID.}
