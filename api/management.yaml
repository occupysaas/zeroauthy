# api/management.yaml
openapi: 3.1.0
info:
  title: zeroauthy Management API
  version: 0.1.0
  summary: Auth0-compatible Management API served by every zeroauthy tenant, and zeroauthy's system API.
  description: |
    The Management API of a zeroauthy tenant, at `https://{tenant_domain}/api/v2/`
    on every host of the tenant. It is wire-compatible with the Auth0
    Management API for the operations it lists.

    Callers present a bearer access token of one of two kinds:

    - `managementToken`: a client credentials token of the tenant whose
      audience is the tenant's canonical Management API identifier,
      `https://{name}.{base_domain}/api/v2/` (or the first of the tenant's
      domains when there is no base domain), with scopes from a client grant.
    - `operatorToken`: a token of the `system` tenant for the audience
      `urn:zeroauthy:management`, carrying the
      `https://zeroauthy.dev/operator` claim. It holds every scope on the
      tenants the operator manages.

    The system API, at `/api/system/` on the system host only, accepts
    operator tokens only. It has no Auth0 equivalent.

    Errors have Auth0's shape (`ManagementError`). Lists page with `page`,
    `per_page` and `include_totals`: a bare array without totals, an object
    with the list, `start`, `limit` and `total` with them.

    Every operation lists the public documents it was derived from in
    `x-source`. zeroauthy is a clean-room implementation; see `CLEAN_ROOM.md`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: tenant.example.com
        description: Any domain of the tenant.
tags:
  - name: clients
    description: Applications (Auth0's `/api/v2/clients`).
  - name: resource-servers
    description: APIs (Auth0's `/api/v2/resource-servers`).
  - name: client-grants
    description: Applications' access to APIs (Auth0's `/api/v2/client-grants`).
  - name: connections
    description: Database connections (Auth0's `/api/v2/connections`).
  - name: users
    description: Users (Auth0's `/api/v2/users` and `/api/v2/users-by-email`).
  - name: system
    description: zeroauthy's own API for tenants and operators (operator tokens only).
security:
  - managementToken: []
  - operatorToken: []
paths:
  /api/v2/clients:
    get:
      operationId: getClients
      tags: [clients]
      summary: List applications
      description: |
        The tenant's applications in creation order. Requires `read:clients`;
        `client_secret` is returned only with `read:client_keys`.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/get-clients
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/include_totals"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/include_fields"
        - name: app_type
          in: query
          description: Comma-separated application types to return.
          schema: {type: string}
        - name: is_first_party
          in: query
          description: Return only first-party (true) or third-party (false) applications.
          schema: {type: boolean}
      responses:
        "200":
          description: The page of applications.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: "#/components/schemas/Client"}
                  - $ref: "#/components/schemas/ClientPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createClient
      tags: [clients]
      summary: Create an application
      description: |
        Requires `create:clients`. Fields left out get the defaults described
        in `ClientCreate`; `client_secret` is returned only with
        `read:client_keys`.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/post-clients
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientCreate"}
      responses:
        "201":
          description: The new application.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The application's client ID.
        schema: {type: string}
    get:
      operationId: getClient
      tags: [clients]
      summary: Get an application
      description: Requires `read:clients`; `client_secret` is returned only with `read:client_keys`.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/get-clients-by-id
      parameters:
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/include_fields"
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update an application
      description: |
        Requires `update:clients`; setting `client_secret` requires
        `update:client_keys` (alone, for a body with only `client_secret`).
        `is_first_party` and `third_party_security_mode` cannot change after
        creation.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/patch-clients-by-id
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientUpdate"}
      responses:
        "200":
          description: The updated application.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete an application
      description: |
        Requires `delete:clients`. The application's refresh tokens, client
        grants and user grants are deleted with it, and it is removed from
        every connection. Deleting an unknown ID also answers 204.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/delete-clients-by-id
      responses:
        "204": {description: "Deleted, or did not exist."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/clients/{id}/rotate-secret:
    parameters:
      - name: id
        in: path
        required: true
        description: The application's client ID.
        schema: {type: string}
    post:
      operationId: rotateClientSecret
      tags: [clients]
      summary: Rotate an application's secret
      description: |
        Requires `update:client_keys`. The old secret stops working at once.
        The response carries the new secret.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/post-rotate-secret
      responses:
        "200":
          description: The application with its new secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v2/resource-servers:
    get:
      operationId: getResourceServers
      tags: [resource-servers]
      summary: List APIs
      description: |
        The tenant's APIs in creation order, the tenant's Management API
        first. Requires `read:resource_servers`. Checkpoint paging (`from`,
        `take`) is not supported (`invalid_query_string`).
      x-source:
        - https://auth0.com/docs/api/management/v2/resource-servers/get-resource-servers
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/include_totals"
        - name: identifiers
          in: query
          description: |
            Return only the APIs with these identifiers. Repeat the parameter
            for several; a comma does not separate identifiers.
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - name: fields
          in: query
          description: Comma-separated fields to include or, with `include_fields=false`, to leave out. No field is always returned.
          schema: {type: string}
        - $ref: "#/components/parameters/include_fields"
      responses:
        "200":
          description: The page of APIs.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: "#/components/schemas/ResourceServer"}
                  - $ref: "#/components/schemas/ResourceServerPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createResourceServer
      tags: [resource-servers]
      summary: Create an API
      description: |
        Requires `create:resource_servers`. Fields left out get the defaults
        described in `ResourceServerCreate`.
      x-source:
        - https://auth0.com/docs/api/management/v2/resource-servers/post-resource-servers
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResourceServerCreate"}
      responses:
        "201":
          description: The new API.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResourceServer"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v2/resource-servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The API's ID. `GET` also accepts its URL-encoded identifier.
        schema: {type: string}
    get:
      operationId: getResourceServer
      tags: [resource-servers]
      summary: Get an API
      description: Requires `read:resource_servers`.
      x-source:
        - https://auth0.com/docs/api/management/v2/resource-servers/get-resource-servers-by-id
      parameters:
        - name: fields
          in: query
          description: Comma-separated fields to include or, with `include_fields=false`, to leave out. No field is always returned.
          schema: {type: string}
        - $ref: "#/components/parameters/include_fields"
      responses:
        "200":
          description: The API.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResourceServer"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateResourceServer
      tags: [resource-servers]
      summary: Update an API
      description: |
        Requires `update:resource_servers`. `identifier`, `id` and
        `is_system` are not accepted. `scopes` replaces the whole list, and
        a removed scope is removed from every client grant that carries it.
        A system API (a tenant's Management API, the system tenant's
        `urn:zeroauthy:management`) accepts no `name`, and keeps its scopes
        and the settings zeroauthy depends on; naming one of those with its
        current value is accepted.
      x-source:
        - https://auth0.com/docs/api/management/v2/resource-servers/patch-resource-servers-by-id
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResourceServerUpdate"}
      responses:
        "200":
          description: The updated API.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResourceServer"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteResourceServer
      tags: [resource-servers]
      summary: Delete an API
      description: |
        Requires `delete:resource_servers`. The API's client grants and the
        user grants (consents) for it are deleted with it, and refresh tokens
        issued for it stop working; access tokens already issued stay valid
        until they expire. Deleting an unknown or malformed ID also answers
        204. A system API cannot be deleted (`delete_system_resource_server`).
      x-source:
        - https://auth0.com/docs/api/management/v2/resource-servers/delete-resource-servers-by-id
      responses:
        "204": {description: "Deleted, or did not exist."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/client-grants:
    get:
      operationId: getClientGrants
      tags: [client-grants]
      summary: List client grants
      description: |
        The tenant's client grants in grant ID order (byte order). Requires
        `read:client_grants`.

        Offset paging (`page`, `per_page`, `include_totals`) answers a bare
        array, or with totals an object with `client_grants`, `start`,
        `limit` and `total`. Checkpoint paging, when `take` or `from` is
        present, answers `{client_grants, next}`: `take` is the page size
        (1 to 100, 50 by default) and `next`, an opaque cursor to pass back
        as `from`, is absent on the last page. It wins over `page`,
        `per_page` and `include_totals`. A `from` that is not a cursor this
        API issued is `400` without an `errorCode`.

        `client_id`, `audience` and `subject_type` filter and combine;
        `subject_type` (`client` or `user`) needs `client_id` or `audience`
        too, otherwise the answer is `400` without an `errorCode`.
      x-source:
        - https://auth0.com/docs/api/management/v2/client-grants/get-client-grants
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/include_totals"
        - name: take
          in: query
          description: Checkpoint paging page size, 1 to 100 (50 by default).
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: from
          in: query
          description: Checkpoint paging cursor, the `next` of the previous page.
          schema: {type: string}
        - name: client_id
          in: query
          description: Only the grants of this application.
          schema: {type: string}
        - name: audience
          in: query
          description: Only the grants for this API identifier (case-sensitive).
          schema: {type: string}
        - name: subject_type
          in: query
          description: Only grants of this subject type; needs `client_id` or `audience`.
          schema: {type: string}
      responses:
        "200":
          description: The page of client grants.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items: {$ref: "#/components/schemas/ClientGrant"}
                  - $ref: "#/components/schemas/ClientGrantPage"
                  - $ref: "#/components/schemas/ClientGrantCheckpointPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createClientGrant
      tags: [client-grants]
      summary: Create a client grant
      description: |
        Requires `create:client_grants`. The application and the API (by
        identifier, case-sensitive) must exist in the tenant
        (`inexistent_client`, `inexistent_resource_server`). One grant per
        application, API and subject type (`client_grant_conflict`). Every
        scope must be one the API defines (`invalid_body`); this differs
        from Auth0, which checks only on update. A grant to the tenant's own
        Management API carries Management API scopes only and has
        `subject_type` `client`; a grant to another tenant's Management API
        or to `urn:zeroauthy:management` is refused (`invalid_body`).
      x-source:
        - https://auth0.com/docs/api/management/v2/client-grants/post-client-grants
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientGrantCreate"}
      responses:
        "201":
          description: The new client grant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v2/client-grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The grant's ID, `cgr_` followed by letters and digits; anything else is `400 invalid_uri`.
        schema: {type: string}
    get:
      operationId: getClientGrant
      tags: [client-grants]
      summary: Get a client grant
      description: Requires `read:client_grants`. An unknown ID is `404 inexistent_client_grant`.
      x-source:
        - https://auth0.com/docs/api/management/v2/client-grants/get-client-grants
      responses:
        "200":
          description: The client grant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateClientGrant
      tags: [client-grants]
      summary: Update a client grant
      description: |
        Requires `update:client_grants`. Changes `scope` (replaced whole) or
        `allow_all_scopes`; `client_id`, `audience` and `subject_type` are
        unknown properties. An empty body is `invalid_body`. A scope the API
        does not define is `invalid_body`. An unknown ID in the right format
        is `404 inexistent_client_grant`.
      x-source:
        - https://auth0.com/docs/api/management/v2/client-grants/patch-client-grants-by-id
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientGrantUpdate"}
      responses:
        "200":
          description: The updated client grant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClientGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteClientGrant
      tags: [client-grants]
      summary: Delete a client grant
      description: |
        Requires `delete:client_grants`. An unknown ID in the right format,
        and a second delete, also answer 204. Tokens already issued stay
        valid until they expire; refresh tokens stop refreshing.
      x-source:
        - https://auth0.com/docs/api/management/v2/client-grants/delete-client-grants-by-id
      responses:
        "204": {description: "Deleted, or did not exist."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/connections:
    get:
      operationId: getConnections
      tags: [connections]
      summary: List connections
      description: |
        The tenant's connections ordered by name (case-insensitive). Requires
        `read:connections`. `enabled_clients` is not part of the list; use
        `/connections/{id}/clients`.

        Offset paging (`page`, `per_page` 1 to 100, 100 by default,
        `include_totals`) answers a bare array, or with totals an object with
        `connections`, `start`, `limit` and `total`. Checkpoint paging, when
        `take` or `from` is present, answers `{connections, next}`: `take` is
        the page size (1 to 100, 50 by default) and `next`, an opaque cursor
        to pass back as `from`, is absent on the last page. It wins over
        `page`, `per_page` and `include_totals`. A `from` that is not a
        cursor this API issued is `400 invalid_query_string`.

        `name` (exact) and `strategy` (repeatable) filter. `fields` always
        returns `id` and `is_domain_connection` too.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/get-connections
      parameters:
        - name: page
          in: query
          description: Page index of the results, from 0.
          schema: {type: integer, minimum: 0, default: 0}
        - name: per_page
          in: query
          description: Number of results per page, 1 to 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - $ref: "#/components/parameters/include_totals"
        - name: take
          in: query
          description: Checkpoint paging page size, 1 to 100 (50 by default).
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: from
          in: query
          description: Checkpoint paging cursor, the `next` of the previous page.
          schema: {type: string}
        - name: name
          in: query
          description: Only the connection with exactly this name.
          schema: {type: string}
        - name: strategy
          in: query
          description: Only connections of these strategies. Repeat the parameter for several.
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - name: fields
          in: query
          description: Comma-separated fields to include or, with `include_fields=false`, to leave out. `id` and `is_domain_connection` are always returned.
          schema: {type: string}
        - $ref: "#/components/parameters/include_fields"
      responses:
        "200":
          description: The page of connections.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items: {$ref: "#/components/schemas/Connection"}
                  - $ref: "#/components/schemas/ConnectionPage"
                  - $ref: "#/components/schemas/ConnectionCheckpointPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createConnection
      tags: [connections]
      summary: Create a connection
      description: |
        Requires `create:connections`. Only the `auth0` (database) strategy is
        supported. Auth0's create defaults apply to what the body leaves out.
        `enabled_clients` is accepted here only, and every ID must be an
        application of the tenant (`400 inexistent_client`). A used name is
        `409 connection_conflict`. Unknown properties are `400 invalid_body`;
        unknown keys inside `options` are stored and returned as sent.
        `options.configuration` values are sealed at rest and returned as
        opaque blobs, never as plaintext.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/post-connections
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConnectionCreate"}
      responses:
        "201":
          description: The new connection, with `enabled_clients`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Connection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/v2/connections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The connection's ID, `con_` followed by letters and digits; anything else is `400 invalid_uri`.
        schema: {type: string}
    get:
      operationId: getConnection
      tags: [connections]
      summary: Get a connection
      description: |
        Requires `read:connections`. A well-formed unknown ID is
        `404 inexistent_connection`. The body has no `enabled_clients`.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/get-connections
      parameters:
        - name: fields
          in: query
          description: Comma-separated fields to include or, with `include_fields=false`, to leave out. `id` and `is_domain_connection` are always returned.
          schema: {type: string}
        - $ref: "#/components/parameters/include_fields"
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Connection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateConnection
      tags: [connections]
      summary: Update a connection
      description: |
        Requires `update:connections`. `options`, when sent, is replaced
        whole: keys not sent are dropped (`configuration` and the scripts
        included), and the parts of `password_options` not sent take their
        defaults. `name`, `strategy` and `enabled_clients` are unknown
        properties (`400 invalid_body`), as is an empty body. A
        `configuration` value equal to the blob the API returned for that key
        keeps the stored secret; any other string is new plaintext, and
        `null` removes the key.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/patch-connections-by-id
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConnectionUpdate"}
      responses:
        "200":
          description: The updated connection.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Connection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteConnection
      tags: [connections]
      summary: Delete a connection
      description: |
        Requires `delete:connections`. Answers `202` with the deletion time;
        the connection is gone at once, with its users (their sessions,
        refresh tokens, grants and password history). The tenant's
        `default_directory` is cleared when it names the connection. A
        second delete of a well-formed ID answers `204`.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/delete-connections-by-id
      responses:
        "202":
          description: Deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionDeleted"}
        "204": {description: "Already deleted."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/connections/{id}/clients:
    parameters:
      - name: id
        in: path
        required: true
        description: The connection's ID, `con_` followed by letters and digits; anything else is `400 invalid_uri`.
        schema: {type: string}
    get:
      operationId: getConnectionClients
      tags: [connections]
      summary: List the applications enabled on a connection
      description: |
        Requires `read:connections`. Checkpoint paging: `take` (1 to 100, 50
        by default) and `from` (the `next` of the previous page; anything else
        is `400 invalid_query_string`). `next` is absent on the last page.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/get-connection-clients
      parameters:
        - name: take
          in: query
          description: Page size, 1 to 100 (50 by default).
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: from
          in: query
          description: Cursor, the `next` of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: The enabled applications.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionClients"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateConnectionClients
      tags: [connections]
      summary: Enable or disable applications on a connection
      description: |
        Requires `update:connections`. A non-empty array of
        `{client_id, status}`: `true` enables, `false` disables. An unknown
        application, or one of another tenant, is `400 inexistent_client`; a
        malformed client ID or an empty array is `400 invalid_body`. Nothing
        changes when any entry is refused.
      x-source:
        - https://auth0.com/docs/api/management/v2/connections/patch-clients
      requestBody:
