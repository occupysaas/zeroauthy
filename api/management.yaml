components:
  securitySchemes:
    managementToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A client credentials access token of this tenant for its Management
        API identifier, with the scopes the operation names.
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A console operator's access token from the `system` tenant, audience
        `urn:zeroauthy:management`, with the `https://zeroauthy.dev/operator`
        claim.
  parameters:
    page:
      name: page
      in: query
      description: Page index of the results, from 0.
      schema: {type: integer, minimum: 0, default: 0}
    per_page:
      name: per_page
      in: query
      description: Number of results per page; more than 100 is refused (`invalid_query_string`).
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    include_totals:
      name: include_totals
      in: query
      description: Return an object with the list and `start`, `limit` and `total` instead of a bare array.
      schema: {type: boolean, default: false}
    fields:
      name: fields
      in: query
      description: Comma-separated fields to include or, with `include_fields=false`, to leave out. `tenant` is always returned.
      schema: {type: string}
    include_fields:
      name: include_fields
      in: query
      description: Whether `fields` lists the fields to include (true) or to leave out (false).
      schema: {type: boolean, default: true}
    organizationId:
      name: id
      in: path
      required: true
      description: 'Organization ID, `org_` and 16 letters or digits; another shape is 400 `invalid_uri`.'
      schema: {type: string}
    memberUserId:
      name: user_id
      in: path
      required: true
      description: The member's user ID.
      schema: {type: string}
  schemas:
    GroupID:
      type: string
      minLength: 18
      maxLength: 26
      pattern: ^grp_[1-9a-km-zA-HJ-NP-Z]{14,22}$
      description: '`grp_` and 14 to 22 base58 characters.'
    Group:
      type: object
      additionalProperties: false
      description: A directory group (Plan 37c). Groups belong to one connection and are created by SCIM. No property is required because `fields` can project any away.
      properties:
        id:
          $ref: '#/components/schemas/GroupID'
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[\x20-\x7E]+$
          description: Unique within its connection.
        external_id:
          type: string
          maxLength: 256
        connection_id:
          type: string
        tenant_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GroupPage:
      type: object
      additionalProperties: false
      required:
      - groups
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        next:
          type: string
        start:
          type: number
        limit:
          type: number
        total:
          type: number
    GroupCheckpoint:
      type: object
      additionalProperties: false
      required:
      - groups
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        next:
          type: string
    UserGroup:
      type: object
      additionalProperties: false
      description: A group of the user, with the membership's creation time.
      properties:
        id:
          $ref: '#/components/schemas/GroupID'
        name:
          type: string
        external_id:
          type: string
        connection_id:
          type: string
        tenant_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        membership_created_at:
          type: string
          format: date-time
    UserGroupPage:
      type: object
      additionalProperties: false
      required:
      - groups
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/UserGroup'
        next:
          type: string
        start:
          type: number
        limit:
          type: number
        total:
          type: number
    GroupMember:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        member_type:
          type: string
          enum:
          - user
          - group
        type:
          type: string
          enum:
          - connection
          - organization
          - tenant
        connection_id:
          type: string
        created_at:
          type: string
          format: date-time
    GroupMemberPage:
      type: object
      additionalProperties: false
      required:
      - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
        next:
          type: string
    GroupRolePage:
      type: object
      additionalProperties: false
      required:
      - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        next:
          type: string
    RoleIDList:
      type: object
      additionalProperties: false
      required:
      - roles
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
    GroupIDList:
      type: object
      additionalProperties: false
      required:
      - groups
      properties:
        groups:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/GroupID'
    SelfServiceProfileBrandingProperties:
      type: object
      additionalProperties: true
      properties:
        logo_url:
          type: string
          maxLength: 1024
          format: uri
          pattern: ^https://
        colors:
          $ref: '#/components/schemas/SelfServiceProfileBrandingColors'
    ConnectionProfileTemplateItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          description: The id of the template.
        display_name:
          type: string
          description: The user-friendly name of the template displayed in the UI.
        template:
          $ref: '#/components/schemas/ConnectionProfileTemplate'
    SelfServiceProfileUserAttribute:
      type: object
      additionalProperties: false
      required:
      - name
      - description
      - is_optional
      properties:
        name:
          type: string
          description: Identifier of this attribute.
          maxLength: 250
        description:
          type: string
