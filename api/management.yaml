    ConnectionOptionsEmail:
      type: object
      description: |
        Options of the `email` passwordless connection (name `email`).
        `authParams` is a JSON object encoded as a string, merged into magic
        links. `email.body` is Liquid with `code`, `link`, `application.name`,
        `request_language`, `operation` and `organization.*`.
      additionalProperties: true
      properties:
        name: {type: string, minLength: 3, maxLength: 128}
        authParams: {type: string, minLength: 1, maxLength: 1024}
        brute_force_protection: {type: boolean}
        disable_signup: {type: boolean}
        email:
          type: object
          additionalProperties: false
          properties:
            body: {type: string, minLength: 1, maxLength: 20480}
            from: {type: string, minLength: 1, maxLength: 1024}
            subject: {type: string, minLength: 1, maxLength: 1024}
            syntax: {type: string, const: liquid}
        totp: {$ref: '#/components/schemas/ConnectionTotp'}
        non_persistent_attrs:
          type: array
          maxItems: 96
          items: {type: string, maxLength: 255}
    ConnectionOptionsSMS:
      type: object
      description: |
        Options of the `sms` passwordless connection (name `sms`).
        `twilio_token` and `gateway_authentication.secret` are sealed,
        write-only and never returned. With `phone_consolidated_experience`
        on, `provider`, the Twilio and gateway fields, `from`, `template` and
        `syntax` are ignored in favour of the tenant phone provider and the
        `otp_verify` template (D-0060 P7).
      additionalProperties: true
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        brute_force_protection: {type: boolean}
        disable_signup: {type: boolean}
        forward_req_info: {type: boolean}
        from: {type: string, minLength: 1, maxLength: 128}
        provider: {type: string, enum: [sms_gateway, twilio]}
        syntax: {type: string, enum: [liquid, md_with_macros]}
        template: {type: string, minLength: 1, maxLength: 5120}
        totp: {$ref: '#/components/schemas/ConnectionTotp'}
        twilio_sid: {type: string, pattern: '^AC[0-9a-fA-F]{32}$'}
        twilio_token: {type: string, minLength: 32, maxLength: 2048, writeOnly: true}
        messaging_service_sid: {type: string, pattern: '^MG[0-9a-fA-F]{32}$'}
        gateway_url: {type: string, format: uri, pattern: '^https://', maxLength: 255}
        gateway_authentication:
          type: [object, 'null']
          required: [audience, method, secret]
          additionalProperties: true
          properties:
            audience: {type: string, minLength: 1, maxLength: 128}
            method: {type: string, minLength: 1, maxLength: 20}
            secret: {type: string, minLength: 1, maxLength: 5120, writeOnly: true}
            secret_base64_encoded: {type: boolean, default: false}
            subject: {type: string, minLength: 1, maxLength: 64}
        non_persistent_attrs:
          type: array
          maxItems: 96
          items: {type: string, maxLength: 255}
