        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/include_totals"
        - name: sort
          in: query
          description: "`field:1` (ascending) or `field:-1` (descending)."
          schema: {type: string}
        - name: connection
          in: query
          description: |
            This Auth0 v1-only parameter is ignored by zeroauthy. It must be
            valid UTF-8 without NUL characters. Use `q` to filter by connection.
          schema: {type: string}
        - name: fields
          in: query
          description: Comma-separated fields to include or, with `include_fields=false`, to leave out.
          schema: {type: string}
        - $ref: "#/components/parameters/include_fields"
        - name: q
          in: query
          description: The search, in Auth0's v3 query syntax.
          schema: {type: string}
        - name: search_engine
          in: query
          description: "`v3` (the default); `v2` behaves as `v3`, `v1` is refused."
          schema: {type: string}
      responses:
        "200":
          description: The page of users.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items: {$ref: "#/components/schemas/User"}
                  - $ref: "#/components/schemas/UserPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
