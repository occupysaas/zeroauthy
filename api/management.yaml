# api/management.yaml
openapi: 3.1.0
info:
  title: zeroauthy Management API
  version: 0.1.0
  summary: Auth0-compatible Management API served by every zeroauthy tenant, and zeroauthy's system API.
  description: |
    The Management API of a zeroauthy tenant, at `https://{tenant_domain}/api/v2/`
    on every host of the tenant. It is wire-compatible with the Auth0
    Management API for the operations it lists.

    Callers present a bearer access token of one of two kinds:

    - `managementToken`: a client credentials token of the tenant whose
      audience is the tenant's canonical Management API identifier,
      `https://{name}.{base_domain}/api/v2/` (or the first of the tenant's
      domains when there is no base domain), with scopes from a client grant.
    - `operatorToken`: a token of the `system` tenant for the audience
      `urn:zeroauthy:management`, carrying the
      `https://zeroauthy.dev/operator` claim. It holds every scope on the
      tenants the operator manages.

    The system API, at `/api/system/` on the system host only, accepts
    operator tokens only. It has no Auth0 equivalent.

    Errors have Auth0's shape (`ManagementError`). Lists page with `page`,
    `per_page` and `include_totals`: a bare array without totals, an object
    with the list, `start`, `limit` and `total` with them.

    Every operation lists the public documents it was derived from in
    `x-source`. zeroauthy is a clean-room implementation; see `CLEAN_ROOM.md`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: tenant.example.com
        description: Any domain of the tenant.
tags:
  - name: clients
    description: Applications (Auth0's `/api/v2/clients`).
  - name: system
    description: zeroauthy's own API for tenants and operators (operator tokens only).
security:
  - managementToken: []
  - operatorToken: []
paths:
  /api/v2/clients:
    get:
      operationId: getClients
      tags: [clients]
      summary: List applications
      description: |
        The tenant's applications in creation order. Requires `read:clients`;
        `client_secret` is returned only with `read:client_keys`.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/get-clients
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/per_page"
        - $ref: "#/components/parameters/include_totals"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/include_fields"
        - name: app_type
          in: query
          description: Comma-separated application types to return.
          schema: {type: string}
        - name: is_first_party
          in: query
          description: Return only first-party (true) or third-party (false) applications.
          schema: {type: boolean}
      responses:
        "200":
          description: The page of applications.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: "#/components/schemas/Client"}
                  - $ref: "#/components/schemas/ClientPage"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: createClient
      tags: [clients]
      summary: Create an application
      description: |
        Requires `create:clients`. Fields left out get the defaults described
        in `ClientCreate`; `client_secret` is returned only with
        `read:client_keys`.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/post-clients
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientCreate"}
      responses:
        "201":
          description: The new application.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The application's client ID.
        schema: {type: string}
    get:
      operationId: getClient
      tags: [clients]
      summary: Get an application
      description: Requires `read:clients`; `client_secret` is returned only with `read:client_keys`.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/get-clients-by-id
      parameters:
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/include_fields"
      responses:
        "200":
          description: The application.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update an application
      description: |
        Requires `update:clients`; setting `client_secret` requires
        `update:client_keys` (alone, for a body with only `client_secret`).
        `is_first_party` and `third_party_security_mode` cannot change after
        creation.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/patch-clients-by-id
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClientUpdate"}
      responses:
        "200":
          description: The updated application.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete an application
      description: |
        Requires `delete:clients`. The application's refresh tokens, client
        grants and user grants are deleted with it, and it is removed from
        every connection. Deleting an unknown ID also answers 204.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/delete-clients-by-id
      responses:
        "204": {description: "Deleted, or did not exist."}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/clients/{id}/rotate-secret:
    parameters:
      - name: id
        in: path
        required: true
        description: The application's client ID.
        schema: {type: string}
    post:
      operationId: rotateClientSecret
      tags: [clients]
      summary: Rotate an application's secret
      description: |
        Requires `update:client_keys`. The old secret stops working at once.
        The response carries the new secret.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/post-rotate-secret
      responses:
        "200":
          description: The application with its new secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Client"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    managementToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A client credentials access token of this tenant for its Management
        API identifier, with the scopes the operation names.
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A console operator's access token from the `system` tenant, audience
        `urn:zeroauthy:management`, with the `https://zeroauthy.dev/operator`
        claim.
  parameters:
    page:
      name: page
      in: query
      description: Page index of the results, from 0.
      schema: {type: integer, minimum: 0, default: 0}
    per_page:
      name: per_page
      in: query
      description: Number of results per page; more than 100 is refused (`invalid_query_string`).
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    include_totals:
      name: include_totals
      in: query
      description: Return an object with the list and `start`, `limit` and `total` instead of a bare array.
      schema: {type: boolean, default: false}
    fields:
      name: fields
      in: query
      description: Comma-separated fields to include or, with `include_fields=false`, to leave out. `tenant` is always returned.
      schema: {type: string}
    include_fields:
      name: include_fields
      in: query
      description: Whether `fields` lists the fields to include (true) or to leave out (false).
      schema: {type: boolean, default: true}
  schemas:
    AppType:
      type: string
      enum: [native, spa, regular_web, non_interactive]
      description: |
        `native` (mobile and desktop), `spa` (single-page), `regular_web`
        (server-side web) or `non_interactive` (machine to machine).
    TokenEndpointAuthMethod:
      type: string
      enum: [none, client_secret_post, client_secret_basic]
      description: How the application authenticates at `/oauth/token`; `none` for public clients.
    JwtConfiguration:
      type: object
      description: ID token settings.
      properties:
        alg:
          type: string
          enum: [RS256]
          description: The signing algorithm; zeroauthy signs with RS256 only.
        lifetime_in_seconds:
          type: integer
          minimum: 0
          description: ID token lifetime; 36000 by default.
        secret_encoded:
          type: boolean
          description: Accepted and ignored (HS256 is not offered).
    RefreshTokenSettings:
      type: object
      description: The refresh tokens the application receives.
      properties:
        rotation_type:
          type: string
          enum: [rotating, non-rotating]
        expiration_type:
          type: string
          enum: [expiring, non-expiring]
        leeway:
          type: integer
          minimum: 0
          description: Seconds a rotated token may still be used.
        token_lifetime:
          type: integer
          minimum: 0
          description: Absolute lifetime in seconds.
        idle_token_lifetime:
          type: integer
          minimum: 0
          description: Inactivity lifetime in seconds.
        infinite_token_lifetime:
          type: boolean
          description: True for non-expiring tokens; derived from `expiration_type`.
        infinite_idle_token_lifetime:
          type: boolean
          description: True for non-expiring tokens; derived from `expiration_type`.
    ClientSettings:
      type: object
      description: The writable settings of an application.
      properties:
        name: {type: string, minLength: 1, description: The application's name.}
        app_type: {$ref: "#/components/schemas/AppType"}
        token_endpoint_auth_method: {$ref: "#/components/schemas/TokenEndpointAuthMethod"}
        grant_types:
          type: array
          items: {type: string}
          description: |
            Grant types the application may use. zeroauthy serves
            authorization_code, refresh_token, client_credentials, password,
            password-realm and device_code; implicit and the MFA grants are
            stored but not served.
        callbacks: {type: array, items: {type: string}, description: Allowed redirect URIs.}
        allowed_logout_urls: {type: array, items: {type: string}, description: Where logout may return to.}
        web_origins: {type: array, items: {type: string}, description: Origins allowed for web message and silent authentication.}
        allowed_origins: {type: array, items: {type: string}, description: Origins allowed for cross-origin requests.}
        jwt_configuration: {$ref: "#/components/schemas/JwtConfiguration"}
        refresh_token: {$ref: "#/components/schemas/RefreshTokenSettings"}
        oidc_conformant:
          type: boolean
          description: zeroauthy is always OIDC-conformant; `false` is refused.
        redirection_policy:
          type: string
          enum: [open_redirect_protection, allow_always]
        skip_non_verifiable_callback_uri_confirmation_prompt:
          type: [boolean, "null"]
          description: Overrides the tenant's setting; null inherits it.
        require_pushed_authorization_requests:
          type: boolean
          description: Refuse authorization requests that were not pushed (confidential first-party applications of a tenant that allows PAR).
        client_secret:
          type: string
          minLength: 48
          description: A secret to set instead of a generated one (confidential applications only).
        description: {description: Accepted and ignored.}
        logo_uri: {description: Accepted and ignored.}
        client_metadata: {description: Accepted and ignored.}
        sso: {description: Accepted and ignored.}
        sso_disabled: {description: Accepted and ignored.}
        cross_origin_authentication: {description: Accepted and ignored.}
        cross_origin_auth: {description: Accepted and ignored.}
        cross_origin_loc: {description: Accepted and ignored.}
        custom_login_page_on: {description: Accepted and ignored.}
        custom_login_page: {description: Accepted and ignored.}
        initiate_login_uri: {description: Accepted and ignored.}
        native_social_login: {description: Accepted and ignored.}
        mobile: {description: Accepted and ignored.}
        organization_usage: {description: Accepted and ignored.}
        organization_require_behavior: {description: Accepted and ignored.}
        is_token_endpoint_ip_header_trusted: {description: Accepted and ignored.}
        allowed_clients: {description: Accepted and ignored.}
    ClientCreate:
      description: |
        A new application. Unknown fields are refused (`invalid_body`).
        Defaults: `app_type` `regular_web`,
        `token_endpoint_auth_method` `none` for `spa` and `native` and
        `client_secret_post` otherwise, `grant_types` authorization_code and
        refresh_token (plus client_credentials for confidential clients),
        `is_first_party` true, refresh tokens rotating for `spa` and
        non-rotating otherwise.
      allOf:
        - $ref: "#/components/schemas/ClientSettings"
        - type: object
          required: [name]
          properties:
            is_first_party: {type: boolean, description: First-party (true) or third-party application.}
            third_party_security_mode:
              type: string
              enum: [strict, permissive]
              description: Third-party applications only; `strict` by default.
    ClientUpdate:
      description: |
        Fields to change; the others keep their values. Unknown fields are
        refused (`invalid_body`). `is_first_party` and
        `third_party_security_mode` may be sent only with their current
        values.
      allOf:
        - $ref: "#/components/schemas/ClientSettings"
        - type: object
          properties:
            is_first_party: {type: boolean}
            third_party_security_mode: {type: string, enum: [strict, permissive]}
    Client:
      type: object
      description: An application.
      required: [tenant, client_id, name, app_type, is_first_party, oidc_conformant, callbacks, allowed_logout_urls, web_origins, allowed_origins, grant_types, token_endpoint_auth_method, jwt_configuration, refresh_token, global, callback_url_template, require_pushed_authorization_requests]
      properties:
        tenant: {type: string, description: The tenant's name.}
        client_id: {type: string}
        client_secret:
          type: string
          description: |
            Only with `read:client_keys`, and only for confidential
            applications whose secret zeroauthy can reveal (not for secrets
            stored before D-0038 until they are rotated).
        name: {type: string}
        app_type: {$ref: "#/components/schemas/AppType"}
        is_first_party: {type: boolean}
        third_party_security_mode: {type: string, enum: [strict, permissive]}
        oidc_conformant: {type: boolean, enum: [true]}
        callbacks: {type: array, items: {type: string}}
        allowed_logout_urls: {type: array, items: {type: string}}
        web_origins: {type: array, items: {type: string}}
        allowed_origins: {type: array, items: {type: string}}
        grant_types: {type: array, items: {type: string}}
        token_endpoint_auth_method: {$ref: "#/components/schemas/TokenEndpointAuthMethod"}
        jwt_configuration: {$ref: "#/components/schemas/JwtConfiguration"}
        refresh_token: {$ref: "#/components/schemas/RefreshTokenSettings"}
        redirection_policy: {type: string, enum: [open_redirect_protection, allow_always]}
        skip_non_verifiable_callback_uri_confirmation_prompt: {type: boolean}
        require_pushed_authorization_requests: {type: boolean}
        global: {type: boolean, enum: [false]}
        callback_url_template: {type: boolean, enum: [false]}
        created_at: {type: string, format: date-time}
    ClientPage:
      description: A page of applications with `include_totals=true`.
      allOf:
        - $ref: "#/components/schemas/ListTotals"
        - type: object
          required: [clients]
          properties:
            clients:
              type: array
              items: {$ref: "#/components/schemas/Client"}
    ManagementError:
      type: object
      description: Auth0's Management API error shape.
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
          description: The HTTP status code.
        error:
          type: string
          description: The HTTP status text, such as `Bad Request`.
        message:
          type: string
          description: A human-readable explanation.
        errorCode:
          type: string
          description: A machine-readable code, such as `invalid_body`, `invalid_query_string`, `insufficient_scope` or `inexistent_client`.
    ListTotals:
      type: object
      description: |
        The paging members of a list returned with `include_totals=true`; the
        list itself is under the resource's plural name.
      required: [start, limit, total]
      properties:
        start: {type: integer, description: Index of the first result.}
        limit: {type: integer, description: The page size.}
        total: {type: integer, description: The number of results on all pages.}
  responses:
    BadRequest:
      description: The request is invalid (`invalid_body`, `invalid_query_string`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    Unauthorized:
      description: No token, or an invalid, expired or foreign one (`invalid_token`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    Forbidden:
      description: The token lacks the scope the operation needs (`insufficient_scope`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
