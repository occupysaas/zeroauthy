            client_authorizequery: {type: string, maxLength: 2048, description: Query string of the authorization request for the application.}
        disableSignout: {type: boolean, default: false, description: Do not send LogoutRequest to the identity provider on logout.}
        decryptionKey:
          type: object
          additionalProperties: false
          properties:
            key: {type: string, writeOnly: true, maxLength: 16384, description: PEM private key; sealed and never returned.}
