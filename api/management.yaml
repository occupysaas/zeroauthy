            application/json:
              schema: {$ref: "#/components/schemas/SystemTenant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /api/system/tenants/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The tenant's name.
        schema: {type: string}
    patch:
      operationId: updateTenant
      tags: [system]
      summary: Update a tenant
      description: Changes the friendly name or the domains. The system tenant cannot be changed.
      x-source:
        - https://auth0.com/docs/get-started/tenant-settings
      security: [{operatorToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TenantUpdate"}
      responses:
        "200":
          description: The updated tenant.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemTenant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      operationId: deleteTenant
      tags: [system]
      summary: Delete a tenant
      description: |
        Deletes the tenant and all of its data. `confirm` must repeat the
