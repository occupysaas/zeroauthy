  /api/system/tenants/{tenant}/connections/{id}/scripts/{name}/try:
    parameters:
      - name: tenant
        in: path
        required: true
        description: The tenant's name.
        schema: {type: string}
      - name: id
        in: path
        required: true
        description: The connection's ID (`con_` and up to 64 letters or digits).
        schema: {type: string}
      - name: name
        in: path
        required: true
        description: "The script: `login`, `get_user`, `create`, `verify`, `change_password`, `delete` or `change_email`."
        schema: {type: string}
    post:
      operationId: tryConnectionScript
      tags: [system]
      summary: Try a custom database script
      description: |
        A zeroauthy extension (Auth0 has no such API; decision D-0042 in
        docs/compat/decisions.md, and section 5.4 of
        docs/superpowers/specs/2026-10-18-zeroauthy-connections-design.md). Runs one of the connection's custom database scripts
        through the same runner a login uses, with the connection's real
        configuration and the arguments in the body, and returns what the
        script answered. Nothing is stored and no user is created or changed
        by zeroauthy, but the script itself may change the external database
        it talks to.

        `args` are the script's arguments as JSON values, in the order of
        Auth0's script signatures, without the callback: `login` (email,
        password), `get_user` (email), `create` (user object),
        `verify` (email), `change_password` (email, new password),
        `delete` (user ID) and `change_email` (email, new email, verified).
        A wrong number of arguments, an unknown script name or a script the
        connection has no source for is `invalid_body`.

        The connection need not have `enabledDatabaseCustomization` on, so
        an operator can test scripts before enabling them.

        A script that ran answers 200 even when it failed: `error` is set
        with the error's `name` and `message` (`TimeoutError` when the
        script ran too long) and `result` is null. 503 means the script
        runtime could not start. At most 10 calls a minute per operator
        (`too_many_requests`, with `Retry-After`). The try call's own
        server-log record carries the tenant, connection, script, operator,
        duration and outcome, never the arguments, the result or the output.
        Script console lines forwarded to the server log (for a try and for
        real logins) have configuration values masked.

        Configuration values are masked: every value of the connection's configuration that appears in
        `logs`, in `result` (in any string or object key, however deeply
        nested) or in `error.message` is replaced by `■■■■■■■■`, whatever the
        value's length. A value matches as an exact, case-sensitive substring,
        a longer value is masked before a shorter one it contains, and empty
        values and configuration keys are not masked. The same mask applies
        to the script console lines in the server log.
      x-source:
        - https://auth0.com/docs/authenticate/database-connections/custom-db/templates
        - https://auth0.com/docs/authenticate/database-connections/custom-db
      security: [{operatorToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScriptTry"}
      responses:
        "200":
          description: The script ran; its answer or its error.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScriptTryResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429":
          description: Too many calls (`too_many_requests`); `Retry-After` gives the seconds to wait.
          headers:
            Retry-After:
              description: Seconds until the next call is accepted.
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagementError"}
        "503":
          description: The script runtime is not available (`script_runtime_unavailable`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagementError"}
components:
  securitySchemes:
    managementToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A client credentials access token of this tenant for its Management
        API identifier, with the scopes the operation names.
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A console operator's access token from the `system` tenant, audience
        `urn:zeroauthy:management`, with the `https://zeroauthy.dev/operator`
        claim.
  parameters:
    page:
      name: page
      in: query
      description: Page index of the results, from 0.
      schema: {type: integer, minimum: 0, default: 0}
    per_page:
      name: per_page
      in: query
      description: Number of results per page; more than 100 is refused (`invalid_query_string`).
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    include_totals:
      name: include_totals
      in: query
      description: Return an object with the list and `start`, `limit` and `total` instead of a bare array.
      schema: {type: boolean, default: false}
    fields:
      name: fields
      in: query
      description: Comma-separated fields to include or, with `include_fields=false`, to leave out. `tenant` is always returned.
      schema: {type: string}
    include_fields:
      name: include_fields
      in: query
      description: Whether `fields` lists the fields to include (true) or to leave out (false).
      schema: {type: boolean, default: true}
  schemas:
    AppType:
      type: string
      enum: [native, spa, regular_web, non_interactive]
      description: |
        `native` (mobile and desktop), `spa` (single-page), `regular_web`
        (server-side web) or `non_interactive` (machine to machine).
    TokenEndpointAuthMethod:
      type: string
      enum: [none, client_secret_post, client_secret_basic]
      description: How the application authenticates at `/oauth/token`; `none` for public clients.
    JwtConfiguration:
      type: object
      description: ID token settings.
      properties:
        alg:
          type: string
          enum: [RS256]
          description: The signing algorithm; zeroauthy signs with RS256 only.
        lifetime_in_seconds:
          type: integer
          minimum: 0
          description: ID token lifetime; 36000 by default.
        secret_encoded:
          type: boolean
          description: Accepted and ignored (HS256 is not offered).
    RefreshTokenSettings:
      type: object
      description: The refresh tokens the application receives.
      properties:
        rotation_type:
          type: string
          enum: [rotating, non-rotating]
        expiration_type:
          type: string
          enum: [expiring, non-expiring]
        leeway:
          type: integer
          minimum: 0
          description: Seconds a rotated token may still be used.
        token_lifetime:
          type: integer
          minimum: 0
          description: Absolute lifetime in seconds.
        idle_token_lifetime:
          type: integer
          minimum: 0
          description: Inactivity lifetime in seconds.
        infinite_token_lifetime:
          type: boolean
          description: True for non-expiring tokens; derived from `expiration_type`.
        infinite_idle_token_lifetime:
          type: boolean
          description: True for non-expiring tokens; derived from `expiration_type`.
    ClientSettings:
      type: object
      description: The writable settings of an application.
      properties:
        name: {type: string, minLength: 1, description: The application's name.}
        app_type: {$ref: "#/components/schemas/AppType"}
        token_endpoint_auth_method: {$ref: "#/components/schemas/TokenEndpointAuthMethod"}
        grant_types:
          type: array
          items: {type: string}
          description: |
            Grant types the application may use. zeroauthy serves
            authorization_code, refresh_token, client_credentials, password,
            password-realm and device_code; implicit and the MFA grants are
            stored but not served.
        callbacks: {type: array, items: {type: string}, description: Allowed redirect URIs.}
        allowed_logout_urls: {type: array, items: {type: string}, description: Where logout may return to.}
        web_origins: {type: array, items: {type: string}, description: Origins allowed for web message and silent authentication.}
        allowed_origins: {type: array, items: {type: string}, description: Origins allowed for cross-origin requests.}
        jwt_configuration: {$ref: "#/components/schemas/JwtConfiguration"}
        refresh_token: {$ref: "#/components/schemas/RefreshTokenSettings"}
        oidc_conformant:
          type: boolean
          description: zeroauthy is always OIDC-conformant; `false` is refused.
        redirection_policy:
          type: string
          enum: [open_redirect_protection, allow_always]
        skip_non_verifiable_callback_uri_confirmation_prompt:
          type: [boolean, "null"]
          description: Overrides the tenant's setting; null inherits it.
        require_pushed_authorization_requests:
          type: boolean
          description: Refuse authorization requests that were not pushed (confidential first-party applications of a tenant that allows PAR).
        client_secret:
          type: string
          minLength: 48
          description: A secret to set instead of a generated one (confidential applications only).
        description: {description: Accepted and ignored.}
        logo_uri: {description: Accepted and ignored.}
        client_metadata: {description: Accepted and ignored.}
        sso: {description: Accepted and ignored.}
        sso_disabled: {description: Accepted and ignored.}
        cross_origin_authentication: {description: Accepted and ignored.}
        cross_origin_auth: {description: Accepted and ignored.}
        cross_origin_loc: {description: Accepted and ignored.}
        custom_login_page_on: {description: Accepted and ignored.}
        custom_login_page: {description: Accepted and ignored.}
        initiate_login_uri: {description: Accepted and ignored.}
        native_social_login: {description: Accepted and ignored.}
        mobile: {description: Accepted and ignored.}
        organization_usage: {description: Accepted and ignored.}
        organization_require_behavior: {description: Accepted and ignored.}
        is_token_endpoint_ip_header_trusted: {description: Accepted and ignored.}
        allowed_clients: {description: Accepted and ignored.}
    ClientCreate:
      description: |
        A new application. Unknown fields are refused (`invalid_body`).
        Defaults: `app_type` `regular_web`,
        `token_endpoint_auth_method` `none` for `spa` and `native` and
        `client_secret_post` otherwise, `grant_types` authorization_code and
        refresh_token (plus client_credentials for confidential clients),
        `is_first_party` true, refresh tokens rotating for `spa` and
        non-rotating otherwise.
      allOf:
        - $ref: "#/components/schemas/ClientSettings"
        - type: object
          required: [name]
          properties:
            is_first_party: {type: boolean, description: First-party (true) or third-party application.}
            third_party_security_mode:
              type: string
              enum: [strict, permissive]
              description: Third-party applications only; `strict` by default.
    ClientUpdate:
      description: |
        Fields to change; the others keep their values. Unknown fields are
        refused (`invalid_body`). `is_first_party` and
        `third_party_security_mode` may be sent only with their current
        values.
      allOf:
        - $ref: "#/components/schemas/ClientSettings"
        - type: object
          properties:
            is_first_party: {type: boolean}
            third_party_security_mode: {type: string, enum: [strict, permissive]}
    Client:
      type: object
      description: An application.
      required: [tenant, client_id, name, app_type, is_first_party, oidc_conformant, callbacks, allowed_logout_urls, web_origins, allowed_origins, grant_types, token_endpoint_auth_method, jwt_configuration, refresh_token, global, callback_url_template, require_pushed_authorization_requests]
      properties:
        tenant: {type: string, description: The tenant's name.}
        client_id: {type: string}
        client_secret:
          type: string
          description: |
            Only with `read:client_keys`, and only for confidential
            applications whose secret zeroauthy can reveal (not for secrets
            stored before D-0038 until they are rotated).
        name: {type: string}
        app_type: {$ref: "#/components/schemas/AppType"}
        is_first_party: {type: boolean}
        third_party_security_mode: {type: string, enum: [strict, permissive]}
        oidc_conformant: {type: boolean, enum: [true]}
        callbacks: {type: array, items: {type: string}}
        allowed_logout_urls: {type: array, items: {type: string}}
        web_origins: {type: array, items: {type: string}}
        allowed_origins: {type: array, items: {type: string}}
        grant_types: {type: array, items: {type: string}}
        token_endpoint_auth_method: {$ref: "#/components/schemas/TokenEndpointAuthMethod"}
        jwt_configuration: {$ref: "#/components/schemas/JwtConfiguration"}
        refresh_token: {$ref: "#/components/schemas/RefreshTokenSettings"}
        redirection_policy: {type: string, enum: [open_redirect_protection, allow_always]}
        skip_non_verifiable_callback_uri_confirmation_prompt: {type: boolean}
        require_pushed_authorization_requests: {type: boolean}
        global: {type: boolean, enum: [false]}
        callback_url_template: {type: boolean, enum: [false]}
        created_at: {type: string, format: date-time}
    ResourceServerScope:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {type: string, minLength: 1, maxLength: 280, description: "The permission, such as `read:orders`. Unique within the API."}
        description: {type: string, maxLength: 500}
    AccessPolicy:
      type: object
      additionalProperties: false
      properties:
        policy: {type: string, enum: [allow_all, require_client_grant, deny_all]}
    SubjectTypeAuthorization:
      type: object
      additionalProperties: false
      description: |
        Who may get access tokens for the API. `user` is `allow_all`,
        `require_client_grant` or `deny_all`; `client` is `require_client_grant`
        or `deny_all`. On update the two subject types merge.
      properties:
        user: {$ref: "#/components/schemas/AccessPolicy"}
        client: {$ref: "#/components/schemas/AccessPolicy"}
    ResourceServerSettings:
      type: object
      description: The writable settings of an API.
      properties:
        name: {type: string, minLength: 1, maxLength: 200, pattern: "^[^<>]+$", description: "The API's name. Optional; absent when not given."}
        scopes:
          type: array
          items: {$ref: "#/components/schemas/ResourceServerScope"}
          description: The API's permissions. Values are unique.
        signing_alg:
          type: string
          enum: [RS256]
          description: The signing algorithm; zeroauthy signs access tokens with RS256 only (`HS256` and `PS256` are refused, and so is `signing_secret`).
        token_lifetime: {type: integer, minimum: 1, maximum: 2592000, description: "Access token lifetime in seconds; 86400 by default."}
        token_lifetime_for_web:
          type: integer
          minimum: 1
          maximum: 2592000
          description: |
            Stored and reported (7200 by default). zeroauthy has no implicit or
            hybrid flow, so nothing uses it. When sent, it must not exceed
            `token_lifetime`.
        allow_offline_access: {type: boolean, description: Whether clients may get refresh tokens for the API.}
        skip_consent_for_verifiable_first_party_clients: {type: boolean}
        subject_type_authorization: {$ref: "#/components/schemas/SubjectTypeAuthorization"}
        enforce_policies:
          type: boolean
          description: zeroauthy has no role-based access control, so only `false` is accepted.
        token_dialect:
          type: string
          enum: [access_token]
          description: zeroauthy issues one access token format, `access_token`.
        consent_policy: {description: "Only null is accepted (transactional authorization is not supported)."}
        proof_of_possession: {description: "Only null is accepted (mTLS and DPoP are not supported)."}
        authorization_details: {description: "Only null or an empty list is accepted (rich authorization requests are not supported)."}
        token_encryption: {description: "Only null is accepted (token encryption is not supported)."}
    ResourceServerCreate:
      description: |
        A new API. Unknown fields are refused (`invalid_body`). Defaults:
        `token_lifetime` 86400, `token_lifetime_for_web` 7200, `signing_alg`
        `RS256`, `allow_offline_access` and
        `skip_consent_for_verifiable_first_party_clients` false, no scopes,
        `subject_type_authorization` client `require_client_grant` and user
        `allow_all`. The identifier may be any string, but not the tenant's
        Management API identifier or `urn:zeroauthy:management`
        (`reserved_identifier`); it cannot change later.
      allOf:
        - $ref: "#/components/schemas/ResourceServerSettings"
        - type: object
          required: [identifier]
          properties:
            identifier:
              type: string
              minLength: 1
              maxLength: 600
              description: The API's identifier, the `audience` of its tokens. Case-sensitive, unique within the tenant.
    ResourceServerUpdate:
      description: |
        Fields to change; the others keep their values. Unknown fields are
        refused (`invalid_body`), `identifier`, `id` and `is_system`
        among them. An empty body changes nothing.
      allOf:
        - $ref: "#/components/schemas/ResourceServerSettings"
    ResourceServer:
      type: object
      description: An API.
      required: [id, identifier, signing_alg, token_lifetime, token_lifetime_for_web, allow_offline_access, skip_consent_for_verifiable_first_party_clients, subject_type_authorization, enforce_policies, token_dialect]
      properties:
        id: {type: string, description: "The API's ID: 24 hexadecimal characters for APIs created through the API."}
        identifier: {type: string}
        name: {type: string, description: Absent when the API has no name.}
        is_system: {type: boolean, description: "True for a system API (a tenant's Management API); absent otherwise."}
        scopes:
          type: array
          items: {$ref: "#/components/schemas/ResourceServerScope"}
          description: Absent when the API defines none.
        signing_alg: {type: string, enum: [RS256]}
        token_lifetime: {type: integer}
        token_lifetime_for_web: {type: integer}
        allow_offline_access: {type: boolean}
        skip_consent_for_verifiable_first_party_clients: {type: boolean}
        subject_type_authorization:
          type: object
          required: [user, client]
          properties:
            user:
              type: object
              required: [policy]
              properties:
                policy: {type: string, enum: [allow_all, require_client_grant, deny_all]}
            client:
              type: object
              required: [policy]
              properties:
                policy: {type: string, enum: [require_client_grant, deny_all]}
        enforce_policies: {type: boolean, enum: [false]}
        token_dialect: {type: string, enum: [access_token]}
    ResourceServerPage:
      description: A page of APIs with `include_totals=true`.
      allOf:
        - $ref: "#/components/schemas/ListTotals"
        - type: object
          required: [resource_servers]
          properties:
            resource_servers:
              type: array
              items: {$ref: "#/components/schemas/ResourceServer"}
    ClientGrantSettings:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: array
          items: {type: string, minLength: 1, maxLength: 280}
          description: The scopes granted; each must be one the API defines. `[]` is valid.
        allow_all_scopes:
          type: boolean
          description: |
            Grant every scope the API defines, at the time a token is issued,
            so scopes added later are covered. Stored without a `scope`;
            for the tenant's Management API it means every Management API
            scope. Not together with a non-empty `scope`.
        organization_usage:
          type: string
          enum: [deny]
          description: zeroauthy has no organizations; only `deny` (or null) is accepted.
        allow_any_organization:
          type: boolean
          enum: [false]
          description: zeroauthy has no organizations; only false (or null) is accepted.
        authorization_details_types:
          type: array
          maxItems: 0
          items: {type: string}
          description: zeroauthy has no rich authorization requests; only an empty list (or null) is accepted.
    ClientGrantCreate:
      description: |
        A new client grant. Unknown properties are refused (`invalid_body`).
        `scope` or `allow_all_scopes` is required. `default_for` is not
        supported: only null is accepted.
      allOf:
        - $ref: "#/components/schemas/ClientGrantSettings"
        - type: object
          required: [client_id, audience]
          properties:
            client_id: {type: string, minLength: 1}
            audience: {type: string, minLength: 1, description: The API's identifier.}
            subject_type: {type: string, enum: [client, user], default: client}
    ClientGrantUpdate:
      description: |
        Fields to change; at least one property is required. Unknown
        properties are refused (`invalid_body`), `client_id`, `audience` and
        `subject_type` among them.
      allOf:
        - $ref: "#/components/schemas/ClientGrantSettings"
    ClientGrant:
      type: object
      description: |
        An application's access to an API. The organization fields are not
        reported.
      required: [id, client_id, audience, subject_type]
      properties:
        id: {type: string, description: "`cgr_` and 16 letters and digits for grants created through the API."}
        client_id: {type: string}
        audience: {type: string}
        scope:
          type: array
          items: {type: string}
          description: Absent when the grant has `allow_all_scopes`.
        allow_all_scopes: {type: boolean, description: "True when set; absent otherwise."}
        subject_type: {type: string, enum: [client, user]}
    ClientGrantPage:
      description: A page of client grants with `include_totals=true`.
      allOf:
        - $ref: "#/components/schemas/ListTotals"
        - type: object
          required: [client_grants]
          properties:
            client_grants:
              type: array
              items: {$ref: "#/components/schemas/ClientGrant"}
    ClientGrantCheckpointPage:
      type: object
      description: A page of client grants from checkpoint paging.
      required: [client_grants]
      properties:
        client_grants:
          type: array
          items: {$ref: "#/components/schemas/ClientGrant"}
        next: {type: string, description: Pass as `from` for the next page; absent on the last page.}
    ConnectionSettings:
      type: object
      description: |
        The properties of a connection that can be created and updated.
        Unknown properties are refused (`invalid_body`).
      properties:
        options:
          type: object
          additionalProperties: true
          description: |
            The connection's options in Auth0's shape (`password_options`,
            `brute_force_protection`, `validation`, `customScripts`,
            `configuration`, ...). Unknown keys are stored and returned as
            sent. `configuration` values are strings or null; they are
            returned as opaque blobs.
        is_domain_connection: {type: boolean}
        display_name: {type: string}
        realms: {type: array, items: {type: string}}
        metadata: {type: object, additionalProperties: {type: string}}
        show_as_button: {type: boolean}
        connected_accounts: {type: object, additionalProperties: true}
        authentication: {type: object, additionalProperties: true}
    ConnectionCreate:
      description: A new connection. `name` and `strategy` are required.
      allOf:
        - $ref: "#/components/schemas/ConnectionSettings"
        - type: object
          required: [name, strategy]
          properties:
            name: {type: string, minLength: 1, maxLength: 128, description: "Letters and digits with single hyphens between them."}
            strategy: {type: string, enum: [auth0]}
            enabled_clients:
              type: array
              items: {type: string}
              description: Applications to enable on the connection; accepted on create only.
    ConnectionUpdate:
      description: |
        Fields to change; at least one is required. `name`, `strategy` and
        `enabled_clients` are unknown properties.
      allOf:
        - $ref: "#/components/schemas/ConnectionSettings"
    Connection:
      type: object
      description: |
        A connection. `options.configuration` values are opaque blobs, never
        plaintext. `enabled_clients` is returned by create only. `fields`
        can leave out any property but `id` and `is_domain_connection`.
      required: [id, is_domain_connection]
      properties:
        id: {type: string, description: "`con_` and 16 letters and digits for connections created through the API."}
        name: {type: string}
        strategy: {type: string}
        options: {type: object, additionalProperties: true}
        enabled_clients: {type: array, items: {type: string}}
        is_domain_connection: {type: boolean}
        realms: {type: array, items: {type: string}}
        display_name: {type: string}
        metadata: {type: object, additionalProperties: {type: string}}
        show_as_button: {type: boolean}
        connected_accounts: {type: object, additionalProperties: true}
        authentication: {type: object, additionalProperties: true}
    ConnectionPage:
      description: A page of connections with `include_totals=true`.
      allOf:
        - $ref: "#/components/schemas/ListTotals"
        - type: object
          required: [connections]
          properties:
            connections:
              type: array
              items: {$ref: "#/components/schemas/Connection"}
    ConnectionCheckpointPage:
      type: object
      description: A page of connections from checkpoint paging.
      required: [connections]
      properties:
        connections:
          type: array
          items: {$ref: "#/components/schemas/Connection"}
        next: {type: string, description: Pass as `from` for the next page; absent on the last page.}
    ConnectionDeleted:
      type: object
      required: [deleted_at]
      properties:
        deleted_at: {type: string, format: date-time}
    ConnectionClientStatus:
      type: object
      required: [client_id, status]
      properties:
        client_id: {type: string, minLength: 1}
        status: {type: boolean, description: "True enables the application on the connection, false disables it."}
    ConnectionClients:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items:
            type: object
            required: [client_id]
            properties:
              client_id: {type: string}
        next: {type: string, description: Pass as `from` for the next page; absent on the last page.}
    SystemTenant:
      type: object
      description: A tenant, as the system API reports it.
      required: [name, friendly_name, domains, host, management_api_identifier, seeded, reserved, created_at]
      properties:
        name: {type: string, description: "The tenant's name: a DNS label, its subdomain under the base domain."}
        friendly_name: {type: string}
        domains: {type: array, items: {type: string}, description: Custom domains the tenant answers on.}
        host:
          type: string
          description: The tenant's canonical host, where the console calls its Management API.
        management_api_identifier:
          type: string
          description: The audience of the tenant's machine-to-machine Management API tokens.
        seeded:
          type: boolean
          description: The seed file defines the tenant; the next start overwrites edits to what it defines.
        reserved: {type: boolean, description: "The system tenant (operators sign in there)."}
        created_at: {type: string, format: date-time}
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
          description: Lower-case letters, digits and hyphens, at most 63 characters; `system` is reserved.
        friendly_name: {type: string, maxLength: 255}
        domains: {type: array, items: {type: string}, description: Custom domains (hosts) the tenant answers on.}
    TenantUpdate:
      type: object
      additionalProperties: false
      properties:
        friendly_name: {type: string, maxLength: 255}
        domains: {type: array, items: {type: string}}
    ScriptTry:
      type: object
      additionalProperties: false
      required: [args]
      properties:
        args:
          type: array
          description: The script's arguments, without the callback.
          items: {}
    ScriptTryResult:
      type: object
      required: [result, error, logs, duration_ms]
      properties:
        result: {description: "The value the script passed to its callback; null when it failed or passed none. Configuration values in it are masked."}
        error:
          type: [object, "null"]
          description: The error the script threw or passed to its callback; null on success.
          required: [name, message]
          properties:
            name: {type: string, description: "The error's class: `Error`, `ValidationError`, `UnauthorizedError`, `WrongUsernameOrPasswordError` or `TimeoutError`."}
            message: {type: string, description: "The error's message, with configuration values masked."}
        logs:
          type: array
          description: The script's console output, at most 50 lines, with configuration values masked.
          items: {type: string}
        duration_ms: {type: integer, description: How long the run took.}
    Operator:
      type: object
      required: [user_id, email, tenants, created_at]
      properties:
        user_id: {type: string, description: "The operator's user ID in the system tenant."}
        email: {type: string}
        tenants:
          type: array
          items: {type: string}
          description: The tenants the operator manages; `*` means every tenant.
        created_at: {type: string, format: date-time}
    OperatorCreate:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email}
    OperatorInvite:
      allOf:
        - $ref: "#/components/schemas/Operator"
        - type: object
          required: [setup_url]
          properties:
            setup_url:
              type: string
              description: One-time link, valid for one hour, where the operator chooses a password.
    UserIdentity:
      type: object
      required: [connection, user_id, provider, isSocial]
      properties:
        connection: {type: string}
        user_id: {type: string, description: The ID within the provider (the user's `user_id` without `provider|`).}
        provider: {type: string}
        isSocial: {type: boolean}
        profileData:
          type: object
          additionalProperties: true
          description: |
            On a linked (secondary) identity: `email`, `email_verified` and,
            when it has one, `username`. The link and unlink responses also
            give it for the primary's own identity.
    UserIdentityLink:
      type: object
      description: |
        The account to link: `provider` and `user_id` (with an optional
        `connection_id`), or `link_with` alone. Unknown properties are
        `400 invalid_body`.
      properties:
        provider: {type: string, description: "The secondary's provider, e.g. `auth0`."}
        user_id:
          description: The secondary's ID without the `provider|` prefix.
          oneOf:
            - {type: string}
            - {type: integer}
        connection_id: {type: string, description: The secondary identity's connection ID.}
        link_with: {type: string, description: "An ID token for the secondary, issued to the calling client."}
    User:
      type: object
      description: |
        A user in Auth0's shape. Fields without a value are left out:
        `blocked` appears only when true; `last_login`, `last_ip` and
        `logins_count` after the first login. A password or its hash is never
        returned. `fields` can leave out any property.
      additionalProperties: true
      properties:
        user_id: {type: string, description: "`auth0|` and 24 lowercase hex characters for generated IDs."}
        email: {type: string}
        email_verified: {type: boolean}
        username: {type: string}
        phone_number: {type: string}
        phone_verified: {type: boolean}
        name: {type: string}
        given_name: {type: string}
        family_name: {type: string}
        nickname: {type: string}
        picture: {type: string}
        blocked: {type: boolean}
        user_metadata: {type: object, additionalProperties: true}
        app_metadata: {type: object, additionalProperties: true}
        identities:
          type: array
          items: {$ref: "#/components/schemas/UserIdentity"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_login: {type: string, format: date-time}
        last_ip: {type: string}
        logins_count: {type: integer}
    UserProfileSettings:
      type: object
      properties:
        email: {type: string}
        email_verified: {type: boolean}
        verify_email: {type: boolean, description: Send the verification email.}
        username: {type: string}
        password: {type: string, writeOnly: true}
        phone_number: {type: string}
        phone_verified: {type: boolean}
        name: {type: string}
        given_name: {type: string}
        family_name: {type: string}
        nickname: {type: string}
        picture: {type: string}
        blocked: {type: boolean}
        user_metadata: {type: object, additionalProperties: true}
        app_metadata: {type: object, additionalProperties: true}
    UserCreate:
      description: A new user. `connection` is required; unknown properties are `400 invalid_body`.
      allOf:
        - $ref: "#/components/schemas/UserProfileSettings"
        - type: object
          required: [connection]
          properties:
            connection: {type: string}
            user_id: {type: string, maxLength: 255, description: "Prefixed with `auth0|`."}
    UserUpdate:
      description: Fields to change; unknown properties are `400 invalid_body`.
      allOf:
        - $ref: "#/components/schemas/UserProfileSettings"
        - type: object
          properties:
            connection: {type: string}
            client_id: {type: string, description: The application the verification email is for.}
    UserPage:
      type: object
      description: A page of users with `include_totals=true`.
      required: [start, limit, length, total, users]
      properties:
        start: {type: integer}
        limit: {type: integer}
        length: {type: integer, description: The number of users on this page.}
        total: {type: integer}
        users:
          type: array
          items: {$ref: "#/components/schemas/User"}
    ClientPage:
      description: A page of applications with `include_totals=true`.
      allOf:
        - $ref: "#/components/schemas/ListTotals"
        - type: object
          required: [clients]
          properties:
            clients:
              type: array
              items: {$ref: "#/components/schemas/Client"}
    ManagementError:
      type: object
      description: Auth0's Management API error shape.
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
          description: The HTTP status code.
        error:
          type: string
          description: The HTTP status text, such as `Bad Request`.
        message:
          type: string
          description: A human-readable explanation.
        errorCode:
          type: string
          description: A machine-readable code, such as `invalid_body`, `invalid_query_string`, `insufficient_scope`, `inexistent_client` or `inexistent_resource_server`.
    ListTotals:
      type: object
      description: |
        The paging members of a list returned with `include_totals=true`; the
        list itself is under the resource's plural name.
      required: [start, limit, total]
      properties:
        start: {type: integer, description: Index of the first result.}
        limit: {type: integer, description: The page size.}
        total: {type: integer, description: The number of results on all pages.}
  responses:
    BadRequest:
      description: The request is invalid (`invalid_body`, `invalid_query_string`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    Unauthorized:
      description: No token, or an invalid, expired or foreign one (`invalid_token`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    Forbidden:
      description: The token lacks the scope the operation needs (`insufficient_scope`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    Conflict:
      description: The name, a domain or an identifier is already used, or the change would remove the last operator (`conflict`, `last_operator`, `resource_server_conflict`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    ScriptRuntimeUnavailable:
      description: A custom database script could not run (`script_runtime_unavailable`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
