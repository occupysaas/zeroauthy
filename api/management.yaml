components:
  securitySchemes:
    managementToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A client credentials access token of this tenant for its Management
        API identifier, with the scopes the operation names.
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A console operator's access token from the `system` tenant, audience
        `urn:zeroauthy:management`, with the `https://zeroauthy.dev/operator`
        claim.
  parameters:
    page:
      name: page
      in: query
      description: Page index of the results, from 0.
      schema: {type: integer, minimum: 0, default: 0}
    per_page:
      name: per_page
      in: query
      description: Number of results per page; more than 100 is refused (`invalid_query_string`).
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    include_totals:
      name: include_totals
      in: query
      description: Return an object with the list and `start`, `limit` and `total` instead of a bare array.
      schema: {type: boolean, default: false}
    fields:
      name: fields
      in: query
      description: Comma-separated fields to include or, with `include_fields=false`, to leave out. `tenant` is always returned.
      schema: {type: string}
    include_fields:
      name: include_fields
      in: query
      description: Whether `fields` lists the fields to include (true) or to leave out (false).
      schema: {type: boolean, default: true}
    organizationId:
      name: id
      in: path
      required: true
      description: 'Organization ID, `org_` and 16 letters or digits; another shape is 400 `invalid_uri`.'
      schema: {type: string}
    memberUserId:
      name: user_id
      in: path
      required: true
      description: The member's user ID.
      schema: {type: string}
