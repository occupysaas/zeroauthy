pe": "object", "properties": {"mapping_mode": {"type": "string", "enum": ["basic_profile", "use_map"]}, "attributes": {"type": "object", "maxProperties": 100, "additionalProperties": {"type": "string", "maxLength": 1024}}, "userinfo_scope": {"type": "string"}}}, "domain": {"type": "string", "maxLength": 253}}, "required": ["client_id", "domain"]}
    ConnectionOptionsApple:
      type: object
      description: |
        Apple web and native connection contract (D-0170). Create requires client_id (Services ID), team_id, kid and
        app_secret; no developer credentials are supplied. The Services ID
        is immutable. PATCH omitting app_secret preserves the sealed key;
        empty/null keys are refused. Key parsing and consistency between
        scope and the name/email flags are checked by the option rules.
        Rotating team_id, kid or app_secret increments FederationRevision.
        Local format and scope limits follow LR39a-4 through LR39a-6.
      x-source:
        - https://auth0.com/docs/oas/management/v2/management-api-oas.json
        - https://auth0.com/docs/authenticate/identity-providers/social-identity-providers/apple-native
      additionalProperties: true
      properties:
        client_id: {type: string, minLength: 1, maxLength: 255, description: Apple Services ID; immutable after creation.}
        team_id: {type: string, pattern: '^[A-Z0-9]{10}$'}
        kid: {type: string, pattern: '^[A-Z0-9]{10}$'}
        app_secret:
          type: string
          minLength: 1
          maxLength: 5120
          writeOnly: true
          description: PKCS#8 PEM EC P-256 private key; sealed at write and never returned, logged or exported.
        name: {type: boolean, default: true, description: Request the name on the first authorization.}
        email: {type: boolean, default: true, description: Request email; the user may choose an Apple relay address.}
        scope:
          type: string
          pattern: '^(name( email)?|email( name)?)?$'
          description: Space-separated name/email scopes; when sent must agree with the computed flags.
        freeform_scopes:
          type: array
          uniqueItems: true
          maxItems: 2
          items: {type: string, enum: [name, email]}
          description: Only Apple's name and email scopes are accepted (LR39a-6).
        set_user_root_attributes:
          type: string
          enum: [on_each_login, on_first_login, never_on_login]
          default: on_each_login
          description: Apple names are preserved after the first login regardless of this setting (LR39a-10).
        upstream_params:
          type: object
          additionalProperties: true
          description: Stored only; reserved protocol and security overrides are refused (Plan 24 policy).
        non_persistent_attrs:
          type: array
          maxItems: 96
          items: {type: string, maxLength: 255}
          description: Stored only.
    ConnectionOptionsGitHub:
      type: object
      description: |
        GitHub connection contract (Plan 39c, D-0181). Create requires client_id and
        client_secret of a GitHub OAuth App; the secret is sealed and never
        returned. PATCH omitting client_secret preserves it; empty or null is
        refused. client_id is immutable. The endpoints are fixed to github.com
        and api.github.com: GitHub Enterprise hosts, endpoint overrides, the
        device flow and connected_accounts.active are rejected.
        The requested scope is computed from the flags: user:email when
        `email` is on (the default), then each true scope flag. `scope` is
        returned on read as that effective array. An input `scope` is accepted
        only when it equals the effective scope as a set; otherwise the request
        is `400` naming the expected scope. `profile` is stored and returned
        only: login always reads the GitHub user for the subject.
        Rotating client_secret or changing the scope increments FederationRevision.
      x-source:
        - https://auth0.com/docs/authenticate/identity-providers/social-identity-providers/github
        - https://github.com/auth0/node-auth0/blob/v7.4.0/src/management/api/types/types.ts
      additionalProperties: true
      properties:
        client_id: {type: string, minLength: 1, maxLength: 255, description: GitHub OAuth App client ID; immutable after creation.}
        client_secret:
          type: string
          minLength: 1
          maxLength: 5120
          writeOnly: true
          description: Sealed at write and never returned, logged or exported.
        profile: {type: boolean, default: true, description: Stored and returned only; login always maps the GitHub user profile.}
        email: {type: boolean, default: true, description: Requests user:email and reads the verified primary email; false creates users without an email.}
        admin_org: {type: boolean, default: false, description: "Requests the GitHub `admin:org` scope."}
        admin_public_key: {type: boolean, default: false, description: "Requests the GitHub `admin:public_key` scope."}
        admin_repo_hook: {type: boolean, default: false, description: "Requests the GitHub `admin:repo_hook` scope."}
        delete_repo: {type: boolean, default: false, description: "Requests the GitHub `delete_repo` scope."}
        follow: {type: boolean, default: false, description: "Requests the GitHub `user:follow` scope."}
        gist: {type: boolean, default: false, description: "Requests the GitHub `gist` scope."}
        notifications: {type: boolean, default: false, description: "Requests the GitHub `notifications` scope."}
        public_repo: {type: boolean, default: false, description: "Requests the GitHub `public_repo` scope."}
        read_org: {type: boolean, default: false, description: "Requests the GitHub `read:org` scope."}
        read_public_key: {type: boolean, default: false, description: "Requests the GitHub `read:public_key` scope."}
        read_repo_hook: {type: boolean, default: false, description: "Requests the GitHub `read:repo_hook` scope."}
        read_user: {type: boolean, default: false, description: "Requests the GitHub `read:user` scope."}
        repo: {type: boolean, default: false, description: "Requests the GitHub `repo` scope."}
        repo_deployment: {type: boolean, default: false, description: "Requests the GitHub `repo_deployment` scope."}
        repo_status: {type: boolean, default: false, description: "Requests the GitHub `repo:status` scope."}
        write_org: {type: boolean, default: false, description: "Requests the GitHub `write:org` scope."}
        write_public_key: {type: boolean, default: false, description: "Requests the GitHub `write:public_key` scope."}
        write_repo_hook: {type: boolean, default: false, description: "Requests the GitHub `write:repo_hook` scope."}
        scope:
          type: array
          items: {type: string}
          description: Effective scope computed from the flags. Input must equal it as a set.
        freeform_scopes:
          type: array
          maxItems: 0
          items: {type: string}
          description: Only absent or empty is accepted.
        set_user_root_attributes:
          type: string
          enum: [on_each_login, on_first_login, never_on_login]
          default: on_each_login
        upstream_params:
          type: object
          additionalProperties: true
          description: Stored only; reserved protocol and security overrides are refused (Plan 24 policy).
        non_persistent_attrs:
          type: array
          maxItems: 96
          items: {type: string, maxLength: 255}
          description: Stored only.
    ConnectionOptionsAD:
      type: object
      description: |
        AD/LDAP connection (`ad`, Plan 38a, D-0160): users authenticate
        against Active Directory or another LDAP directory through Auth0's
        open-source AD/LDAP Connector, which runs inside the customer network,
        is installed with the connection's `provisioning_ticket_url` and dials
        out to zeroauthy over a WebSocket. `agentIP`, `agentMode`,
        `agentVersion`, `signInEndpoint`, `certs`, `thumbprints` and
        `thumbprints_sha384` are managed by the connector: they are set when
        the connector provisions itself, returned on reads, and values sent
        through the Management API are ignored (so exports round-trip).
        `kerberos` with `ips` sends browsers from those ranges to the
        connector's Windows integrated sign-in (`signInEndpoint`).
        `upstream_params` is stored only. zeroauthy never caches credentials
        (LR38a-1); `disable_cache` is stored and returned.
      x-source:
        - https://auth0.com/docs/authenticate/identity-providers/enterprise-identity-providers/active-directory-ldap
        - https://auth0.com/docs/oas/management/v2/management-api-oas.json
        - https://github.com/auth0/ad-ldap-connector
      additionalProperties: true
      properties:
        tenant_domain: {type: string, minLength: 1, maxLength: 512, description: Primary AD domain; home realm discovery and the connector's domain.}
        domain_aliases:
          type: array
          maxItems: 1000
          items: {type: string, minLength: 1, maxLength: 255}
          description: Email domains for home realm discovery.
        ips:
          type: array
          maxItems: 256
          items: {type: string, minLength: 2, maxLength: 39}
          description: IP addresses or CIDR ranges of the corporate network (Kerberos).
        kerberos: {type: boolean, default: false, description: Windows integrated authentication for requests from `ips`.}
        certAuth: {type: boolean, description: Client certificate authentication at the connector (stored and passed to the connector).}
        disable_cache: {type: boolean, description: Stored and returned; zeroauthy keeps no credential cache.}
        disable_self_service_change_password: {type: boolean, description: Hides the forgot-password link for this connection.}
        brute_force_protection: {type: boolean, default: true, description: Count failed logins per connection and username.}
        set_user_root_attributes:
          type: string
          enum: [on_each_login, on_first_login, never_on_login]
          default: on_each_login
        icon_url: {type: string, maxLength: 2048}
        non_persistent_attrs:
          type: array
          maxItems: 96
          items: {type: string, maxLength: 255}
        upstream_params:
          type: object
          additionalProperties: true
          description: Stored only.
        agentIP: {type: string, readOnly: true, description: Address the connector last connected from.}
        agentMode: {type: boolean, readOnly: true, description: Sent by the connector when it provisions itself.}
        agentVersion: {type: string, readOnly: true, description: Version of the connector.}
        signInEndpoint: {type: string, readOnly: true, description: "The connector's WS-Federation sign-in endpoint (`{SERVER_URL}/wsfed`)."}
        certs:
          type: array
          readOnly: true
          maxItems: 2
          items: {type: string}
          description: Certificates (base64 DER) of the two most recently provisioned connectors.
        thumbprints: {type: array, readOnly: true, maxItems: 2, items: {type: string}, description: SHA-1 thumbprints of `certs`.}
        thumbprints_sha384: {type: array, readOnly: true, maxItems: 2, items: {type: string}, description: SHA-384 thumbprints of `certs`.}
    ConnectionOptionsGoogleApps:
      type: object
      description: |
        Google Workspace connection (`google-apps`, Plan 37c, D-0150
        LR37c-14): OpenID Connect sign-in with Google restricted to one
        Workspace. `domain` is the primary domain; a login succeeds only when
        the verified ID token's `hd` claim equals it and the email is
        verified. `user_id` is `google-apps|{email}`, or
        `google-apps|{Google subject}` with `map_user_id_to_id` (both fixed
        after creation). `client_secret` is write-only. `api_enable_users`
        (default true) and `api_enable_groups` gate directory provisioning;
        the Directory API credentials come from the directory provisioning
        administrator consent, so `admin_access_token`,
        `admin_refresh_token` and `admin_access_token_expiresin` are refused.
        `ext_*` flags are stored only. `allow_setting_login_scopes` and
        `handle_login_from_social` must be false.
      x-source:
        - https://auth0.com/docs/authenticate/identity-providers/enterprise-identity-providers/google-apps
        - https://auth0.com/docs/oas/management/v2/management-api-oas.json
      additionalProperties: true
      required: [client_id, domain]
      properties:
        client_id: {type: string, minLength: 1, maxLength: 128}
        client_secret: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
        domain: {type: string, minLength: 1, maxLength: 253, description: Primary Google Workspace domain.}
        tenant_domain: {type: string, maxLength: 253, description: Must equal domain when set.}
        domain_aliases:
          type: array
          maxItems: 1000
          items: {type: string, maxLength: 255}
          description: Email domains for home realm discovery.
        map_user_id_to_id: {type: boolean, default: false}
        api_enable_users: {type: boolean, default: true}
        api_enable_groups: {type: boolean, default: false}
        email: {type: boolean, default: true}
        profile: {type: boolean, default: true}
        scope:
          type: array
          maxItems: 64
          items: {type: string, maxLength: 255}
          description: Must match the email and profile flags.
        ext_agreed_terms: {type: boolean}
        ext_groups: {type: boolean}
        ext_groups_extended: {type: boolean}
        ext_is_admin: {type: boolean}
        ext_is_suspended: {type: boolean}
        icon_url: {type: string, maxLength: 2048}
        set_user_root_attributes:
          type: string
          enum: [on_each_login, on_first_login, never_on_login]
          default: on_each_login
    ConnectionOptionsADFS:
      type: object
      description: |
        ADFS connection (`adfs`, Plan 37b, D-0140): zeroauthy is a
        WS-Federation relying party of an ADFS server or any WS-Fed identity
        provider. Exactly one of `adfs_server` (federation metadata host or
        HTTPS URL, fetched through the federation outbound policy when the
        options are written, at most 128 KB) and `fedMetadataXml` is required. `signInEndpoint`
        and `thumbprints` are taken from the metadata; `thumbprints`,
        `thumbprints_sha384` and `prev_thumbprints` are computed on write
        and read-only. `entityId` (sent as `wtrealm`) defaults to
        `urn:auth0:{tenant}:{connection}`. Tokens are posted as `wresult` to
        `POST /login/callback`; SAML 1.1 and SAML 2.0 assertions are
        accepted. `upstream_params` is stored only.
      x-source:
        - https://auth0.com/docs/authenticate/identity-providers/enterprise-identity-providers/adfs
        - https://auth0.com/docs/oas/management/v2/management-api-oas.json
      additionalProperties: true
      properties:
        adfs_server: {type: string, maxLength: 2048, description: "ADFS federation metadata host (the metadata path `/FederationMetadata/2007-06/FederationMetadata.xml` is added) or HTTPS metadata URL. Refused together with fedMetadataXml."}
        fedMetadataXml: {type: string, minLength: 1, maxLength: 102400, description: Inline federation metadata. Refused together with adfs_server.}
        signInEndpoint: {type: string, maxLength: 2048, readOnly: true, description: Passive requestor (WS-Fed) sign-in endpoint discovered from the metadata.}
        thumbprints: {type: array, readOnly: true, maxItems: 20, items: {type: string}, description: SHA-1 thumbprints of the signing certificates in the metadata.}
        prev_thumbprints: {type: array, readOnly: true, maxItems: 20, items: {type: string}, description: "Thumbprints from before the latest metadata change, still trusted until the next change."}
        thumbprints_sha384: {type: array, readOnly: true, maxItems: 20, items: {type: string}, description: SHA-384 thumbprints of the signing certificates.}
        entityId: {type: string, minLength: 1, maxLength: 128, description: "Relying party identifier sent as `wtrealm` and required as the token audience; defaults to `urn:auth0:{tenant}:{connection}`."}
        user_id_attribute: {type: string, minLength: 1, maxLength: 128, description: "Claim used first as the user ID; then the name identifier, UPN and email claims (LR37b-7)."}
        should_trust_email_verified_connection:
          type: string
          enum: [never_set_emails_as_verified, always_set_emails_as_verified]
          default: never_set_emails_as_verified
        set_user_root_attributes:
          type: string
          enum: [on_each_login, on_first_login, never_on_login]
          default: on_each_login
        domain_aliases:
          type: array
          maxItems: 1000
          items: {type: string, maxLength: 255}
          description: Email domains for home realm discovery.
        tenant_domain: {type: string, minLength: 1, maxLength: 255}
        icon_url: {type: string, maxLength: 2048}
        non_persistent_attrs:
          type: array
          maxItems: 96
          items: {type: string, maxLength: 255}
        upstream_params:
          type: object
          additionalProperties: true
          description: Stored only (LR37b-6).
    ConnectionOptionsSAML:
      type: object
      description: |
        SAML service-provider connection (`samlp`, Plan 37a, D-0130). The
        identity provider is configured from `metadataUrl` (fetched through
        the federation outbound policy and refreshed daily), `metadataXml`,
        or `signInEndpoint` with `signingCert` (or the legacy `cert`).
        `thumbprints` and `thumbprints_sha384` are computed from the
        certificates on write and are read-only. `entityId` defaults to
        `urn:auth0:{tenant}:{connection}`. The private keys of `signing_key`
        and `decryptionKey` are write-only: sealed when written and never
        returned. Without them, keys come from
        `/api/v2/connections/{id}/keys`. RSA-SHA1 and RSA-1_5 key transport are
        accepted only when selected explicitly. The assertion consumer service
        is `POST /login/callback?connection={name}`; SP metadata is
        `GET /samlp/metadata?connection={name}`.
        `global_token_revocation_jwt_iss` and `_sub` are stored only (D-0130).
      x-source:
        - https://auth0.com/docs/authenticate/identity-providers/enterprise-identity-providers/saml
        - https://auth0.com/docs/api/management/v2/connections/post-connections
      additionalProperties: true
      properties:
        cert: {type: string, maxLength: 16384, description: "Legacy alias of signingCert: the identity provider's signing certificate (PEM or base64 DER)."}
        signingCert: {type: string, maxLength: 16384, description: "The identity provider's signing certificate (PEM or base64 DER)."}
        thumbprints: {type: array, readOnly: true, items: {type: string}, description: "SHA-1 thumbprints of the identity provider certificates, computed on write."}
        thumbprints_sha384: {type: array, readOnly: true, items: {type: string}, description: "SHA-384 thumbprints, computed on write."}
        metadataUrl: {type: string, format: uri, maxLength: 2048, description: HTTPS URL of the identity provider metadata.}
        metadataXml: {type: string, maxLength: 262144, description: Identity provider metadata document.}
        signInEndpoint: {type: string, maxLength: 2048, description: Identity provider single sign-on URL.}
        signOutEndpoint: {type: string, maxLength: 2048, description: Identity provider single logout URL.}
        destinationUrl: {type: string, maxLength: 2048, description: Destination of the AuthnRequest; defaults to signInEndpoint.}
        recipientUrl: {type: string, maxLength: 2048, description: Expected Recipient of assertions; defaults to the ACS URL.}
        entityId: {type: string, maxLength: 1024, description: "Service provider entity ID; defaults to `urn:auth0:{tenant}:{connection}`."}
        protocolBinding:
          type: string
          enum: ["urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST", "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"]
          default: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"
          description: Binding used to send the AuthnRequest.
