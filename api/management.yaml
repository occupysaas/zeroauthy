components:
  securitySchemes:
    managementToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A client credentials access token of this tenant for its Management
        API identifier, with the scopes the operation names.
    operatorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A console operator's access token from the `system` tenant, audience
        `urn:zeroauthy:management`, with the `https://zeroauthy.dev/operator`
        claim.
  parameters:
    page:
      name: page
      in: query
      description: Page index of the results, from 0.
      schema: {type: integer, minimum: 0, default: 0}
    per_page:
      name: per_page
      in: query
      description: Number of results per page; more than 100 is refused (`invalid_query_string`).
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    include_totals:
      name: include_totals
      in: query
      description: Return an object with the list and `start`, `limit` and `total` instead of a bare array.
      schema: {type: boolean, default: false}
    fields:
      name: fields
      in: query
      description: Comma-separated fields to include or, with `include_fields=false`, to leave out. `tenant` is always returned.
      schema: {type: string}
    include_fields:
      name: include_fields
      in: query
      description: Whether `fields` lists the fields to include (true) or to leave out (false).
      schema: {type: boolean, default: true}
  schemas:
    EmailProvider:
      type: object
      required: [name, enabled]
      properties:
        name: {type: string}
        enabled: {type: boolean}
        default_from_address: {type: string}
        settings: {type: object, additionalProperties: true}
    EmailProviderWrite:
      type: object
      additionalProperties: false
      properties:
        name: {type: string}
        enabled: {type: boolean}
        default_from_address: {type: string, nullable: true}
        credentials: {type: object, additionalProperties: true}
        settings: {type: object, additionalProperties: true}
    EmailTemplate:
      type: object
      required: [template, body, subject, enabled]
      properties:
        template: {type: string}
        body: {type: string}
        from: {type: string, nullable: true}
        subject: {type: string}
        syntax: {type: string, enum: [liquid]}
        enabled: {type: boolean}
        resultUrl: {type: string, nullable: true}
        urlLifetimeInSeconds: {type: integer, format: int64, nullable: true}
        includeEmailInRedirect: {type: boolean, nullable: true}
    EmailTemplatePatch:
      type: object
      additionalProperties: false
      properties:
        template: {type: string}
        body: {type: string, nullable: true}
        from: {type: string, nullable: true}
        subject: {type: string, nullable: true}
        syntax: {type: string, enum: [liquid], nullable: true}
        enabled: {type: boolean, nullable: true}
        resultUrl: {type: string, nullable: true}
        urlLifetimeInSeconds: {type: integer, format: int64, nullable: true}
        includeEmailInRedirect: {type: boolean, nullable: true}
    EmailPreviewRequest:
      type: object
      additionalProperties: false
      required: [template]
      properties:
        template: {type: string}
        overrides:
          type: object
          additionalProperties: false
          description: Bounded preview-only body, subject, from and variables overrides.
          properties:
            body: {type: string}
            subject: {type: string}
            from: {type: string}
            variables: {type: object, additionalProperties: true}
    EmailTestRequest:
      type: object
      additionalProperties: false
      required: [template]
      properties:
        template: {type: string}
    EmailPreview:
      type: object
      required: [from, subject, text, html, resultUrl]
      properties:
        from: {type: string}
        subject: {type: string}
        text: {type: string}
        html: {type: string}
        resultUrl: {type: string}
