      x-source:
        - https://auth0.com/docs/troubleshoot/customer-support/manage-subscriptions/delete-or-reset-tenant
      security: [{operatorToken: []}]
      parameters:
        - name: confirm
          in: query
          required: true
          description: The tenant's name again.
          schema: {type: string}
      responses:
        "204": {description: Deleted.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
