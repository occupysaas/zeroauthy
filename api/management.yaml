    delete:
      operationId: deleteGrantsByUser
      tags: [grants]
      summary: Delete a user's grants
      description: |
        Requires `delete:grants`. Deletes every grant of the user named by
        `user_id`, which is required (`400 invalid_query_string` without it).
        Answers `204`, also when there were none.
      x-source:
        - https://auth0.com/docs/api/management/v2/grants/delete-grants-by-id
      parameters:
        - name: user_id
          in: query
          description: The user whose grants are deleted; required (checked by the handler, for Auth0's error body).
          schema: {type: string}
      responses:
        "204": {description: Deleted.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The grant's ID.
        schema: {type: string}
    delete:
      operationId: deleteGrant
      tags: [grants]
      summary: Delete a grant
      description: |
        Requires `delete:grants`. Answers `204`, also when there was no such
        grant.
      x-source:
        - https://auth0.com/docs/api/management/v2/grants/delete-grants-by-id
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/tickets/password-change:
    post:
      operationId: createPasswordChangeTicket
      tags: [tickets]
      summary: Create a password-change ticket
      description: |
        Requires `create:user_tickets`. A single-use link to the new-password
        form for a database user, named by `user_id` or by `email` together
        with `connection_id`: `https://<tenant host>/u/reset-verify?ticket=<token>#`.
        It is valid for `ttl_sec` seconds (432000, 5 days, when absent or 0).
        `mark_email_as_verified` sets `email_verified` when the password is
        changed. `result_url` is stored, but as on Auth0 the success page
        does not redirect to it.

        `email` without `connection_id`, an empty body, a negative `ttl_sec`,
        `result_url` together with `client_id` and an unknown property are
        `400 invalid_body`; an unknown user is `404 inexistent_user`.
      x-source:
        - https://auth0.com/docs/api/management/v2/tickets/post-password-change
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChangeTicketCreate"}
      responses:
        "201":
          description: The ticket.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ticket"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v2/tickets/email-verification:
    post:
      operationId: createEmailVerificationTicket
      tags: [tickets]
      summary: Create an email verification ticket
      description: |
        Requires `create:user_tickets`. A single-use link that verifies the
        user's email as soon as it is opened:
        `https://<tenant host>/u/email-verification?ticket=<token>#`, valid
        for `ttl_sec` seconds (432000 when absent or 0). With `result_url`
        the page redirects there, appending `success`, `message`, `code`,
        `supportSignUp`, `supportForgotPassword` and, with
        `includeEmailInRedirect`, `email` to its query.

        A missing `user_id`, a negative `ttl_sec`, `result_url` together with
        `client_id` and an unknown property are `400 invalid_body`; an unknown
        user is `404 inexistent_user`.
      x-source:
        - https://auth0.com/docs/api/management/v2/tickets/post-email-verification
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailVerificationTicketCreate"}
      responses:
        "201":
          description: The ticket.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Ticket"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /api/v2/jobs/users-imports:
    post:
      operationId: createUsersImportJob
      tags: [jobs]
      summary: Import users from a file
      description: |
        Requires `create:users`. A `multipart/form-data` body of at most
        512000 bytes, framing included (`413` above, without `errorCode`):
        the `users` file (a JSON array of users in Auth0's import schema),
        `connection_id` (a database connection enabled for at least one
        application; a custom database must be in import mode), `upsert`
        (`true` updates the users the file names by email; anything else
        does not), `send_completion_email` (anything but `false` emails the
        tenant's operators when the job ends) and `external_id` (echoed).
        Answers `202` with the job. A tenant may have 2 import jobs pending
        or running; a third is `429` without `errorCode`.

        A missing `users` or `connection_id` part, or a malformed
        `connection_id`, is `400 invalid_body`; an empty file, a connection
        that is not a database connection, or a custom database without
        import mode is `400 operation_not_supported`; an unknown connection
        is `400 inexistent_connection`; a connection enabled for no
        application is `400 connection_is_disabled`. A file that is not a
        JSON array is accepted and the job fails; each record that fails
        is listed by `GET /jobs/{id}/errors`, with its hashes masked.
      x-source:
        - https://auth0.com/docs/api/management/v2/jobs/post-users-imports
        - https://auth0.com/docs/manage-users/user-migration/bulk-user-imports
        - https://auth0.com/docs/manage-users/user-migration/bulk-user-import-database-schema-and-examples
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/UsersImportJobCreate"}
      responses:
        "202":
          description: The job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          description: The body is over 512000 bytes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagementError"}
        "429":
          description: The tenant already has 2 active import jobs.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagementError"}
  /api/v2/jobs/users-exports:
    post:
      operationId: createUsersExportJob
      tags: [jobs]
      summary: Export users to a file
      description: |
        Requires `read:users`. A JSON body (an empty body is `{}`; form-encoded
        bodies are not accepted); unknown
        properties, `limit` below 1, `format` other than `json` or `csv` and
        more than 30 `fields` are `400 invalid_body`. Answers `200` with the
        job, echoing `connection_id`, `connection`, `format` (default `csv`),
        `limit` and `fields` as given. Without `connection_id` every
        connection is exported, and without `limit` every user.

        A worker writes a gzipped file, users in `user_id` order: newline
        delimited JSON (one object per user, the key of each field being its
        `export_as` or its name, fields without a value left out) or CSV
        (a header of the same names; strings quoted with a leading `'`,
        numbers, booleans and dates bare, objects and arrays empty).
        Without `fields`, the columns are `user_id`, `email`, `name`,
        `family_name`, `given_name`, `phone_number`, `nickname`, `username`,
        `last_ip`, `logins_count`, `created_at`, `updated_at`, `deleted_at`,
        `last_login`, `blocked`, `deleted`, `email_verified`,
        `phone_verified` and `identities.[0].connection`. A field name is a
        user property, a dotted path into it (`user_metadata.plan`,
        `identities.[0].connection`) or anything else, which is an empty
        value. A password hash is never exported.

        A completed job has a `location` that works for 60 seconds, new at
        every `GET /jobs/{id}`.
      x-source:
        - https://auth0.com/docs/api/management/v2/jobs/post-users-exports
        - https://auth0.com/docs/manage-users/user-migration/bulk-user-exports
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UsersExportJobCreate"}
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/jobs/verification-email:
    post:
      operationId: createVerificationEmailJob
      tags: [jobs]
      summary: Send an email address verification email
      description: |
        Requires `update:users`. Queues a job that emails the user a link that
        verifies their address (432000 s, as for `POST /tickets/email-verification`)
        and answers `201` with the job, `status: pending`, whether or not the
        user is already verified. Without an email provider the job still
        completes. `identity` names one of the user's identities and
        `client_id` the application the email is for.

        A missing or empty `user_id`, a wrong type and an unknown property
        (`organization_id` too: zeroauthy has no organizations) are
        `400 invalid_body`; as on Auth0 every other error is a `400` too: an
        unknown user is `inexistent_user`; an identity the user does not have
        is `inexistent_identity`; an unknown `client_id` is
        `inexistent_client`; a user without an email address, or an identity
        that is not in a database connection, is `operation_not_supported`.
      x-source:
        - https://auth0.com/docs/api/management/v2/jobs/post-verification-email
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerificationEmailJobCreate"}
      responses:
        "201":
          description: The job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /api/v2/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
