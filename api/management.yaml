      description: How the application authenticates at `/oauth/token`; `none` for public clients.
    ClientOIDCSupport:
      type: [object, "null"]
      additionalProperties: false
      required: [is_allowed]
      x-source: [https://auth0.com/docs/oas/management/v2/management-api-oas.json]
      description: OIDC and scope restrictions. Null restores OIDC with all scopes. allow_all_scopes and allowed_scopes cannot both be supplied (D-0080).
      not:
        type: object
        required: [allow_all_scopes, allowed_scopes]
      properties:
        is_allowed: {type: boolean}
        allow_all_scopes: {type: boolean}
        allowed_scopes:
          type: array
          uniqueItems: true
          items: {type: string, enum: [profile, email, address, phone]}
    ClientAddons:
      type: object
      additionalProperties: false
      description: |
        Application add-ons. `samlp` (SAML2 Web App, Plan 37a) and `wsfed`
        (WS-Fed Web App, Plan 37b) are supported; any other add-on key is
        refused with `400`. `null` removes an add-on.
      x-source:
        - https://auth0.com/docs/api/management/v2/clients/post-clients
      properties:
        samlp:
          oneOf:
            - $ref: "#/components/schemas/ClientAddonSAML"
            - {type: "null"}
        wsfed:
          oneOf:
            - $ref: "#/components/schemas/ClientAddonWSFed"
            - {type: "null"}
    ClientAddonWSFed:
      type: object
      additionalProperties: true
      maxProperties: 32
      description: |
        WS-Fed (WIF) add-on indicator (Plan 37b, D-0140): its presence lets
        the application sign users in at `/wsfed/{client_id}` with a SAML 1.1
        token. As in Auth0, the configuration is stored in `callbacks` (the
        allowed `wreply` URLs) and `client_aliases` (realms accepted as
        `wtrealm`); the object's own properties are stored and returned
        unchanged (at most 4 KiB of JSON) and have no effect (LR37b-4).
        Claims are customised with `api.samlResponse` in a post-login Action.
      x-source:
        - https://auth0.com/docs/oas/management/v2/management-api-oas.json
        - https://auth0.com/docs/get-started/applications/configure-ws-fed-applications
    ClientAddonSAML:
      type: object
      additionalProperties: false
      description: |
        SAML2 Web App add-on (Plan 37a, D-0130): zeroauthy acts as the SAML
        identity provider at `/samlp/{client_id}`. Defaults the Auth0
        documentation leaves out follow Auth0's MIT `node-samlp` (D-0130).
        SHA-1 signatures and digests are used only when selected explicitly.
      x-source:
        - https://auth0.com/docs/authenticate/single-sign-on/outbound-single-sign-on/configure-auth0-saml-identity-provider
        - https://auth0.com/docs/authenticate/protocols/saml/saml-configuration/customize-saml-assertions
        - https://github.com/auth0/node-samlp
      properties:
        mappings:
          type: object
          description: User profile field to SAML attribute name, or to several names.
          additionalProperties:
            oneOf:
              - {type: string, maxLength: 1024}
              - {type: array, maxItems: 16, items: {type: string, maxLength: 1024}}
        audience: {type: string, maxLength: 2048, description: "Audience of the assertion; defaults to the requesting service provider's issuer."}
        recipient: {type: string, maxLength: 2048, description: "Recipient of the assertion (the ACS URL); defaults to the requested AssertionConsumerServiceURL."}
        createUpnClaim: {type: boolean, default: true, description: Add the UPN claim.}
        mapUnknownClaimsAsIs: {type: boolean, default: false, description: Send profile fields without a mapping under their own names.}
        passthroughClaimsWithNoMapping: {type: boolean, default: true, description: Send claims without a mapping using the default claim namespace.}
        mapIdentities: {type: boolean, default: true, description: Add the user's identities as attributes.}
        signatureAlgorithm: {type: string, enum: [rsa-sha256, rsa-sha1], default: rsa-sha256}
        digestAlgorithm: {type: string, enum: [sha256, sha1], default: sha256}
        issuer: {type: string, maxLength: 2048, description: "Issuer of the response; defaults to `urn:{tenant domain}`."}
        destination: {type: string, maxLength: 2048, description: Destination of the response; defaults to the ACS URL.}
        lifetimeInSeconds: {type: integer, minimum: 1, maximum: 86400, default: 3600, description: Assertion validity.}
        signResponse: {type: boolean, default: false, description: Sign the whole Response in addition to the Assertion.}
        nameIdentifierFormat: {type: string, maxLength: 1024, default: "urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified"}
        nameIdentifierProbes:
          type: array
          maxItems: 16
          items: {type: string, maxLength: 1024}
          description: Claims tried in order for the NameID; the first non-empty value wins.
        authnContextClassRef: {type: string, maxLength: 1024, default: "urn:oasis:names:tc:SAML:2.0:ac:classes:unspecified"}
        logout:
          type: object
          additionalProperties: false
          properties:
            callback: {type: string, maxLength: 2048, description: Service provider SLO URL that receives LogoutRequest and LogoutResponse messages.}
            slo_enabled: {type: boolean, default: true, description: Propagate single logout to the other SAML session participants.}
        binding:
          type: string
          enum: ["urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST", "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect"]
          default: "urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST"
          description: Binding for messages sent to the service provider (responses always use HTTP-POST).
        typedAttributes: {type: boolean, default: true, description: Add xsi:type to attribute values.}
        includeAttributeNameFormat: {type: boolean, default: true, description: Add NameFormat to attributes.}
        signingCert:
          type: string
          maxLength: 16384
          description: The service provider's PEM certificate. When set, SAML requests from the service provider must be signed with its key.
    ClientOIDCLogout:
      type: [object, "null"]
      additionalProperties: false
      x-source:
        - https://auth0.com/docs/oas/management/v2/management-api-oas.json
        - https://auth0.com/docs/authenticate/login/logout/back-channel-logout
      properties:
        backchannel_logout_urls:
          type: array
          maxItems: 1
          description: Public HTTPS receiver. Organization ID and name placeholders are supported (D-0080).
          items: {type: string, maxLength: 2048, x-max-bytes: 2048}
        backchannel_logout_initiators:
          type: object
          additionalProperties: false
          required: [mode]
          description: Custom mode requires selected_initiators including rp-logout and idp-logout. Absent defaults to those two initiators.
          properties:
            mode: {type: string, enum: [custom, all], default: custom}
            selected_initiators:
              type: array
              uniqueItems: true
              items:
                type: string
                enum: [rp-logout, idp-logout, password-changed, session-expired, session-revoked, account-deleted, email-identifier-changed, mfa-phone-unenrolled, account-deactivated, profile-changed]
        backchannel_logout_session_metadata:
          type: object
          additionalProperties: false
          properties:
            include: {type: boolean, default: false}
    JwtConfiguration:
      type: object
      description: ID token settings.
      properties:
        alg:
          type: string
          enum: [HS256, RS256, PS256]
          default: RS256
          description: ID token algorithm. HS256 requires a confidential client with a usable client secret (D-0080).
        lifetime_in_seconds:
          type: integer
          minimum: 0
          description: ID token lifetime; 36000 by default.
        secret_encoded:
          type: boolean
          description: Legacy setting, accepted and ignored. HS256 uses the client secret UTF-8 bytes (D-0080).
    DPoPPolicy:
      type: object
      nullable: true
      additionalProperties: false
      required: [mechanism, required]
      x-source: [https://auth0.com/docs/secure/sender-constraining/configure-sender-constraining]
      properties:
        mechanism: {type: string, enum: [none, dpop]}
        required: {type: boolean}
        required_for: {type: string, enum: [all_clients, public_clients], default: all_clients}
    RefreshTokenSettings:
      type: object
      description: The refresh tokens the application receives.
      properties:
        rotation_type:
          type: string
          enum: [rotating, non-rotating]
        expiration_type:
          type: string
          enum: [expiring, non-expiring]
        leeway:
          type: integer
          minimum: 0
          description: Seconds during which only the immediately previous rotating token may be exchanged again.
        token_lifetime:
          type: integer
          minimum: 0
          description: Absolute lifetime in seconds.
        idle_token_lifetime:
          type: integer
          minimum: 0
          description: Inactivity lifetime in seconds.
        infinite_token_lifetime:
          type: boolean
          description: True for non-expiring tokens; derived from `expiration_type`.
        infinite_idle_token_lifetime:
          type: boolean
          description: True for non-expiring tokens; derived from `expiration_type`.
        policies:
          type: [array, "null"]
          description: |
            API audiences and scopes available to this first-party application
            during refresh token exchange. Audience identifiers must be unique.
            The Management API is excluded. Null clears the policies.
          minItems: 1
          maxItems: 10
          items: {$ref: "#/components/schemas/RefreshTokenPolicy"}
    RefreshTokenPolicy:
      type: object
      additionalProperties: false
      required: [audience, scope]
      x-source:
        - https://auth0.com/docs/secure/tokens/refresh-tokens/multi-resource-refresh-token/configure-and-implement-multi-resource-refresh-token
        - https://auth0.com/docs/oas/management/v2/management-api-oas.json
      properties:
        audience: {type: string, minLength: 1, maxLength: 600}
        scope:
          type: array
          items: {type: string, minLength: 1, maxLength: 280}
    RoamingUVSettings:
      type: object
      additionalProperties: false
      required: [user_verification]
      properties:
        user_verification: {type: string, enum: [discouraged, preferred, required], default: discouraged}
    NativeSocialLoginApple:
      type: object
      additionalProperties: false
      minProperties: 1
      x-source: [https://auth0.com/docs/oas/management/v2/management-api-oas.json]
      properties:
        enabled: {type: boolean, default: false, description: Permission to exchange an Apple authorization code natively (D-0170).}
    NativeSocialLoginFacebook:
      type: object
      additionalProperties: false
      minProperties: 1
      x-source: [https://auth0.com/docs/oas/management/v2/management-api-oas.json]
      properties:
        enabled: {type: boolean, default: false, description: Stored by Plan 39a; native enforcement is deferred to Plan 39b.}
    NativeSocialLoginGoogle:
      type: object
      additionalProperties: false
      minProperties: 1
      x-source: [https://auth0.com/docs/oas/management/v2/management-api-oas.json]
      properties:
        enabled: {type: boolean, default: false, description: Stored by Plan 39a; native enforcement is deferred to Plan 39b.}
    NativeSocialLogin:
      type: object
      additionalProperties: false
      description: |
        Stored native social switches; Apple is enforced (Plan 39a, D-0170).
        Apple exchange additionally requires
        mobile.ios.app_bundle_identifier and an enabled Apple connection.
        Facebook and Google enforcement belongs to Plan 39b.
      x-source: [https://auth0.com/docs/oas/management/v2/management-api-oas.json]
      properties:
        apple: {$ref: "#/components/schemas/NativeSocialLoginApple"}
        facebook: {$ref: "#/components/schemas/NativeSocialLoginFacebook"}
        google: {$ref: "#/components/schemas/NativeSocialLoginGoogle"}
    ClientMobile:
      type: object
      additionalProperties: true
      description: Native application identities. Unknown settings are accepted and ignored.
      x-source: [https://auth0.com/docs/oas/management/v2/management-api-oas.json]
      properties:
        ios: {$ref: "#/components/schemas/ClientMobileIOS"}
        android: {$ref: "#/components/schemas/ClientMobileAndroid"}
    ClientMobileIOS:
      type: object
      additionalProperties: true
      description: Stored and returned iOS identity (Plan 33b). Apple native exchanges bind the ID-token audience to app_bundle_identifier (D-0170).
      x-source: [https://auth0.com/docs/oas/management/v2/management-api-oas.json]
      properties:
        team_id: {type: string, default: ""}
        app_bundle_identifier: {type: string, default: ""}
    ClientMobileAndroid:
      type: object
      additionalProperties: true
      properties:
        app_package_name: {type: string, default: ""}
        sha256_cert_fingerprints:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}
    ClientSettings:
      type: object
      description: The writable settings of an application.
      properties:
        name: {type: string, minLength: 1, description: The application's name.}
        app_type: {$ref: "#/components/schemas/AppType"}
        token_endpoint_auth_method:
          description: |
            How the application authenticates at `/oauth/token`. `null` is
            accepted only together with `client_authentication_methods`
            `private_key_jwt` (D-0063, C4).
          anyOf:
            - $ref: "#/components/schemas/TokenEndpointAuthMethod"
            - {type: "null"}
        client_authentication_methods: {$ref: "#/components/schemas/ClientAuthenticationMethods"}
        signed_request_object: {$ref: "#/components/schemas/SignedRequestObject"}
        token_exchange: {$ref: "#/components/schemas/ClientTokenExchange"}
        async_approval_notification_channels:
          type: array
          minItems: 1
          items: {type: string, enum: [email, guardian-push, my-account]}
          description: |
            How a user is asked to approve a CIBA request (Plan 41c, D-0100).
            Only `email` is delivered; `guardian-push` and `my-account` are
            stored only, and a list without `email` is refused (LR41c-2).
            Absent, the application has no channel and cannot use CIBA.
        grant_types:
          type: array
          items: {type: string}
          description: |
            Grant types the application may use. zeroauthy serves
            authorization_code, refresh_token, client_credentials, password,
            password-realm, device_code and CIBA
            (`urn:openid:params:grant-type:ciba`: first-party, confidential,
            OIDC-conformant applications only, Plan 41c); implicit and the MFA grants are
            stored but not served. The native passkey grant is
            urn:okta:params:oauth:grant-type:webauthn.
        callbacks: {type: array, items: {type: string}, description: Allowed redirect URIs.}
        allowed_logout_urls: {type: array, items: {type: string}, description: Where logout may return to.}
        web_origins: {type: array, items: {type: string}, description: Origins allowed for web message and silent authentication.}
        allowed_origins: {type: array, items: {type: string}, description: Origins allowed for cross-origin requests.}
        oidc_logout: {$ref: "#/components/schemas/ClientOIDCLogout"}
        oidc_support: {$ref: "#/components/schemas/ClientOIDCSupport"}
        addons: {$ref: "#/components/schemas/ClientAddons"}
        my_organization_configuration:
          description: The My Organization API settings of this application (Plan 42b, Early Access); `null` removes them.
          anyOf:
            - $ref: "#/components/schemas/ClientMyOrganizationConfiguration"
            - {type: "null"}
        client_aliases:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 1024}
          description: |
            Realms (`wtrealm` values) and audiences accepted for the `wsfed`
            add-on, besides the client ID (Plan 37b). Each alias is unique
            within the tenant: an alias another application uses is refused
            with `409` (LR37b-3).
        form_template:
          type: string
          minLength: 1
          maxLength: 65536
          description: HTML form template for WS-Federation. Stored and returned only; zeroauthy always posts with its own form (LR37b-5).
        jwt_configuration: {$ref: "#/components/schemas/JwtConfiguration"}
        refresh_token: {$ref: "#/components/schemas/RefreshTokenSettings"}
        token_quota: {$ref: "#/components/schemas/IITokenQuota"}
        oidc_conformant:
          type: boolean
          description: zeroauthy is always OIDC-conformant; `false` is refused.
        redirection_policy:
          type: string
          enum: [open_redirect_protection, allow_always]
        skip_non_verifiable_callback_uri_confirmation_prompt:
          type: [boolean, "null"]
          description: Overrides the tenant's setting; null inherits it.
        require_proof_of_possession: {type: boolean, default: false}
        require_pushed_authorization_requests:
          type: boolean
          description: Refuse authorization requests that were not pushed (confidential first-party applications of a tenant that allows PAR).
        client_secret:
          type: string
          minLength: 48
          description: A secret to set instead of a generated one (confidential applications only).
        description: {description: Accepted and ignored.}
        logo_uri: {description: Accepted and ignored.}
        client_metadata: {description: Accepted and ignored.}
        sso: {description: Accepted and ignored.}
        sso_disabled: {description: Accepted and ignored.}
        cross_origin_authentication: {description: Accepted and ignored.}
        cross_origin_auth: {description: Accepted and ignored.}
        cross_origin_loc: {description: Accepted and ignored.}
        custom_login_page_on: {description: Accepted and ignored.}
        custom_login_page: {description: Accepted and ignored.}
        initiate_login_uri:
          type: string
          format: uri
          description: HTTPS application login route used by organization invitation links. Omission preserves the existing value; null is rejected.
        native_social_login: {$ref: "#/components/schemas/NativeSocialLogin"}
        mobile: {$ref: "#/components/schemas/ClientMobile"}
        organization_usage:
          type: [string, "null"]
          enum: [deny, allow, require, null]
          description: |
            Whether the application logs users in through organizations:
            `deny` (the default when unset), `allow` or `require`. null unsets
            it. `require` is refused while `grant_types` holds `password`,
            password-realm or device_code (D-0055). A value other than `deny`
            is 501 `organizations_unavailable` when the storage plugin lacks
            Organizations.
        organization_require_behavior:
          type: [string, "null"]
          enum: [no_prompt, pre_login_prompt, post_login_prompt, null]
          description: |
            What happens when a login names no organization: `no_prompt` (the
            default when unset), `pre_login_prompt` or `post_login_prompt`.
            null unsets it.
        organization_discovery_methods:
          type: [array, "null"]
          minItems: 1
          items: {type: string, enum: [email, organization_name]}
          description: |
            How the organization prompt finds the organization (Early Access
            upstream). Only with `organization_require_behavior`
            `pre_login_prompt`; null unsets it. Stored; the prompt always asks
            for the organization name until email discovery exists (D-0055).
        is_token_endpoint_ip_header_trusted: {description: Accepted and ignored.}
        allowed_clients: {description: Accepted and ignored.}
    ClientMyOrganizationConfiguration:
      type: object
      description: |
        An application's My Organization API settings (Plan 42b, D-0220;
        Early Access at Auth0). The My Organization API refuses tokens of an
        application without them. `invitation_landing_client_id` is where
        invitees accept (an application of this tenant);
        `enforce_permission_ceiling` limits the roles an organization
        administrator may assign to permissions they hold;
        `enforce_self_assignment_restriction` stops administrators assigning
        roles to themselves. `allowed_strategies`,
        `connection_deletion_behavior`, `third_party_client_access` and the
        profile IDs are returned by `GET /my-org/v1/config` and used by the
        identity provider operations (Phase B).
      x-source:
        - https://auth0.com/docs/manage-users/my-organization-api
        - https://auth0.com/docs/oas/management/v2/management-api-oas.json
      additionalProperties: false
      required: [allowed_strategies, connection_deletion_behavior]
      properties:
        connection_profile_id: {type: string, maxLength: 255}
        user_attribute_profile_id: {type: string, maxLength: 255}
        allowed_strategies:
          type: array
          uniqueItems: true
          items: {type: string, enum: [pingfederate, adfs, waad, google-apps, okta, oidc, samlp]}
        third_party_client_access:
          type: object
          additionalProperties: false
          required: [default_value, allowed_values]
          properties:
            default_value: {type: string, enum: [block]}
            allowed_values:
              type: array
              minItems: 1
              items: {type: string, enum: [allow, block]}
        connection_deletion_behavior: {type: string, enum: [allow, allow_if_empty], default: allow}
        invitation_landing_client_id: {type: string, maxLength: 255}
        enforce_permission_ceiling: {type: boolean, default: false}
        enforce_self_assignment_restriction: {type: boolean, default: false}
    ClientCreate:
      description: |
        A new application. Unknown fields are refused (`invalid_body`).
        Defaults: `app_type` `regular_web`,
        `token_endpoint_auth_method` `none` for `spa` and `native` and
        `client_secret_post` otherwise, `grant_types` authorization_code and
        refresh_token (plus client_credentials for confidential clients),
        `is_first_party` true, refresh tokens rotating for `spa` and
        non-rotating otherwise.
      allOf:
        - $ref: "#/components/schemas/ClientSettings"
        - type: object
          required: [name]
          properties:
            is_first_party: {type: boolean, description: First-party (true) or third-party application.}
            third_party_security_mode:
              type: string
              enum: [strict, permissive]
              description: Third-party applications only; `strict` by default.
    ClientUpdate:
      description: |
        Fields to change; the others keep their values. Unknown fields are
        refused (`invalid_body`). `is_first_party` and
        `third_party_security_mode` may be sent only with their current
        values.
      allOf:
        - $ref: "#/components/schemas/ClientSettings"
        - type: object
          properties:
            is_first_party: {type: boolean}
            third_party_security_mode: {type: string, enum: [strict, permissive]}
    Client:
      type: object
      description: An application.
      required: [tenant, client_id, name, app_type, is_first_party, oidc_conformant, callbacks, allowed_logout_urls, web_origins, allowed_origins, grant_types, token_endpoint_auth_method, jwt_configuration, refresh_token, global, callback_url_template, require_pushed_authorization_requests]
      properties:
        native_social_login: {$ref: "#/components/schemas/NativeSocialLogin"}
        mobile: {$ref: "#/components/schemas/ClientMobile"}
        initiate_login_uri:
          type: string
          format: uri
          description: HTTPS application login route used for organization invitation links.
        tenant: {type: string, description: The tenant's name.}
        client_id: {type: string}
        client_secret:
          type: string
          description: |
            Only with `read:client_keys`, and only for confidential
            applications whose secret zeroauthy can reveal (not for secrets
            stored before D-0038 until they are rotated).
        name: {type: string}
        app_type: {$ref: "#/components/schemas/AppType"}
        is_first_party: {type: boolean}
        third_party_security_mode: {type: string, enum: [strict, permissive]}
        oidc_conformant: {type: boolean, enum: [true]}
        callbacks: {type: array, items: {type: string}}
        allowed_logout_urls: {type: array, items: {type: string}}
        web_origins: {type: array, items: {type: string}}
        allowed_origins: {type: array, items: {type: string}}
        grant_types: {type: array, items: {type: string}}
        token_endpoint_auth_method:
          description: "`null` when the application authenticates with `client_authentication_methods`."
          anyOf:
            - $ref: "#/components/schemas/TokenEndpointAuthMethod"
            - {type: "null"}
        client_authentication_methods: {$ref: "#/components/schemas/ClientAuthenticationMethods"}
        signed_request_object: {$ref: "#/components/schemas/SignedRequestObject"}
        token_exchange: {$ref: "#/components/schemas/ClientTokenExchange"}
        async_approval_notification_channels:
          type: array
          minItems: 1
          items: {type: string, enum: [email, guardian-push, my-account]}
          description: |
            How a user is asked to approve a CIBA request (Plan 41c, D-0100).
            Only `email` is delivered; `guardian-push` and `my-account` are
            stored only, and a list without `email` is refused (LR41c-2).
            Absent, the application has no channel and cannot use CIBA.
        oidc_logout: {$ref: "#/components/schemas/ClientOIDCLogout"}
        oidc_support: {$ref: "#/components/schemas/ClientOIDCSupport"}
        addons: {$ref: "#/components/schemas/ClientAddons"}
        my_organization_configuration: {$ref: "#/components/schemas/ClientMyOrganizationConfiguration"}
        client_aliases:
          type: array
          maxItems: 100
          items: {type: string, minLength: 1, maxLength: 1024}
          description: |
            Realms (`wtrealm` values) and audiences accepted for the `wsfed`
            add-on, besides the client ID (Plan 37b). Each alias is unique
            within the tenant: an alias another application uses is refused
            with `409` (LR37b-3).
        form_template:
          type: string
          minLength: 1
          maxLength: 65536
          description: HTML form template for WS-Federation. Stored and returned only; zeroauthy always posts with its own form (LR37b-5).
        jwt_configuration: {$ref: "#/components/schemas/JwtConfiguration"}
        refresh_token: {$ref: "#/components/schemas/RefreshTokenSettings"}
        token_quota: {$ref: "#/components/schemas/IITokenQuota"}
        redirection_policy: {type: string, enum: [open_redirect_protection, allow_always]}
        skip_non_verifiable_callback_uri_confirmation_prompt: {type: boolean}
        require_proof_of_possession: {type: boolean, default: false}
        require_pushed_authorization_requests: {type: boolean}
        organization_usage: {type: string, enum: [deny, allow, require], description: Left out when unset (deny).}
        organization_require_behavior: {type: string, enum: [no_prompt, pre_login_prompt, post_login_prompt], description: Left out when unset (no_prompt).}
        organization_discovery_methods: {type: array, items: {type: string, enum: [email, organization_name]}, description: Left out when unset.}
        global: {type: boolean, enum: [false]}
        callback_url_template: {type: boolean, enum: [false]}
        created_at: {type: string, format: date-time}
    ClientCredentialType:
      type: string
      enum: [public_key, x509_cert]
      description: "`cert_subject_dn` is refused with 400 (mTLS is out of scope, D-0063)."
    ClientCredentialAlg:
      type: string
      enum: [RS256, RS384, PS256]
    ClientCredentialCreate:
      type: object
      additionalProperties: false
      required: [credential_type]
      description: A public key to register. `parse_expiry_from_cert` needs `x509_cert` and excludes `expires_at`.
      properties:
        credential_type: {type: string, enum: [public_key, x509_cert, cert_subject_dn], description: "`cert_subject_dn` is refused with 400."}
        name: {type: string, maxLength: 128, default: ""}
        pem: {type: string, description: "An RSA public key (SPKI or PKCS#1) or an X.509 certificate, 2048 to 4096 bits. Never returned."}
        alg: {$ref: "#/components/schemas/ClientCredentialAlg", default: RS256}
        parse_expiry_from_cert: {type: boolean}
        expires_at: {type: string, format: date-time}
        kid: {type: string, pattern: "^[0-9a-zA-Z-_]{10,64}$", description: "Defaults to the RFC 7638 thumbprint."}
    ClientCredentialUpdate:
      type: object
      additionalProperties: false
      description: Only `expires_at` changes; null removes the expiry.
      properties:
        expires_at: {type: [string, "null"], format: date-time}
    ClientCredential:
      type: object
      description: A registered public key. The PEM is never returned.
      required: [id, name, kid, alg, credential_type, thumbprint_sha256, created_at, updated_at]
      properties:
        id: {type: string, description: "`cred_` followed by 22 letters and digits."}
        name: {type: string}
        kid: {type: string}
        alg: {$ref: "#/components/schemas/ClientCredentialAlg"}
        credential_type: {$ref: "#/components/schemas/ClientCredentialType"}
        thumbprint_sha256: {type: string, description: Base64url SHA-256 of the key's RFC 7638 thumbprint input.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: Absent when the credential never expires.}
    ClientCredentialRef:
      type: object
      additionalProperties: false
      description: |
        A credential an application setting uses: an existing one by `id`, or
        (on create and patch only) an inline new credential with the fields
        of the credential create body. The credential must belong to the
        application.
      properties:
        id: {type: string}
        credential_type: {type: string, enum: [public_key, x509_cert, cert_subject_dn]}
        name: {type: string, maxLength: 128}
        pem: {type: string, writeOnly: true}
        alg: {$ref: "#/components/schemas/ClientCredentialAlg"}
        parse_expiry_from_cert: {type: boolean, writeOnly: true}
        expires_at: {type: string, format: date-time, writeOnly: true}
        kid: {type: string, writeOnly: true}
    ClientAuthenticationMethods:
      type: [object, "null"]
      additionalProperties: false
      description: |
        `private_key_jwt` makes the application authenticate with a signed
        JWT; it requires `token_endpoint_auth_method` null. `null` reverts to
        `token_endpoint_auth_method`. `tls_client_auth` and
        `self_signed_tls_client_auth` are refused with 400.
      properties:
        private_key_jwt:
          type: object
          additionalProperties: false
          properties:
            credentials:
              type: array
              maxItems: 2
              items: {$ref: "#/components/schemas/ClientCredentialRef"}
    SignedRequestObject:
      type: object
      additionalProperties: false
      description: JAR settings. Prefer a different key from `private_key_jwt` (advice, not enforced).
      properties:
        required: {type: boolean, description: Refuse authorize and PAR requests without a valid signed `request`.}
        credentials:
          type: array
          maxItems: 2
          items: {$ref: "#/components/schemas/ClientCredentialRef"}
    ClientTokenExchange:
      type: [object, "null"]
      additionalProperties: false
      description: Only first-party, OIDC-conformant applications may set it (LR35-6, C5).
      properties:
        allow_any_profile_of_type:
          type: array
          items: {type: string, enum: [custom_authentication]}
    TokenExchangeProfileCreate:
      type: object
      additionalProperties: false
      required: [name, subject_token_type, action_id, type]
      properties:
        name: {type: string, minLength: 3, maxLength: 50}
        subject_token_type:
          type: string
          minLength: 8
          maxLength: 100
          pattern: "^(https://|urn:)"
          description: |
            Unique per tenant. These prefixes are reserved and refused:
            `http://auth0.com`, `https://auth0.com`, `http://okta.com`,
            `https://okta.com`, `urn:ietf`, `urn:auth0`, `urn:okta`.
        action_id: {type: string, description: A deployed Action with trigger `custom-token-exchange`. Cannot change later.}
        type: {type: string, enum: [custom_authentication]}
    TokenExchangeProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 3, maxLength: 50}
        subject_token_type: {type: string, minLength: 8, maxLength: 100, pattern: "^(https://|urn:)"}
    TokenExchangeProfile:
      type: object
      required: [id, name, subject_token_type, action_id, type, created_at, updated_at]
      properties:
        id: {type: string, description: "`tep_` followed by 22 letters and digits."}
        name: {type: string}
        subject_token_type: {type: string}
        action_id: {type: string}
        type: {type: string, enum: [custom_authentication]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TokenExchangeProfilePage:
      type: object
      required: [token_exchange_profiles]
      properties:
        token_exchange_profiles:
          type: array
          items: {$ref: "#/components/schemas/TokenExchangeProfile"}
        next: {type: string, description: Pass as `from` for the next page; absent on the last page.}
    ResourceServerScope:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {type: string, minLength: 1, maxLength: 280, description: "The permission, such as `read:orders`. Unique within the API."}
        description: {type: string, maxLength: 500}
    AccessPolicy:
      type: object
      additionalProperties: false
      properties:
        policy: {type: string, enum: [allow_all, require_client_grant, deny_all]}
    SubjectTypeAuthorization:
      type: object
      additionalProperties: false
      description: |
        Who may get access tokens for the API. `user` is `allow_all`,
        `require_client_grant` or `deny_all`; `client` is `require_client_grant`
        or `deny_all`. On update the two subject types merge.
      properties:
        user: {$ref: "#/components/schemas/AccessPolicy"}
        client: {$ref: "#/components/schemas/AccessPolicy"}
    ResourceServerSettings:
      type: object
      description: The writable settings of an API.
      properties:
        name: {type: string, minLength: 1, maxLength: 200, pattern: "^[^<>]+$", description: "The API's name. Optional; absent when not given."}
        scopes:
          type: array
          items: {$ref: "#/components/schemas/ResourceServerScope"}
          description: The API's permissions. Values are unique.
        signing_alg:
          type: string
          enum: [RS256, HS256, PS256]
          description: |
            The access token signing algorithm. `RS256` and `PS256` sign with
            the tenant's RSA key; `HS256` signs with `signing_secret`. A patch
            may change it (LR35-8, C17). Supersedes D-0041's RS256-only rule
            (D-0063).
        signing_secret:
          type: string
          minLength: 32
          description: |
            HS256 only: at least 32 characters on new writes (D-0080). Generated (32 random
            bytes, base64url) when an HS256 API is created without one; sent
            with `signing_alg` RS256 or PS256 it is refused (`invalid_body`).
        token_lifetime: {type: integer, minimum: 1, maximum: 2592000, description: "Access token lifetime in seconds; 86400 by default."}
        token_lifetime_for_web:
          type: integer
          minimum: 1
          maximum: 2592000
          description: |
            Stored and reported (7200 by default). zeroauthy has no implicit or
            hybrid flow, so nothing uses it. When sent, it must not exceed
            `token_lifetime`.
        allow_offline_access: {type: boolean, description: Whether clients may get refresh tokens for the API.}
        allow_online_access:
          type: boolean
          default: false
          description: Allow clients to obtain session-bound refresh tokens for this API.
        allow_online_access_with_ephemeral_sessions:
          type: boolean
          default: false
          description: Allow online refresh token issuance for ephemeral sessions when online access is enabled.
        skip_consent_for_verifiable_first_party_clients: {type: boolean}
        subject_type_authorization: {$ref: "#/components/schemas/SubjectTypeAuthorization"}
        enforce_policies:
          type: boolean
          description: Limit custom API user scopes to current role and direct permissions when true.
        token_dialect:
          type: string
          enum: [access_token, access_token_authz, rfc9068_profile, rfc9068_profile_authz]
          description: Access-token profile; defaults to access_token.
        consent_policy: {description: "Only null is accepted (transactional authorization is not supported)."}
        proof_of_possession: {$ref: "#/components/schemas/DPoPPolicy"}
        authorization_details: {description: "Only null or an empty list is accepted (rich authorization requests are not supported)."}
        token_encryption: {description: "Only null is accepted (token encryption is not supported)."}
    ResourceServerCreate:
      description: |
        A new API. Unknown fields are refused (`invalid_body`). Defaults:
        `token_lifetime` 86400, `token_lifetime_for_web` 7200, `signing_alg`
        `RS256`, `allow_offline_access` and
        `skip_consent_for_verifiable_first_party_clients` false, no scopes,
        `subject_type_authorization` client `require_client_grant` and user
        `allow_all`. The identifier may be any string, but not the tenant's
        Management API identifier or `urn:zeroauthy:management`
        (`reserved_identifier`); it cannot change later.
      allOf:
        - $ref: "#/components/schemas/ResourceServerSettings"
        - type: object
          required: [identifier]
          properties:
            identifier:
              type: string
              minLength: 1
              maxLength: 600
              description: The API's identifier, the `audience` of its tokens. Case-sensitive, unique within the tenant.
    ResourceServerUpdate:
      description: |
        Fields to change; the others keep their values. Unknown fields are
        refused (`invalid_body`), `identifier`, `id` and `is_system`
        among them. An empty body changes nothing.
      allOf:
        - $ref: "#/components/schemas/ResourceServerSettings"
    ResourceServer:
      type: object
      description: An API.
      required: [id, identifier, signing_alg, token_lifetime, token_lifetime_for_web, allow_offline_access, skip_consent_for_verifiable_first_party_clients, subject_type_authorization, enforce_policies, token_dialect]
      properties:
        id: {type: string, description: "The API's ID: 24 hexadecimal characters for APIs created through the API."}
        identifier: {type: string}
        name: {type: string, description: Absent when the API has no name.}
        is_system: {type: boolean, description: "True for a system API (a tenant's Management API); absent otherwise."}
        scopes:
          type: array
          items: {$ref: "#/components/schemas/ResourceServerScope"}
          description: Absent when the API defines none.
        signing_alg: {type: string, enum: [RS256, HS256, PS256]}
        signing_secret: {type: string, description: "HS256 only; returned on read (C16)."}
        token_lifetime: {type: integer}
        token_lifetime_for_web: {type: integer}
        proof_of_possession: {$ref: "#/components/schemas/DPoPPolicy"}
        allow_offline_access: {type: boolean}
        allow_online_access: {type: boolean}
        allow_online_access_with_ephemeral_sessions: {type: boolean}
        skip_consent_for_verifiable_first_party_clients: {type: boolean}
        subject_type_authorization:
          type: object
          required: [user, client]
          properties:
            user:
              type: object
              required: [policy]
              properties:
                policy: {type: string, enum: [allow_all, require_client_grant, deny_all]}
            client:
              type: object
              required: [policy]
              properties:
                policy: {type: string, enum: [require_client_grant, deny_all]}
        enforce_policies: {type: boolean}
        token_dialect: {type: string, enum: [access_token, access_token_authz, rfc9068_profile, rfc9068_profile_authz]}
    ResourceServerPage:
      description: A page of APIs with `include_totals=true`.
      allOf:
        - $ref: "#/components/schemas/ListTotals"
        - type: object
          required: [resource_servers]
          properties:
            resource_servers:
              type: array
              items: {$ref: "#/components/schemas/ResourceServer"}
    ClientGrantSettings:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 280
          description: The scopes granted; each must be one the API defines. `[]` is valid.
        allow_all_scopes:
          type: boolean
          description: 'Grant every scope the API defines, at the time a token is issued,

            so scopes added later are covered. Stored without a `scope`;

            for the tenant''s Management API it means every Management API

            scope. Not together with a non-empty `scope`.

            '
        organization_usage:
          type: string
          enum:
          - deny
          - allow
          - require
          default: deny
          description: Client-subject M2M policy; user-subject grants accept only deny. Omission preserves on PATCH;
            null rejected (D-0056).
        allow_any_organization:
          type: boolean
          default: false
          description: Client-subject grant only; third-party clients require explicit associations. Omission preserves
            on PATCH; null rejected (D-0056).
        authorization_details_types:
          type: array
          maxItems: 0
          items:
            type: string
          description: zeroauthy has no rich authorization requests; only an empty list (or null) is accepted.
    ClientGrantCreate:
      description: |
        A new client grant. Unknown properties are refused (`invalid_body`).
        `scope` or `allow_all_scopes` is required. `default_for` is not
        supported: only null is accepted.
      allOf:
        - $ref: "#/components/schemas/ClientGrantSettings"
        - type: object
          required: [client_id, audience]
          properties:
            client_id: {type: string, minLength: 1}
            audience: {type: string, minLength: 1, description: The API's identifier.}
            subject_type: {type: string, enum: [client, user], default: client}
    ClientGrantUpdate:
      description: |
        Fields to change; at least one property is required. Unknown
        properties are refused (`invalid_body`), `client_id`, `audience` and
        `subject_type` among them.
      allOf:
        - $ref: "#/components/schemas/ClientGrantSettings"
    ClientGrant:
      type: object
      description: |
        An application's access to an API, including organization policy (D-0056).
      required: [id, client_id, audience, subject_type]
      properties:
        id: {type: string, description: "`cgr_` and 16 letters and digits for grants created through the API."}
        client_id: {type: string}
        audience: {type: string}
        scope:
          type: array
          items: {type: string}
          description: Absent when the grant has `allow_all_scopes`.
        allow_all_scopes: {type: boolean, description: "True when set; absent otherwise."}
        organization_usage: {type: string, enum: [deny, allow, require], default: deny}
        allow_any_organization: {type: boolean, default: false}
        subject_type: {type: string, enum: [client, user]}
    ClientGrantPage:
      description: A page of client grants with `include_totals=true`.
      allOf:
        - $ref: "#/components/schemas/ListTotals"
        - type: object
          required: [client_grants]
          properties:
            client_grants:
              type: array
              items: {$ref: "#/components/schemas/ClientGrant"}
    ClientGrantCheckpointPage:
      type: object
      description: A page of client grants from checkpoint paging.
      required: [client_grants]
      properties:
        client_grants:
          type: array
          items: {$ref: "#/components/schemas/ClientGrant"}
        next: {type: string, description: Pass as `from` for the next page; absent on the last page.}
    ConnectionSettings:
      type: object
      description: |
        The properties of a connection that can be created and updated.
        Unknown properties are refused (`invalid_body`).
      properties:
        options:
          type: object
          additionalProperties: true
          description: |
            The connection's options in Auth0's shape (`password_options`,
            `brute_force_protection`, `validation`, `customScripts`,
            `configuration`, ...). Unknown keys are stored and returned as
            sent. `configuration` values are strings or null; they are
            returned as opaque blobs.
        is_domain_connection: {type: boolean}
        display_name: {type: string}
        realms: {type: array, items: {type: string}}
        metadata: {type: object, additionalProperties: {type: string}}
        show_as_button: {type: boolean}
        connected_accounts: {type: object, additionalProperties: true}
        authentication: {type: object, additionalProperties: true}
    ConnectionCreate:
      description: A new connection. `name` and `strategy` are required.
      allOf:
        - $ref: "#/components/schemas/ConnectionSettings"
        - type: object
          required: [name, strategy]
          properties:
            name: {type: string, minLength: 1, maxLength: 128, description: "Letters and digits with single hyphens between them."}
            strategy: {type: string, enum: [auth0, google-oauth2, oauth2, oidc, windowslive, waad, email, sms, apple, github, okta, samlp, adfs, google-apps, ad], description: "`samlp` follows ConnectionOptionsSAML (Plan 37a). `adfs` follows ConnectionOptionsADFS (Plan 37b). `google-apps` follows ConnectionOptionsGoogleApps (Plan 37c). `ad` follows ConnectionOptionsAD (Plan 38a): users sign in through Auth0's AD/LDAP Connector, provisioned with the connection's `provisioning_ticket_url`. `email` and `sms` are passwordless connections whose name must equal the strategy; options follow ConnectionOptionsEmail and ConnectionOptionsSMS (Plan 34). `apple` follows ConnectionOptionsApple; web/native login is active (D-0170). `github` follows ConnectionOptionsGitHub (Plan 39c)."}
            enabled_clients:
              type: array
              items: {type: string}
              description: Applications to enable on the connection; accepted on create only.
    ConnectionUpdate:
      description: |
        Fields to change; at least one is required. `name`, `strategy` and
        `enabled_clients` are unknown properties.
      allOf:
        - $ref: "#/components/schemas/ConnectionSettings"
    Connection:
      type: object
      description: |
        A connection. `options.configuration` values are opaque blobs, never
        plaintext. `enabled_clients` is returned by create only. `fields`
        can leave out any property but `id` and `is_domain_connection`.
        For `google-oauth2`, `google-apps`, `github`, `oauth2`, `oidc`, `windowslive` and `waad` connections
        `options.client_secret` is write-only: it is sealed when written and
        never returned.
        Microsoft connections require GUID client IDs and request exactly
        `openid profile email`. `windowslive` accepts absent or integer 2
        `strategy_version` and uses personal accounts. `waad` accepts only
        `identity_api: microsoft-identity-platform-v2.0`,
        `waad_protocol: openid-connect`, `userid_attribute: oid` and absent or
        false `use_wsfed`. Single-directory `waad` requires a GUID or ASCII DNS
        `tenant_domain`; `useCommonEndpoint: true` instead selects organizations
        and forbids `tenant_domain`. `domain` is display metadata only.
        Client ID, tenant and authority mode are immutable. Graph enrichment,
        groups, extra/offline scopes, endpoint overrides and email verification
        overrides are unsupported and rejected.
      required: [id, is_domain_connection]
      properties:
        id: {type: string, description: "`con_` and 16 letters and digits for connections created through the API."}
        name: {type: string}
        strategy: {type: string}
        options: {type: object, additionalProperties: true}
        enabled_clients: {type: array, items: {type: string}}
        is_domain_connection: {type: boolean}
        realms: {type: array, items: {type: string}}
        display_name: {type: string}
        metadata: {type: object, additionalProperties: {type: string}}
        show_as_button: {type: boolean}
        connected_accounts: {type: object, additionalProperties: true}
        authentication: {type: object, additionalProperties: true}
        provisioning_ticket_url:
          type: string
          readOnly: true
          description: "`ad` connections only (Plan 38a): `https://{tenant host}/p/ad/{ticket}`, the URL the AD/LDAP Connector is installed with. Treat it as a secret: whoever holds it can register a connector."
    ConnectionPage:
      description: A page of connections with `include_totals=true`.
      allOf:
        - $ref: "#/components/schemas/ListTotals"
        - type: object
          required: [connections]
          properties:
            connections:
              type: array
              items: {$ref: "#/components/schemas/Connection"}
    ConnectionCheckpointPage:
      type: object
      description: A page of connections from checkpoint paging.
      required: [connections]
      properties:
        connections:
          type: array
          items: {$ref: "#/components/schemas/Connection"}
        next: {type: string, description: Pass as `from` for the next page; absent on the last page.}
    ConnectionDeleted:
      type: object
      required: [deleted_at]
      properties:
        deleted_at: {type: string, format: date-time}
    ConnectionClientStatus:
      type: object
      required: [client_id, status]
      properties:
        client_id: {type: string, minLength: 1}
        status: {type: boolean, description: "True enables the application on the connection, false disables it."}
    ConnectionClients:
      type: object
      required: [clients]
      properties:
        clients:
          type: array
          items:
            type: object
            required: [client_id]
            properties:
              client_id: {type: string}
        next: {type: string, description: Pass as `from` for the next page; absent on the last page.}
    BreachCheckerCapability:
      description: Nonsecret zeroauthy operator capability. Available only after a server-side breach checker is constructed; no corpus or configuration details are exposed.
      type: object
      required: [available]
      properties:
        available: {type: boolean}
    ConsoleRelyingPartyId:
      type: object
      additionalProperties: false
      required: [host, origin, kind, relying_party_identifier, valid]
      properties:
        host: {type: string}
        origin: {type: string}
        kind: {type: string, enum: [canonical, custom, operator]}
        relying_party_identifier: {type: string}
        valid: {type: boolean}
        custom_domain_id: {type: string}
    ConsoleAuthenticationMethod:
      type: object
      additionalProperties: false
      required: [id, type, name, created_at]
      properties:
        id: {type: string}
        type: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_auth_at: {type: string, format: date-time}
        phone_number: {type: string}
        relying_party_identifier: {type: string}
        credential_device_type: {type: string, enum: [single_device, multi_device]}
        credential_backed_up: {type: boolean}
        aaguid: {type: string}
    SystemTenant:
      type: object
      description: A tenant, as the system API reports it.
      required: [name, friendly_name, domains, host, management_api_identifier, seeded, reserved, created_at]
      properties:
        breached_password_checker:
          $ref: "#/components/schemas/BreachCheckerCapability"
        name: {type: string, description: "The tenant's name: a DNS label, its subdomain under the base domain."}
        friendly_name: {type: string}
        domains: {type: array, items: {type: string}, description: Custom domains the tenant answers on.}
        host:
          type: string
          description: The tenant's canonical host. It serves the tenant's public Management API.
        management_api_identifier:
          type: string
          description: The audience of the tenant's machine-to-machine Management API tokens.
        seeded:
          type: boolean
          description: The seed file defines the tenant; the next start overwrites edits to what it defines.
        reserved: {type: boolean, description: "The system tenant (operators sign in there)."}
        created_at: {type: string, format: date-time}
    TenantCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
          description: Lower-case letters, digits and hyphens, at most 63 characters; `system` is reserved.
        friendly_name: {type: string, maxLength: 255}
        domains: {type: array, items: {type: string}, description: Custom domains (hosts) the tenant answers on.}
    TenantUpdate:
      type: object
      additionalProperties: false
      properties:
        friendly_name: {type: string, maxLength: 255}
        domains: {type: array, items: {type: string}}
    ScriptTry:
      type: object
      additionalProperties: false
      required: [args]
      properties:
        args:
          type: array
          description: The script's arguments, without the callback.
          items: {}
    ScriptTryResult:
      type: object
      required: [result, error, logs, duration_ms]
      properties:
        result: {description: "The value the script passed to its callback; null when it failed or passed none. Configuration values in it are masked."}
        error:
          type: [object, "null"]
          description: The error the script threw or passed to its callback; null on success.
          required: [name, message]
          properties:
            name: {type: string, description: "The error's class: `Error`, `ValidationError`, `UnauthorizedError`, `WrongUsernameOrPasswordError` or `TimeoutError`."}
            message: {type: string, description: "The error's message, with configuration values masked."}
        logs:
          type: array
          description: The script's console output, at most 50 lines, with configuration values masked.
          items: {type: string}
        duration_ms: {type: integer, description: How long the run took.}
    Operator:
      type: object
      required: [user_id, email, tenants, created_at]
      properties:
        user_id: {type: string, description: "The operator's user ID in the system tenant."}
        email: {type: string}
        tenants:
          type: array
          items: {type: string}
          description: The tenants the operator manages; `*` means every tenant.
        created_at: {type: string, format: date-time}
    OperatorCreate:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email}
    OperatorUpdate:
      type: object
      additionalProperties: false
      required: [tenants]
      properties:
        tenants:
          type: array
          items: {type: string}
          description: Existing tenant names, an empty list, or exactly ["*"].
    OperatorInvite:
      allOf:
        - $ref: "#/components/schemas/Operator"
        - type: object
          required: [setup_url]
          properties:
            setup_url:
              type: string
              description: One-time link, valid for one hour, where the operator chooses a password.
    SessionDevice:
      type: object
      description: The IP addresses and user agents of the session; there are no ASN keys.
      properties:
        initial_user_agent: {type: string}
        initial_ip: {type: string}
        last_user_agent: {type: string}
        last_ip: {type: string}
    SessionMetadata:
      type: [object, "null"]
      maxProperties: 25
      propertyNames: {type: string, maxLength: 255}
      additionalProperties: {type: string, maxLength: 255}
    SessionMetadataUpdate:
      type: object
      additionalProperties: false
      required: [session_metadata]
      properties:
        session_metadata: {$ref: "#/components/schemas/SessionMetadata"}
    UserSession:
      type: object
      required: [id, user_id, created_at, updated_at, authenticated_at, authentication, idle_expires_at, expires_at, device, clients, last_interacted_at, cookie]
      properties:
        id: {type: string}
        user_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        authenticated_at: {type: string, format: date-time}
        authentication:
          type: object
          required: [methods]
          properties:
            methods:
              type: array
              items:
                type: object
                required: [name, timestamp]
                properties:
                  name: {type: string, description: Recorded authentication method; legacy sessions use pwd.}
                  type: {type: string, description: Factor used for an MFA proof.}
                  timestamp: {type: string, format: date-time}
        idle_expires_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        device: {$ref: "#/components/schemas/SessionDevice"}
        clients:
          type: array
          items:
            type: object
            required: [client_id]
            properties:
              client_id: {type: string}
        last_interacted_at: {type: string, format: date-time}
        session_metadata: {$ref: "#/components/schemas/SessionMetadata"}
        cookie:
          type: object
          required: [mode]
          properties:
            mode: {type: string, enum: [persistent]}
    UserSessionPage:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: {$ref: "#/components/schemas/UserSession"}
        next: {type: string, description: Pass as `from` for the next page; absent when the page is empty.}
    RefreshTokenDevice:
      type: object
      description: Device details recorded when the refresh token was issued and last exchanged.
      properties:
        initial_ip: {type: string}
        initial_asn: {type: string, description: Empty because ASN lookup is unavailable.}
        initial_user_agent: {type: string}
        last_ip: {type: string}
        last_asn: {type: string, description: Empty because ASN lookup is unavailable.}
        last_user_agent: {type: string}
    RefreshTokenMetadata:
      type: [object, "null"]
      maxProperties: 25
      propertyNames: {type: string, maxLength: 255}
      additionalProperties: {type: string, maxLength: 255}
    RefreshTokenMetadataUpdate:
      type: object
      additionalProperties: false
      required: [refresh_token_metadata]
      properties:
        refresh_token_metadata: {$ref: "#/components/schemas/RefreshTokenMetadata"}
    RefreshToken:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        user_id: {type: string}
        created_at: {type: string, format: date-time}
        idle_expires_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
        client_id: {type: string}
        session_id: {type: [string, "null"]}
        rotating: {type: boolean}
        resource_servers:
          type: array
          description: The API the token is for with its space-separated scopes; the tenant's `/userinfo` audience when it has no API.
          items:
            type: object
            required: [audience, scopes]
            properties:
              audience: {type: string}
              scopes: {type: string}
        device: {$ref: "#/components/schemas/RefreshTokenDevice"}
        refresh_token_metadata: {$ref: "#/components/schemas/RefreshTokenMetadata"}
        last_exchanged_at:
          type: [string, "null"]
          format: date-time
          description: The last successful exchange, or null before the first exchange.
    UserRefreshToken:
      allOf:
        - $ref: "#/components/schemas/RefreshToken"
        - type: object
          required: [id, user_id, created_at, idle_expires_at, expires_at, client_id, session_id, rotating, resource_servers, last_exchanged_at]
    RefreshTokenPage:
      type: object
      required: [refresh_tokens]
      properties:
        refresh_tokens:
          type: array
          items: {$ref: "#/components/schemas/RefreshToken"}
        next: {type: string, description: Cursor to pass as `from` on the next request.}
    UserRefreshTokenPage:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items: {$ref: "#/components/schemas/UserRefreshToken"}
        next: {type: string, description: Pass as `from` for the next page; absent when the page is empty.}
    RefreshTokenRevocation:
      type: object
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, minLength: 1}
        user_id: {type: string, minLength: 1}
        client_id: {type: string, minLength: 1}
        audience: {type: string, minLength: 1, maxLength: 600}
      oneOf:
        - required: [ids]
          maxProperties: 1
        - required: [user_id]
          maxProperties: 1
        - required: [user_id, client_id]
          maxProperties: 2
        - required: [user_id, client_id, audience]
          maxProperties: 3
    UserGrant:
      type: object
      required: [id, clientID, user_id, audience, scope]
      properties:
        id: {type: string}
        clientID: {type: string, description: "Spelled `clientID`, as Auth0 does."}
        user_id: {type: string}
        audience: {type: string}
        scope:
          type: array
          description: The granted scopes, sorted.
          items: {type: string}
    UserGrantPage:
      description: A page of grants with `include_totals=true`.
      allOf:
        - $ref: "#/components/schemas/ListTotals"
        - type: object
          required: [grants]
          properties:
            grants:
              type: array
              items: {$ref: "#/components/schemas/UserGrant"}
    UserIdentity:
      type: object
      required: [connection, user_id, provider, isSocial]
      properties:
        connection: {type: string}
        user_id: {type: string, description: The ID within the provider (the user's `user_id` without `provider|`).}
        provider: {type: string}
        isSocial: {type: boolean}
        profileData:
          type: object
          additionalProperties: true
          description: |
            On a linked (secondary) identity: `email`, `email_verified` and,
            when it has one, `username`. The link and unlink responses also
            give it for the primary's own identity. Apple identities also include
            provider-owned `is_private_email` and `real_user_status` when supplied,
            including on the primary identity.
    UserIdentityLink:
      type: object
      description: |
        The account to link: `provider` and `user_id` (with an optional
        `connection_id`), or `link_with` alone. Unknown properties are
        `400 invalid_body`.
      properties:
        provider: {type: string, description: "The secondary's provider, e.g. `auth0`."}
        user_id:
          description: The secondary's ID without the `provider|` prefix.
          oneOf:
            - {type: string}
            - {type: integer}
        connection_id: {type: string, description: The secondary identity's connection ID.}
        link_with: {type: string, description: "An ID token for the secondary, issued to the calling client."}
    CustomDomainVerification:
      type: object
      properties:
        methods:
          type: array
          items:
            type: object
            properties:
              name: {type: string, enum: [txt]}
              record: {type: string, description: The TXT value to publish.}
              domain: {type: string, description: The TXT record name.}
        status: {type: string, enum: [verified, pending, failed]}
        error_msg: {type: string}
        last_verified_at: {type: string, format: date-time}
    CustomDomain:
      type: object
      properties:
        custom_domain_id: {type: string}
        domain: {type: string}
        primary: {type: boolean}
        status: {type: string, enum: [pending_verification, ready, failed]}
        type: {type: string, enum: [auth0_managed_certs, self_managed_certs]}
        origin_domain_name: {type: string, description: The private origin host a proxy or CNAME targets.}
        verification: {$ref: "#/components/schemas/CustomDomainVerification"}
        is_default: {type: boolean}
        custom_client_ip_header: {type: string, nullable: true, enum: [true-client-ip, cf-connecting-ip, x-forwarded-for, x-azure-clientip, ""]}
        tls_policy: {type: string, enum: [recommended]}
        domain_metadata:
          type: object
          maxProperties: 10
          additionalProperties: {type: string, maxLength: 255}
        certificate:
          type: object
          properties:
            status: {type: string, enum: [provisioning, provisioning_failed, provisioned, renewing_failed]}
            error_msg: {type: string}
            renews_before: {type: string, format: date-time}
        relying_party_identifier: {type: string}
    CustomDomainVerified:
      allOf:
        - {$ref: "#/components/schemas/CustomDomain"}
        - type: object
          properties:
            cname_api_key: {type: string, description: "The proxy key, returned only by the first successful verification of a self-managed domain."}
    CustomDomainCreate:
      type: object
      required: [domain, type]
      additionalProperties: false
      properties:
        domain: {type: string}
        type: {type: string, enum: [auth0_managed_certs, self_managed_certs]}
        verification_method: {type: string, enum: [txt]}
        tls_policy: {type: string, enum: [recommended]}
        custom_client_ip_header: {type: string, nullable: true}
        domain_metadata: {type: object, additionalProperties: {type: string}}
        relying_party_identifier: {type: string}
    CustomDomainUpdate:
      type: object
      additionalProperties: false
      properties:
        tls_policy: {type: string, enum: [recommended]}
        custom_client_ip_header: {type: string, nullable: true}
        domain_metadata: {type: object, additionalProperties: {type: string}}
        relying_party_identifier: {type: string, nullable: true}
    CustomDomainDefaultUpdate:
      type: object
      required: [domain]
      additionalProperties: false
      properties:
        domain: {type: string}
    CustomDomainTest:
      type: object
      properties:
        success: {type: boolean}
        message: {type: string}
    Ticket:
      type: object
      required: [ticket]
      additionalProperties: false
      properties:
        ticket: {type: string, description: "The ticket's URL. Its token is shown only here."}
    UsersImportJobCreate:
      type: object
      required: [users, connection_id]
      description: Unknown parts are ignored.
      properties:
        users: {type: string, format: binary, description: "The file: a JSON array of users."}
        connection_id: {type: string, description: "The database connection, `con_` and 16 letters or digits."}
        upsert: {type: string, description: "`true` updates existing users (matched by email)."}
        external_id: {type: string, description: Echoed in the job.}
        send_completion_email: {type: string, description: "`false` sends no completion email; the default is `true`."}
    UsersExportJobCreate:
      type: object
      description: Unknown properties are `400 invalid_body`.
      properties:
        connection_id: {type: string, description: "A connection to export; every connection when absent."}
        format: {type: string, enum: [json, csv], default: csv}
        limit: {type: integer, minimum: 1, description: The most users to export; all when absent.}
        fields:
          type: array
          maxItems: 30
          items:
            type: object
            required: [name]
            properties:
              name: {type: string, maxLength: 100}
              export_as: {type: string, maxLength: 100}
    VerificationEmailJobCreate:
      type: object
      required: [user_id]
      description: Unknown properties are `400 invalid_body`.
      properties:
        user_id: {type: string, description: The user to send the email to.}
        client_id: {type: string, description: The application the email is for.}
        organization_id: {type: string, description: The organization whose branding the verification uses. The user must be a member.}
        identity:
          type: object
          description: One of the user's database identities; the user's primary one when absent.
          properties:
            user_id: {type: string, description: "The identity's ID, without the provider."}
            provider: {type: string}
            connection_id: {type: string}
    Job:
      type: object
      description: |
        A job in Auth0's shape. `status` is `pending`, `completed` or `failed`
        (a running job reads `pending`). `status_details` appears only on a
        failed job, `summary` only on a completed import and `location` only
        on a completed export.
      additionalProperties: true
      required: [id, type, status, created_at]
      properties:
        id: {type: string}
        type: {type: string, enum: [users_import, users_export, verification_email]}
        status: {type: string, enum: [pending, completed, failed]}
        created_at: {type: string}
        connection_id: {type: string}
        connection: {type: string}
        external_id: {type: string}
        format: {type: string}
        limit: {type: integer}
        fields: {type: array, items: {type: object, additionalProperties: true}}
        status_details: {type: string}
        location: {type: string}
        weak_hashes: {type: integer, description: "On the system API's job list: the import's records with a weak password hash."}
        summary:
          type: object
          properties:
            failed: {type: integer}
            updated: {type: integer}
            inserted: {type: integer}
            total: {type: integer}
    JobPage:
      type: object
      properties:
        jobs: {type: array, items: {$ref: "#/components/schemas/Job"}}
        start: {type: integer}
        limit: {type: integer}
        total: {type: integer}
    JobError:
      type: object
      description: The failure of one record of an import.
      properties:
        user: {description: "The record, with its secrets masked."}
        errors:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              message: {type: string}
              path: {type: string}
    TicketIdentity:
      type: object
      description: One of the user's identities.
      properties:
        user_id: {type: string}
        provider: {type: string}
    PasswordChangeTicketCreate:
      type: object
      additionalProperties: false
      description: |
        `user_id`, or `email` with `connection_id`. Unknown properties are
        `400 invalid_body`.
      properties:
        user_id: {type: string}
        email: {type: string}
        connection_id: {type: string, description: "The database connection's ID, with `email`."}
        result_url: {type: string, description: "Stored; the success page does not redirect to it. Not with `client_id`."}
        organization_id: {type: string, description: "Optional organization ID; null and result_url together are invalid_body. Tenant/org/client/database connection eligibility is rechecked at reset completion; no membership mutation (D-0056)."}
        client_id: {type: string}
        ttl_sec: {type: integer, minimum: 0, description: "Seconds the ticket is valid; 0 or absent is 432000 (5 days)."}
        mark_email_as_verified: {type: boolean}
        includeEmailInRedirect: {type: boolean}
        identity: {$ref: "#/components/schemas/TicketIdentity"}
    EmailVerificationTicketCreate:
      type: object
      required: [user_id]
      description: Unknown properties are `400 invalid_body`.
      properties:
        user_id: {type: string}
        result_url: {type: string, description: "Where the page redirects after opening. Not with `client_id` or `organization_id`."}
        client_id: {type: string}
        organization_id: {type: string, description: The organization whose branding the result page uses. The user must be a member.}
        ttl_sec: {type: integer, minimum: 0, description: "Seconds the ticket is valid; 0 or absent is 432000 (5 days)."}
        includeEmailInRedirect: {type: boolean}
        identity: {$ref: "#/components/schemas/TicketIdentity"}
    User:
      type: object
      description: |
        A user in Auth0's shape. Fields without a value are left out:
        `blocked` appears only when true; `last_login`, `last_ip` and
        `logins_count` after the first login. A password or its hash is never
        returned. `fields` can leave out any property.
      additionalProperties: true
      properties:
        multifactor:
          type: array
          items: {type: string}
          description: Derived from confirmed non-recovery methods; local default is [guardian] (D-0059).
        user_id: {type: string, description: "`auth0|` and 24 lowercase hex characters for generated IDs."}
        email: {type: string}
        email_verified: {type: boolean}
        username: {type: string}
        phone_number: {type: string}
        phone_verified: {type: boolean}
        name: {type: string}
        given_name: {type: string}
        family_name: {type: string}
        nickname: {type: string}
        picture: {type: string}
        blocked: {type: boolean}
        user_metadata: {type: object, additionalProperties: true}
        app_metadata: {type: object, additionalProperties: true}
        identities:
          type: array
          items: {$ref: "#/components/schemas/UserIdentity"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_login: {type: string, format: date-time}
        last_ip: {type: string}
        logins_count: {type: integer}
    UserProfileSettings:
      type: object
      properties:
        email: {type: string}
        email_verified: {type: boolean}
        verify_email: {type: boolean, description: Send the verification email.}
        username: {type: string}
        password: {type: string, writeOnly: true}
        phone_number: {type: string}
        phone_verified: {type: boolean}
        name: {type: string}
        given_name: {type: string}
        family_name: {type: string}
        nickname: {type: string}
        picture: {type: string}
        blocked: {type: boolean}
        user_metadata: {type: object, additionalProperties: true}
        app_metadata: {type: object, additionalProperties: true}
    UserCreate:
      description: A new user. `connection` is required; unknown properties are `400 invalid_body`.
      allOf:
        - $ref: "#/components/schemas/UserProfileSettings"
        - type: object
          required: [connection]
          properties:
            connection: {type: string}
            user_id: {type: string, maxLength: 255, description: "Prefixed with `auth0|`."}
    UserUpdate:
      description: Fields to change; unknown properties are `400 invalid_body`.
      type: object
      properties:
        email: {type: [string, 'null']}
        email_verified: {type: boolean}
        verify_email: {type: boolean, description: Send the verification email.}
        username: {type: [string, 'null']}
        password: {type: string, writeOnly: true}
        phone_number: {type: [string, 'null']}
        phone_verified: {type: boolean}
        verify_phone_number: {type: boolean, description: Send a text verification code to the resulting phone number when true.}
        name: {type: [string, 'null']}
        given_name: {type: [string, 'null']}
        family_name: {type: [string, 'null']}
        nickname: {type: [string, 'null']}
        picture: {type: [string, 'null']}
        blocked: {type: boolean}
        user_metadata: {type: object, additionalProperties: true}
        app_metadata: {type: object, additionalProperties: true}
        connection: {type: string}
        client_id: {type: string, description: The application the verification email is for.}
    UserPage:
      type: object
      description: A page of users with `include_totals=true`.
      required: [start, limit, length, total, users]
      properties:
        start: {type: integer}
        limit: {type: integer}
        length: {type: integer, description: The number of users on this page.}
        total: {type: integer}
        users:
          type: array
          items: {$ref: "#/components/schemas/User"}
    ClientPage:
      description: A page of applications with `include_totals=true`.
      allOf:
        - $ref: "#/components/schemas/ListTotals"
        - type: object
          required: [clients]
          properties:
            clients:
              type: array
              items: {$ref: "#/components/schemas/Client"}
    ManagementError:
      type: object
      description: Auth0's Management API error shape.
      required: [statusCode, error, message]
      properties:
        statusCode:
          type: integer
          description: The HTTP status code.
        error:
          type: string
          description: The HTTP status text, such as `Bad Request`.
        message:
          type: string
          description: A human-readable explanation.
        errorCode:
          type: string
          description: A machine-readable code, such as `invalid_body`, `invalid_query_string`, `insufficient_scope`, `inexistent_client` or `inexistent_resource_server`.
    ListTotals:
      type: object
      description: |
        The paging members of a list returned with `include_totals=true`; the
        list itself is under the resource's plural name.
      required: [start, limit, total]
      properties:
        start: {type: integer, description: Index of the first result.}
        limit: {type: integer, description: The page size.}
        total: {type: integer, description: The number of results on all pages.}
    ActionModuleRef:
      type: object
      additionalProperties: false
      properties:
        module_id:
          type: string
        module_name:
          type: string
        module_version_id:
          type: string
        module_version_number:
          type: integer
          minimum: 1
      description: Supply a complete ID pair or name and version number pair. Responses
        include all four fields.

    ActionModuleUpdate:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 65536
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/ActionDependency'
          maxItems: 50
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/ActionSecretInput'
          maxItems: 64

    ActionModuleCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          maxLength: 65536
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/ActionDependency'
          maxItems: 50
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/ActionSecretInput'
          maxItems: 64
        api_version:
          type: string
          maxLength: 20
          description: Opaque compatibility value; does not change the node22 module runtime.
        publish:
          type: boolean
      required:
      - name
      - code

    ActionModuleVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        module_id:
          type: string
        version_number:
          type: integer
        code:
          type: string
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/ActionDependency'
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/ActionSecret'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - module_id
      - version_number
      - code
      - dependencies
      - secrets
      - created_at

    ActionModule:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/ActionDependency'
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/ActionSecret'
        actions_using_module_total:
          type: integer
        all_changes_published:
          type: boolean
        latest_version_number:
          type: integer
        latest_version:
          $ref: '#/components/schemas/ActionModuleVersion'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - pending
          - building
          - packaged
          - built
          - retrying
          - failed
        built_at:
          type: string
          format: date-time
        errors:
          type: array
          items:
            type: string
      required:
      - id
      - name
      - code
      - dependencies
      - secrets
      - actions_using_module_total
      - all_changes_published
      - created_at
      - updated_at
      - status

    ActionModuleRollback:
      type: object
      additionalProperties: false
      properties:
        module_version_id:
          type: string
      required:
      - module_version_id

    ActionModulesPage:
      type: object
      additionalProperties: false
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ActionModule'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
      required:
      - modules
      - total
      - page
      - per_page

    ActionModuleVersionsPage:
      type: object
      additionalProperties: false
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ActionModuleVersion'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
      required:
      - versions
      - total
      - page
      - per_page

    ActionModuleAction:
      type: object
      additionalProperties: false
      properties:
        action_id: {type: string}
        action_name: {type: string}
        module_version_id: {type: string}
        module_version_number: {type: integer}
        supported_triggers:
          type: array
          items:
            $ref: '#/components/schemas/ActionTrigger'
      required: [action_id, action_name, module_version_id, module_version_number, supported_triggers]
    ActionModuleActionsPage:
      type: object
      additionalProperties: false
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionModuleAction'
        total: {type: integer}
        page: {type: integer}
        per_page: {type: integer}
      required: [actions, total, page, per_page]

  responses:
    OrganizationsUnavailable:
      description: The storage plugin lacks the Organizations capability (`organizations_unavailable`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    BadRequest:
      description: The request is invalid (`invalid_body`, `invalid_query_string`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    Unauthorized:
      description: No token, or an invalid, expired or foreign one (`invalid_token`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    Forbidden:
      description: The token lacks the scope the operation needs (`insufficient_scope`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    Conflict:
      description: The name, a domain or an identifier is already used, or the change would remove the last operator (`conflict`, `last_operator`, `resource_server_conflict`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    ScriptRuntimeUnavailable:
      description: A custom database script could not run (`script_runtime_unavailable`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    Accepted:
      description: Accepted; the body is `{}`.
      content:
        application/json:
          schema: {type: object}
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    NotImplemented:
      description: The storage plugin lacks the `client_credentials.v1` capability, or the operation is not built yet.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    RefreshTokensUnavailable:
      description: The refresh-token or session operation is unavailable.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    PayloadTooLarge:
      description: The request body is larger than 64 KiB.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    ServiceUnavailable:
      description: A required service is unavailable (`custom_domain_unavailable`, `temporarily_unavailable`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
    TooManyRequests:
      description: A distributed preview or test email limit was reached.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ManagementError"}
