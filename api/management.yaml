    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job
      description: |
        Requires `create:users` or `read:users`. A job that is running reads
        `pending`; there is no progress. Jobs are kept for 24 hours; an unknown
        or expired job is `404 inexistent_job`.
      x-source:
        - https://auth0.com/docs/api/management/v2/jobs/get-jobs-by-id
      responses:
        "200":
