      - name: page
        in: query
        description: 0-based; default 0; nonnegative; (page+1)*per_page <= 1000
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: per_page
        in: query
        description: 1..100; default 50 (local consistent lower bound)
        schema:
          type: integer
          minimum: 1
          default: 50
          maximum: 100
      - name: sort
        in: query
        description: date:1 or date:-1; default date:-1
        schema:
          type: string
          enum:
          - date:1
          - date:-1
          default: date:-1
      - name: fields
        in: query
        description: Comma-separated log object fields; empty means all; unknown fields rejected locally
        schema:
          type: string
      - name: include_fields
        in: query
        description: default true; fields projection applies in page mode
        schema:
          type: boolean
          default: true
      - name: include_totals
        in: query
        description: default false; true returns {logs,start,limit,length,total}; total is matching count capped at
          1000 locally
        schema:
          type: boolean
          default: false
      - name: q
        in: query
        description: Lucene subset; max 4000 bytes/1000 runes, depth 16, 5 terms; ignored in checkpoint mode
        schema:
          type: string
          maxLength: 1000
      - name: search_engine
        in: query
        description: Local supported page selector; only one v3 value is accepted. Uses the existing bounded search subset; ignored in checkpoint mode. Acceptance independently observed 2026-11-01; no broader engine parity is implied.
