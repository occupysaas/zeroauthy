# api/authentication.yaml
openapi: 3.1.0
info:
  title: zeroauthy Authentication API
  version: 0.1.0
  summary: Auth0-compatible Authentication API served by every zeroauthy tenant.
  description: |
    The Authentication API of a zeroauthy tenant. It is wire-compatible with
    the Auth0 Authentication API, so existing Auth0 SDKs work by changing only
    the domain.

    Each tenant is addressed by its own domain. Tokens are issued with the
    issuer `https://{tenant_domain}/`, with a trailing slash.

    Every operation lists the public documents it was derived from in
    `x-source`. zeroauthy is a clean-room implementation; see `CLEAN_ROOM.md`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{tenant_domain}
    variables:
      tenant_domain:
        default: tenant.example.com
        description: Any domain configured for the tenant.
tags:
  - name: Discovery
    description: Metadata that lets clients configure themselves.
  - name: Tokens
    description: Obtain tokens.
  - name: Login
    description: Browser-based login flows.
  - name: Users
    description: Information about the signed-in user.
paths:
  /.well-known/openid-configuration:
    get:
      operationId: discovery
      tags: [Discovery]
      summary: OpenID Provider configuration
      description: |
        Returns the tenant's OpenID Provider metadata. Grant types and
        features are listed only when this server version implements them.
        authorization_endpoint and userinfo_endpoint are served by this
        server and advertised alongside the supported response modes, PKCE
        methods, scopes and claims.
      x-source:
        - https://openid.net/specs/openid-connect-discovery-1_0.html
        - https://auth0.com/docs/get-started/applications/configure-applications-with-oidc-discovery
      responses:
        "200":
          description: Provider metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIDConfiguration"
        "404":
          $ref: "#/components/responses/UnknownTenant"
        default:
          $ref: "#/components/responses/ServerError"
  /.well-known/jwks.json:
    get:
      operationId: jwks
      tags: [Discovery]
      summary: JSON Web Key Set
      description: |
        Public keys for verifying tokens signed by this tenant: the current
        signing key first, followed by the next key and the previous key.
      x-source:
        - https://www.rfc-editor.org/rfc/rfc7517
        - https://auth0.com/docs/secure/tokens/json-web-tokens/json-web-key-sets
      responses:
        "200":
          description: The tenant's published keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        "404":
          $ref: "#/components/responses/UnknownTenant"
        default:
          $ref: "#/components/responses/ServerError"
  /authorize:
    get:
      operationId: authorize
      tags: [Login]
      summary: Start an authorization (login) flow
      description: |
        Starts the authorization code flow (with PKCE for public applications).
        If the browser has a valid session, the authorization code is returned
        immediately. Otherwise the user is sent to the hosted login page.

        Responses are delivered according to `response_mode`: `query`
        (default), `fragment`, `form_post` (an auto-submitting form), or
        `web_message` (a page that posts the response to the application's
        window, used for silent authentication with `prompt=none`).

        If `client_id` is unknown or `redirect_uri` is not registered, an
        error page is shown and nothing is sent to the `redirect_uri`.
        Unknown parameters are ignored.
      x-source:
        - https://www.rfc-editor.org/rfc/rfc6749#section-4.1
        - https://www.rfc-editor.org/rfc/rfc7636
        - https://openid.net/specs/openid-connect-core-1_0.html#AuthorizationEndpoint
        - https://openid.net/specs/oauth-v2-form-post-response-mode-1_0.html
        - https://datatracker.ietf.org/doc/html/draft-sakimura-oauth-wmrm-00
        - https://auth0.com/docs/api/authentication
      parameters:
        - {name: client_id, in: query, schema: {type: string}, description: The application's client ID.}
        - {name: redirect_uri, in: query, schema: {type: string}, description: A callback URL registered for the application.}
        - {name: response_type, in: query, schema: {type: string}, description: Must be `code`.}
        - {name: response_mode, in: query, schema: {type: string}, description: "`query`, `fragment`, `form_post` or `web_message`."}
        - {name: scope, in: query, schema: {type: string}, description: "Space-separated scopes, e.g. `openid profile email`."}
        - {name: state, in: query, schema: {type: string}, description: Opaque value returned unchanged.}
        - {name: nonce, in: query, schema: {type: string}, description: Value copied into the ID token.}
        - {name: audience, in: query, schema: {type: string}, description: Identifier of the API to issue an access token for.}
        - {name: prompt, in: query, schema: {type: string}, description: "`none` (fail instead of showing login) or `login` (force login)."}
        - {name: max_age, in: query, schema: {type: string}, description: Maximum authentication age in seconds.}
        - {name: code_challenge, in: query, schema: {type: string}, description: PKCE challenge (S256).}
        - {name: code_challenge_method, in: query, schema: {type: string}, description: Must be `S256`.}
        - {name: connection, in: query, schema: {type: string}, description: Name of the connection to log in with.}
        - {name: login_hint, in: query, schema: {type: string}, description: Prefills the login identifier.}
        - {name: screen_hint, in: query, schema: {type: string}, description: "`signup` opens the signup page."}
        - {name: ui_locales, in: query, schema: {type: string}, description: "Space-separated preferred languages; the first entry selects the hosted page language if the tenant enables it."}
        - {name: organization, in: query, schema: {type: string}, description: Not supported yet; rejected.}
        - {name: invitation, in: query, schema: {type: string}, description: Not supported yet; rejected.}
      responses:
        "302":
          description: Redirect to the login page, or to `redirect_uri` with `code` or `error` (query and fragment modes).
        "200":
          description: A `form_post` or `web_message` response page.
          content:
            text/html:
              schema: {type: string}
        "400":
          description: Error page for an unknown client or unregistered redirect URI, or a JSON error for malformed parameters (for example a repeated `client_id`). The error page shows a localized message, with the OAuth `error_description` as English detail.
          content:
            text/html:
              schema: {type: string}
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "404":
          $ref: "#/components/responses/UnknownTenant"
        default:
          $ref: "#/components/responses/ServerError"
  /oauth/token:
    post:
      operationId: oauthToken
      tags: [Tokens]
      summary: Get a token
      description: |
        Exchanges a grant for tokens. The body may be form-encoded or JSON.

        **Supported grant types**

        | `grant_type` | Purpose |
        |---|---|
        | `authorization_code` | Exchange a code from `/authorize` (with `code_verifier` when PKCE was used) for an access token and, with scope `openid`, an ID token |
        | `client_credentials` | Machine-to-machine access token for `audience` |
        | `refresh_token` | Exchange a refresh token (from a request with scope `offline_access`) for new tokens. Rotating refresh tokens return a new `refresh_token`; reusing a rotated token revokes all tokens derived from the same login. `scope` may narrow the original scopes. |
        | `password` | Resource owner password: exchange `username` and `password` for tokens. The user is looked up in the tenant's default directory (`default_directory`); a tenant without one rejects this grant with `invalid_request`. |
        | `http://auth0.com/oauth/grant-type/password-realm` | As `password`, but `realm` names the database connection to use. The connection must be enabled for the client. |

        **Password grants.** Wrong passwords and unknown users get the same
        `invalid_grant` error. Attempts count against the same per-user and
        per-IP limits as the hosted login page; while a limit is reached the
        response is `429` with `too_many_requests`. A server-side client may
        pass its end user's IP in the `auth0-forwarded-for` header so the
        limits apply to that user rather than to the server. The header is
        honoured only for confidential clients that authenticate with a
        secret; for public clients the request's own address is used.

        **Client authentication.** Confidential clients authenticate with
        the method they are registered with: `client_secret_post`
        (`client_id` and `client_secret` in the body) or
        `client_secret_basic` (HTTP Basic, with the client ID and secret
        form-urlencoded before base64 encoding). Using both methods in one
        request is rejected.
      x-source:
        - https://www.rfc-editor.org/rfc/rfc6749#section-4.4
        - https://www.rfc-editor.org/rfc/rfc6749#section-4.1.3
        - https://www.rfc-editor.org/rfc/rfc7636#section-4.6
        - https://www.rfc-editor.org/rfc/rfc6749#section-2.3.1
        - https://auth0.com/docs/api/authentication
        - https://auth0.com/docs/get-started/authentication-and-authorization-flow/client-credentials-flow
        - https://www.rfc-editor.org/rfc/rfc6749#section-6
        - https://auth0.com/docs/secure/tokens/refresh-tokens/use-refresh-tokens
        - https://auth0.com/docs/secure/tokens/refresh-tokens/refresh-token-rotation
        - https://www.rfc-editor.org/rfc/rfc6749#section-4.3
        - https://auth0.com/docs/api/authentication/resource-owner-password-flow/get-token
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Tokens issued.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/OAuthErrorResponse"
        "401":
          $ref: "#/components/responses/OAuthErrorResponse"
        "403":
          $ref: "#/components/responses/OAuthErrorResponse"
        "404":
          $ref: "#/components/responses/UnknownTenant"
        "429":
          $ref: "#/components/responses/OAuthErrorResponse"
        default:
          $ref: "#/components/responses/ServerError"
  /oauth/revoke:
    post:
      operationId: oauthRevoke
      tags: [Tokens]
      summary: Revoke a refresh token
      description: |
        Revokes a refresh token together with every refresh token derived
        from the same login (its rotation family). The client authenticates
        as at `/oauth/token`. An unknown token is not an error (RFC 7009),
        so the response does not reveal whether a token existed. Access
        tokens are self-contained JWTs and cannot be revoked; they expire.
      x-source:
        - https://www.rfc-editor.org/rfc/rfc7009
        - https://auth0.com/docs/api/authentication
        - https://auth0.com/docs/secure/tokens/refresh-tokens/revoke-refresh-tokens
      security:
        - clientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "200":
          description: The token was revoked, or was not a known refresh token.
        "400":
          $ref: "#/components/responses/OAuthErrorResponse"
        "401":
          $ref: "#/components/responses/OAuthErrorResponse"
        "404":
          $ref: "#/components/responses/UnknownTenant"
        default:
          $ref: "#/components/responses/ServerError"
  /userinfo:
    get:
      operationId: userinfo
      tags: [Users]
      summary: Get the user's profile
      description: |
        Returns OpenID Connect claims about the user an access token was
        issued to. The access token must include `https://{tenant_domain}/userinfo`
        in its audience, which tokens requested with scope `openid` do. Claims
        follow the token's scopes: `profile` adds name, nickname, picture and
        updated_at; `email` adds email and email_verified.
      x-source:
        - https://openid.net/specs/openid-connect-core-1_0.html#UserInfo
        - https://www.rfc-editor.org/rfc/rfc6750#section-2.1
        - https://auth0.com/docs/api/authentication
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's claims.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          description: Missing or invalid access token.
          headers:
            WWW-Authenticate:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "404":
          $ref: "#/components/responses/UnknownTenant"
        default:
          $ref: "#/components/responses/ServerError"
    post:
      operationId: userinfoPost
      tags: [Users]
      summary: Get the user's profile (POST)
      description: Same as `GET /userinfo`.
      x-source:
        - https://openid.net/specs/openid-connect-core-1_0.html#UserInfo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "404":
          $ref: "#/components/responses/UnknownTenant"
        default:
          $ref: "#/components/responses/ServerError"
  /v2/logout:
    get:
      operationId: logout
      tags: [Login]
      summary: Log the user out
      description: |
        Ends the user's session with this tenant, then redirects to
        `returnTo`. With `client_id`, `returnTo` must be one of that
        application's allowed logout URLs; without it, one of the tenant's.
        The query string and fragment of `returnTo` are not compared, and the
        scheme and host are case-insensitive. With `client_id` and no
        `returnTo`, the application's first allowed logout URL is used;
        otherwise a logged-out page is shown.

        An unknown `client_id` or a `returnTo` that is not allowed shows an
        error page; the session is not ended and nothing is redirected.
        Refresh tokens are not revoked by logout.
      x-source:
        - https://auth0.com/docs/api/authentication
        - https://auth0.com/docs/authenticate/login/logout
        - https://auth0.com/docs/authenticate/login/logout/redirect-users-after-logout
      parameters:
        - {name: returnTo, in: query, schema: {type: string}, description: Where to send the browser after logout.}
        - {name: client_id, in: query, schema: {type: string}, description: The application asking for the logout.}
        - {name: federated, in: query, schema: {type: string}, description: Accepted and ignored; there are no upstream identity providers yet.}
      responses:
        "302":
          description: Logged out; redirect to `returnTo`.
        "200":
          description: Logged out; no return URL.
          content:
            text/html:
              schema: {type: string}
        "400":
          description: Unknown application or return URL not allowed. Not logged out.
          content:
            text/html:
              schema: {type: string}
        "404":
          $ref: "#/components/responses/UnknownTenant"
        "500":
          description: Error page.
          content:
            text/html:
              schema: {type: string}
  /oidc/logout:
    get:
      operationId: oidcLogout
      tags: [Login]
      summary: Log the user out (OpenID Connect RP-Initiated Logout)
      description: |
        Ends the user's session and redirects to `post_logout_redirect_uri`
        with `state`. The URI must exactly match (including any query
        string) an allowed logout URL of the application named by
        `id_token_hint` or `client_id`, or of the tenant when neither is
        given. `id_token_hint` may be expired.

        If the browser has a session and neither the hint's `sid` nor
        `logout_hint` matches it, a confirmation page is shown first.
        Invalid requests (a bad or foreign `id_token_hint`, contradicting
        hints, an unknown application, an unregistered URI) show an error
        page and do not end the session.
      x-source:
        - https://openid.net/specs/openid-connect-rpinitiated-1_0.html
        - https://auth0.com/docs/authenticate/login/logout/log-users-out-of-auth0
      parameters:
        - {name: id_token_hint, in: query, schema: {type: string}, description: An ID token this tenant issued to the user.}
        - {name: logout_hint, in: query, schema: {type: string}, description: The session ID (`sid`) to end.}
        - {name: client_id, in: query, schema: {type: string}, description: The application asking for the logout.}
        - {name: post_logout_redirect_uri, in: query, schema: {type: string}, description: Where to send the browser after logout.}
        - {name: state, in: query, schema: {type: string}, description: Returned unchanged on the redirect.}
        - {name: ui_locales, in: query, schema: {type: string}, description: Language for the confirmation and logged-out pages (first entry only).}
      responses:
        "302":
          description: Logged out; redirect to `post_logout_redirect_uri`.
        "200":
          description: Logged-out page, or the logout confirmation page.
          content:
            text/html:
              schema: {type: string}
        "400":
          description: Invalid logout request. Not logged out.
          content:
            text/html:
              schema: {type: string}
        "404":
          $ref: "#/components/responses/UnknownTenant"
        "500":
          description: Error page.
          content:
            text/html:
              schema: {type: string}
    post:
      operationId: oidcLogoutPost
      tags: [Login]
      summary: Log the user out (form post)
      description: Same as `GET /oidc/logout` with the parameters in a form body. The confirmation page posts here with `confirm=yes` and its `csrf` token.
      x-source:
        - https://openid.net/specs/openid-connect-rpinitiated-1_0.html
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OidcLogoutRequest"
      responses:
        "302":
          description: Logged out; redirect to `post_logout_redirect_uri`.
        "200":
          description: Logged-out page, or the logout confirmation page.
          content:
            text/html:
              schema: {type: string}
        "400":
          description: Invalid logout request. Not logged out.
          content:
            text/html:
              schema: {type: string}
        "404":
          $ref: "#/components/responses/UnknownTenant"
        "500":
          description: Error page.
          content:
            text/html:
              schema: {type: string}
  /dbconnections/signup:
    post:
      operationId: dbconnectionsSignup
      tags: [Users]
      summary: Sign up a user
      description: |
        Creates a user on a database connection. The body may be JSON or
        form-encoded; `user_metadata` is an object and so needs JSON. The
        connection must be enabled for `client_id` and must allow sign-up.
        The user starts with `email_verified` false. Because zeroauthy has no
        global client, `client_id` is required. Sign-ups count against the
        same per-IP limit as the hosted sign-up page; while it is reached the
        response is `429` with `too_many_requests`.

        **Errors** use the `{error, error_description}` shape:
        `invalid_request` (missing or malformed parameters, unknown client),
        `invalid_signup` (connection not enabled for the client, sign-up
        disabled, invalid email or profile), `invalid_password` (password
        policy not met) and `user_exists` (409).
      x-source:
        - https://auth0.com/docs/api/authentication/signup/create-a-new-user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SignupFormRequest"
      responses:
        "200":
          description: The user was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
        "400":
          $ref: "#/components/responses/OAuthErrorResponse"
        "404":
          $ref: "#/components/responses/UnknownTenant"
        "409":
          $ref: "#/components/responses/OAuthErrorResponse"
        "429":
          $ref: "#/components/responses/OAuthErrorResponse"
        default:
          $ref: "#/components/responses/ServerError"
  /dbconnections/change_password:
    post:
      operationId: dbconnectionsChangePassword
      tags: [Users]
      summary: Request a password reset email
      description: |
        Emails a single-use link, valid for 24 hours, that lets the user
        choose a new password on a database connection. The body may be JSON
        or form-encoded. `client_id` is optional; when given it must exist.
        The response is plain text. An unknown user is answered `404` with
        `user_not_found`. A blocked user, or one who already received three
        links in the past hour, still gets `200` but no email. Requests count
        against the per-IP limit; while it is reached the response is `429`.
      x-source:
        - https://auth0.com/docs/api/authentication/change-password/change-password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: The reset email was sent, or is not sent for this user.
          content:
            text/plain:
              schema: {type: string}
        "400":
          $ref: "#/components/responses/OAuthErrorResponse"
        "404":
          description: The tenant is unknown, or the user does not exist (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthErrorResponse"
        default:
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    clientSecretBasic:
      type: http
      scheme: basic
      description: Client ID and secret, each form-urlencoded, as HTTP Basic credentials.
    bearerAuth:
      type: http
      scheme: bearer
      description: An access token issued by this tenant.
  responses:
    OAuthErrorResponse:
      description: |
        The request failed. Common `error` values: `invalid_request`,
        `invalid_client`, `unauthorized_client`, `unsupported_grant_type`,
        `invalid_scope`, `access_denied`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
    UnknownTenant:
      description: The request host is not a domain of any tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
  schemas:
    OidcLogoutRequest:
      type: object
      properties:
        id_token_hint: {type: string}
        logout_hint: {type: string}
        client_id: {type: string}
        post_logout_redirect_uri: {type: string}
        state: {type: string}
        ui_locales: {type: string}
        confirm:
          type: string
          description: Set by the confirmation page.
        csrf:
          type: string
          description: Set by the confirmation page.
    SignupRequest:
      type: object
      required: [client_id, connection, email, password]
      properties:
        client_id: {type: string}
        connection:
          type: string
          description: Name of the database connection.
        email: {type: string}
        password: {type: string}
        username:
          type: string
          description: Required when the connection requires usernames.
        given_name: {type: string, maxLength: 300}
        family_name: {type: string, maxLength: 300}
        name: {type: string, maxLength: 300}
        nickname: {type: string, maxLength: 300}
        picture:
          type: string
          maxLength: 2000
          description: An absolute https URL of at most 2000 characters.
        user_metadata:
          type: object
          description: At most 10 properties; string values of at most 500 characters.
          maxProperties: 10
          additionalProperties: {type: string, maxLength: 500}
    ChangePasswordRequest:
      type: object
      required: [connection, email]
      properties:
        client_id: {type: string}
        connection:
          type: string
          description: Name of the database connection.
        email: {type: string}
    SignupFormRequest:
      type: object
      description: |
        The form-encoded variant of SignupRequest. Form bodies cannot carry
        the `user_metadata` object.
      required: [client_id, connection, email, password]
      properties:
        client_id: {type: string}
        connection: {type: string}
        email: {type: string}
        password: {type: string}
        username: {type: string}
        given_name: {type: string, maxLength: 300}
        family_name: {type: string, maxLength: 300}
        name: {type: string, maxLength: 300}
        nickname: {type: string, maxLength: 300}
        picture: {type: string, maxLength: 2000}
    SignupResponse:
      type: object
      required: [_id, email_verified, email]
      properties:
        _id:
          type: string
          description: The user ID without the `auth0|` prefix.
        email_verified: {type: boolean}
        email: {type: string}
        username: {type: string}
        given_name: {type: string}
        family_name: {type: string}
        name: {type: string}
        nickname: {type: string}
        picture: {type: string}
    OAuthError:
      type: object
      required: [error, error_description]
      properties:
        error:
          type: string
          examples: [invalid_client]
        error_description:
          type: string
    RevokeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The refresh token to revoke.
        token_type_hint:
          type: string
          description: Accepted and ignored; only refresh tokens can be revoked.
        client_id:
          type: string
        client_secret:
          type: string
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          examples: [client_credentials]
        client_id:
          type: string
        client_secret:
          type: string
        audience:
          type: string
          description: Identifier of the API the token is for. Defaults to the tenant's default audience.
        scope:
          type: string
          description: Space-separated scopes to request. Defaults to all scopes granted to the client.
        code:
          type: string
          description: Authorization code (grant_type=authorization_code).
        redirect_uri:
          type: string
          description: Must equal the redirect_uri of the authorization request.
        code_verifier:
          type: string
          description: PKCE verifier for the code_challenge sent to /authorize.
        refresh_token:
          type: string
          description: Refresh token (grant_type=refresh_token).
        username:
          type: string
          description: The user's email or username (password grants).
        password:
          type: string
          description: The user's password (password grants).
        realm:
          type: string
          description: Name of the database connection to sign in with (grant_type=http://auth0.com/oauth/grant-type/password-realm).
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          minimum: 0
          description: Lifetime of the access token in seconds.
        scope:
          type: string
        id_token:
          type: string
        refresh_token:
          type: string
    OpenIDConfiguration:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
      properties:
        issuer: {type: string, format: uri}
        authorization_endpoint: {type: string, format: uri}
        token_endpoint: {type: string, format: uri}
        revocation_endpoint: {type: string, format: uri}
        jwks_uri: {type: string, format: uri}
        end_session_endpoint: {type: string, format: uri}
        response_types_supported: {type: array, items: {type: string}}
        subject_types_supported: {type: array, items: {type: string}}
        id_token_signing_alg_values_supported: {type: array, items: {type: string}}
        token_endpoint_auth_methods_supported: {type: array, items: {type: string}}
        grant_types_supported: {type: array, items: {type: string}}
        userinfo_endpoint: {type: string, format: uri}
        response_modes_supported: {type: array, items: {type: string}}
        code_challenge_methods_supported: {type: array, items: {type: string}}
        scopes_supported: {type: array, items: {type: string}}
        claims_supported: {type: array, items: {type: string}}
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JWK"
    JWK:
      type: object
      required: [kty, kid, use, alg, n, e]
      properties:
        kty: {type: string, examples: [RSA]}
        kid: {type: string}
        use: {type: string, examples: [sig]}
        alg: {type: string, examples: [RS256]}
        "n": {type: string}
        e: {type: string}
    UserInfo:
      type: object
      required: [sub]
      properties:
        sub: {type: string}
        name: {type: string}
        nickname: {type: string}
        picture: {type: string}
        updated_at: {type: integer}
        email: {type: string}
        email_verified: {type: boolean}
      additionalProperties: true
