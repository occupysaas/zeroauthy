name: dco
# Every commit in a pull request must carry a Signed-off-by line for its
# author, certifying the Developer Certificate of Origin 1.1 (CONTRIBUTING.md).
# Merge commits are skipped. Runs on the pull_request event, so fork PRs get
# a read-only token and no secrets.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-dco.sh "$BASE" "$HEAD"
