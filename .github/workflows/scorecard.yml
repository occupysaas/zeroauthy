name: Scorecard
# OpenSSF Scorecard (https://scorecard.dev) checks the repository's security
# practices every week and on every push to main. Results appear in the
# Security tab under Code scanning and are published to the public Scorecard
# API. Publishing requires this job to use only Scorecard-approved actions,
# with no run steps and no workflow-level env.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 1"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # sign the results published to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
