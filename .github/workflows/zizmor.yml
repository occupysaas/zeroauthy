name: zizmor
# Audits the GitHub Actions workflows and dependabot.yml for security
# problems (https://docs.zizmor.sh) on every push to main and every pull
# request. Findings appear in the Security tab under Code scanning. Findings
# we accept are recorded, with the reason, in .github/zizmor.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
