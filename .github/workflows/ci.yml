name: ci
# Never runs on its own for pushes or pull requests (maintainer, 2026-11-04).
# It starts from the Actions tab ("Run workflow"), from plan-branch.yml on
# pushes to plan-* branches (maintainer, 2026-11-07), and as the first gate
# of the release workflow.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # grpcstore and sqlstore run longer than go test's 10-minute default
      # under -race on hosted runners.
      - run: go test -race -timeout=60m ./...
        env:
          ZA_REQUIRE_NODE: "1"
      - run: CGO_ENABLED=0 go build ./cmd/zeroauthy
      - name: generated code is up to date
        run: go generate ./... && git diff --exit-code
  vulncheck:
    # Known-vulnerability scan of Go dependencies and the standard library.
    # Also a release gate, since release.yml reuses this workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          # go-version-input defaults to "stable"; clear it so go.mod decides.
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: make console
      - name: the committed console build and API types are up to date
        run: git diff --exit-code -- console/dist console/src/api/schema.d.ts
  e2e:
    # One job per suite so they run in parallel; a failure in one suite does
    # not hide the others.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, e2e-domains, e2e-deploy, e2e-signing, e2e-branding, e2e-email, e2e-social, e2e-email-accounts, e2e-rbac, e2e-actions, e2e-actions-ii, e2e-organizations, e2e-organizations-ii, e2e-logs, e2e-events, e2e-mfa, e2e-passkeys, e2e-passwordless]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Social profile scripts need Node 25+ (permission-enforced network
      # denial); the lane fails rather than skips without it.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: pinned Auth0 CLI
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/auth0/auth0-cli/cmd/auth0@v1.37.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: container runtime (ACME fixtures, device lane)
        if: matrix.suite == 'e2e' || matrix.suite == 'e2e-domains'
        run: sudo apt-get update && sudo apt-get install -y podman podman-compose
      - run: make ${{ matrix.suite }}
        env:
          ZA_REQUIRE_NODE: "1"
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: zeroauthy
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zeroauthy
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pzeroauthy --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -timeout=90m ./internal/store/sqlstore/...
        env:
          ZA_TEST_POSTGRES_DSN: postgres://postgres:zeroauthy@127.0.0.1:55432/postgres?sslmode=disable
          ZA_TEST_MYSQL_DSN: mysql://root:zeroauthy@127.0.0.1:53306/
