name: ci
# Never runs on its own for pushes or pull requests (maintainer, 2026-11-04).
# It starts from the Actions tab ("Run workflow"), from plan-branch.yml on
# pushes to plan-* branches (maintainer, 2026-11-07), and as the first gate
# of the release workflow.
on:
  workflow_dispatch:
  workflow_call:

# Every job starts with no token permissions and gets only what it uses.
permissions: {}

jobs:
  checks:
    # Formatting, vet, build and generated code. The tests run in go-test.
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./cmd/zeroauthy
      - name: generated code is up to date
        run: go generate ./... && git diff --exit-code
  test-groups:
    # The go-test matrix comes from scripts/test-group.sh, so every group and
    # store shard it defines is tested and no package is left out.
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    outputs:
      jobs: ${{ steps.list.outputs.jobs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - id: list
        run: echo "jobs=$(./scripts/test-group.sh --json)" >> "$GITHUB_OUTPUT"
  go-test:
    name: go-test (${{ matrix.group }})
    # go test -race by area (scripts/test-group.sh --list). One job per group
    # so a slow area can't push the others past the timeout, and a failure
    # names the area.
    needs: test-groups
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.test-groups.outputs.jobs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      # Each SQL conformance case migrates a fresh database. Keep those files
      # on tmpfs to avoid disk fsync dominating race-instrumented SQLite.
      # Compiler scratch stays on disk so builds cannot exhaust /dev/shm.
      - name: temporary storage for tests
        run: install -d -m 700 /dev/shm/za-test /tmp/za-build
      - run: ./scripts/test-group.sh "$GROUP" -race -timeout=45m
        env:
          GROUP: ${{ matrix.group }}
          TMPDIR: /dev/shm/za-test
          GOTMPDIR: /tmp/za-build
          ZA_REQUIRE_NODE: "1"
  vulncheck:
    # Known-vulnerability scan of Go dependencies and the standard library.
    # Also a release gate, since release.yml reuses this workflow.
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # Scan the checkout above, which keeps no credentials; the action's
          # own checkout would store the token again.
          repo-checkout: false
          # go-version-input defaults to "stable"; clear it so go.mod decides.
          go-version-input: ""
          go-version-file: go.mod
          go-package: ./...
  console:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: make console
      - name: the committed console build and API types are up to date
        run: git diff --exit-code -- console/dist console/src/api/schema.d.ts
  e2e:
    # One job per suite so they run in parallel; a failure in one suite does
    # not hide the others.
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      # Check out the repository; gh reads auth0/auth0-cli's public releases.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, e2e-domains, e2e-deploy, e2e-signing, e2e-branding, e2e-email, e2e-social, e2e-enterprise-oidc, e2e-apple, e2e-github, e2e-email-accounts, e2e-rbac, e2e-actions, e2e-actions-ii, e2e-organizations, e2e-organizations-ii, e2e-logs, e2e-events, e2e-mfa, e2e-passkeys, e2e-passwordless, e2e-client-auth, e2e-refresh-tokens, e2e-logout, e2e-saml, e2e-wsfed, e2e-scim, e2e-self-service]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Social profile scripts need Node 25+ (permission-enforced network
      # denial); the lane fails rather than skips without it.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      # The release binary, not go install: the suites check that
      # `auth0 --version` reports 1.37.0, which only release builds stamp.
      - name: pinned Auth0 CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/auth0" && cd "$RUNNER_TEMP/auth0"
          gh release download v1.37.0 -R auth0/auth0-cli -p auth0-cli_1.37.0_Linux_x86_64.tar.gz -p checksums.txt
          grep ' auth0-cli_1.37.0_Linux_x86_64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf auth0-cli_1.37.0_Linux_x86_64.tar.gz auth0
          echo "$RUNNER_TEMP/auth0" >> "$GITHUB_PATH"
          ./auth0 --version
      - name: container runtime (ACME fixtures, device lane)
        if: matrix.suite == 'e2e' || matrix.suite == 'e2e-domains'
        run: sudo apt-get update && sudo apt-get install -y podman podman-compose
      - run: make "$E2E_SUITE"
        env:
          E2E_SUITE: ${{ matrix.suite }}
          ZA_REQUIRE_NODE: "1"
  sql:
    # The SQL store on the server dialects, without -race (go-test already
    # runs it under the race detector on SQLite), as the four store shards of
    # scripts/test-group.sh: MySQL alone took 56 minutes in one job, because
    # it creates a database per test. SQLite also runs in each job; it takes
    # about a minute without -race.
    name: sql (${{ matrix.dialect }} ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        dialect: [postgres, mysql]
        group: ["store-sqlite:1", "store-sqlite:2", "store-sqlite:3", "store-sqlite:other"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: zeroauthy
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zeroauthy
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pzeroauthy --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: ./scripts/test-group.sh "$GROUP" -count=1 -timeout=70m
        env:
          GROUP: ${{ matrix.group }}
          ZA_TEST_POSTGRES_DSN: ${{ matrix.dialect == 'postgres' && 'postgres://postgres:zeroauthy@127.0.0.1:55432/postgres?sslmode=disable' || '' }}
          ZA_TEST_MYSQL_DSN: ${{ matrix.dialect == 'mysql' && 'mysql://root:zeroauthy@127.0.0.1:53306/' || '' }}
