name: conformance
# On demand from the Actions tab, and as the last gate of the release
# workflow. See tests/conformance/README.md.
on:
  workflow_dispatch:
    inputs:
      plans:
        description: "Space-separated plans to run (basic, config, formpost, logout)"
        required: false
        default: "basic config formpost logout"
        type: string
  workflow_call:
    inputs:
      plans:
        required: false
        default: "basic config formpost logout"
        type: string

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run the OpenID conformance plans
        env:
          CONFORMANCE_RUNTIME: docker
          PLANS: ${{ inputs.plans }}
        run: |
          # Word-split on purpose; run.sh rejects any name that is not a known plan.
          read -r -a plans <<<"$PLANS"
          ./tests/conformance/run.sh "${plans[@]}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-results
          path: tests/conformance/results/
          if-no-files-found: ignore
