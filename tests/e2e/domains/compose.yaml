# Isolated local ACME fixture for Plan 23 service-level tests. Pebble (MPL-2.0)
# is pinned by digest in fixtures.lock.json; it never talks to a public CA or
# resolver. Host networking keeps every port on loopback: Pebble validates
# challenges against the test process's listeners (5002 HTTP-01, 5001
# TLS-ALPN-01) and resolves names only through the test DNS server on 8053.
name: zeroauthy-domains
services:
  pebble:
    image: ghcr.io/letsencrypt/pebble@sha256:358790ea96cb0bafc00679fb117919c58fe11120276572d92c23b89152e5a24d
    container_name: zeroauthy-domains-pebble
    network_mode: host
    command: ["-config", "test/config/pebble-config.json", "-dnsserver", "127.0.0.1:8053"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
      PEBBLE_AUTHZREUSE: "0"
