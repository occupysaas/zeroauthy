# tests/e2e/seed.yaml: test-only credentials; never reuse them.
tenants:
  - name: e2e
    friendly_name: E2E
    enabled_locales: [en, fr]
    custom_text:
      login:
        fr:
          login:
            title: "Connexion à ${companyName}"
            buttonText: "Continuer"
    domains: ["localhost:8443"]
    default_directory: Username-Password-Authentication
    resource_servers:
      - identifier: https://api.e2e.local
        skip_consent_for_verifiable_first_party_clients: true
        name: E2E API
        token_lifetime: 3600
        allow_offline_access: true
        scopes:
          - {value: "read:things", description: "Read things"}
    clients:
      - client_id: e2e-m2m
        name: E2E machine client
        app_type: non_interactive
        client_secret: e2e-m2m-secret-not-for-production
        grant_types: [client_credentials]
      - client_id: e2e-spa
        name: E2E SPA
        app_type: spa
        grant_types: [authorization_code]
        callbacks: ["https://localhost:3443/"]
        allowed_logout_urls: ["https://localhost:3443/"]
        web_origins: ["https://localhost:3443"]
        allowed_origins: ["https://localhost:3443"]
      - client_id: e2e-react
        name: E2E React
        app_type: spa
        grant_types: [authorization_code, refresh_token]
        callbacks: ["https://localhost:3443/react/"]
        allowed_logout_urls: ["https://localhost:3443/react/"]
        web_origins: ["https://localhost:3443"]
        allowed_origins: ["https://localhost:3443"]
      - client_id: e2e-next
        name: E2E Next.js
        app_type: regular_web
        client_secret: e2e-next-secret-not-for-production
        token_endpoint_auth_method: client_secret_post
        grant_types: [authorization_code, refresh_token]
        callbacks: ["http://localhost:3000/auth/callback"]
        allowed_logout_urls: ["http://localhost:3000", "http://localhost:3000/"]
      - client_id: e2e-node
        name: E2E node-auth0
        app_type: regular_web
        client_secret: e2e-node-secret-not-for-production
        grant_types: [password, "http://auth0.com/oauth/grant-type/password-realm", refresh_token]
    client_grants:
      - client_id: e2e-m2m
        audience: https://api.e2e.local
        scopes: ["read:things"]
    connections:
      - name: Username-Password-Authentication
        enabled_clients: [e2e-spa, e2e-react, e2e-next, e2e-node]
      # Custom database connections backed by tests/e2e/legacy-store.mjs.
      - name: legacy-users
        enabledDatabaseCustomization: true
        import_mode: false
        enabled_clients: [e2e-spa, e2e-node]
        configuration: &legacy_configuration
          API: "http://127.0.0.1:8099"
          TOKEN: "e2e-legacy-token"
        customScripts: &legacy_scripts
          login: |
            async function login(email, password, callback) {
              const res = await fetch(configuration.API + "/login", {
                method: "POST",
                headers: { "content-type": "application/json", authorization: "Bearer " + configuration.TOKEN },
                body: JSON.stringify({ email, password }),
                signal: AbortSignal.timeout(5000),
              });
              if (res.status === 401) return callback(new WrongUsernameOrPasswordError(email));
              if (!res.ok) return callback(new Error("legacy store answered " + res.status));
              callback(null, await res.json());
            }
          get_user: |
            async function getUser(email, callback) {
              const res = await fetch(configuration.API + "/users?email=" + encodeURIComponent(email), {
                headers: { authorization: "Bearer " + configuration.TOKEN },
                signal: AbortSignal.timeout(5000),
              });
              if (res.status === 404) return callback(null);
              if (!res.ok) return callback(new Error("legacy store answered " + res.status));
              callback(null, await res.json());
            }
          create: |
            async function create(user, callback) {
              const res = await fetch(configuration.API + "/users", {
                method: "POST",
                headers: { "content-type": "application/json", authorization: "Bearer " + configuration.TOKEN },
                body: JSON.stringify({ email: user.email, password: user.password }),
                signal: AbortSignal.timeout(5000),
              });
              if (!res.ok) return callback(new Error("legacy store answered " + res.status));
              callback(null);
            }
          change_password: |
            async function changePassword(email, newPassword, callback) {
              const res = await fetch(configuration.API + "/password", {
                method: "POST",
                headers: { "content-type": "application/json", authorization: "Bearer " + configuration.TOKEN },
                body: JSON.stringify({ email, password: newPassword }),
                signal: AbortSignal.timeout(5000),
              });
              if (!res.ok) return callback(new Error("legacy store answered " + res.status));
              callback(null, true);
            }
      - name: import-users
        enabledDatabaseCustomization: true
        import_mode: true
        enabled_clients: [e2e-spa, e2e-node]
        configuration: *legacy_configuration
        customScripts: *legacy_scripts
    users:
      - connection: Username-Password-Authentication
        email: alice@e2e.local
        password: "Correct-Horse-Battery-9"
        email_verified: true
        name: Alice Example
      - connection: Username-Password-Authentication
        email: reset-me@e2e.local
        password: "Correct-Horse-Battery-9"
        email_verified: true
        name: Reset Example
