# tests/e2e/seed.yaml: test-only credentials; never reuse them.
tenants:
  - name: e2e
    friendly_name: E2E
    enabled_locales: [en, fr]
    custom_text:
      login:
        fr:
          login:
            title: "Connexion à ${companyName}"
            buttonText: "Continuer"
    pushed_authorization_requests_supported: true
    domains: ["localhost:8443"]
    # Every existing E2E app uses a localhost callback; the default prompt would
    # change their flows. Individual clients opt back in.
    skip_non_verifiable_callback_uri_confirmation_prompt: true
    default_directory: Username-Password-Authentication
    resource_servers:
      - identifier: https://api.e2e.local
        skip_consent_for_verifiable_first_party_clients: true
        name: E2E API
        token_lifetime: 3600
        allow_offline_access: true
        scopes:
          - {value: "read:things", description: "Read things"}
      # Device flow (m10-device): no skip, so the device flow shows consent.
      - identifier: https://consent.e2e.local
        name: E2E Consent API
        token_lifetime: 3600
        allow_offline_access: true
        scopes:
          - {value: "read:things", description: "Read things"}
      - identifier: https://locked.e2e.local
        name: E2E Locked API
        token_lifetime: 3600
        subject_type_authorization: {user: {policy: deny_all}}
        scopes:
          - {value: "read:locked", description: "Read locked things"}
    clients:
      - client_id: e2e-m2m
        name: E2E machine client
        app_type: non_interactive
        client_secret: e2e-m2m-secret-not-for-production
        grant_types: [client_credentials]
      - client_id: e2e-spa
        name: E2E SPA
        app_type: spa
        grant_types: [authorization_code]
        callbacks: ["https://localhost:3443/"]
        allowed_logout_urls: ["https://localhost:3443/"]
        web_origins: ["https://localhost:3443"]
        allowed_origins: ["https://localhost:3443"]
      - client_id: e2e-react
        name: E2E React
        app_type: spa
        grant_types: [authorization_code, refresh_token]
        callbacks: ["https://localhost:3443/react/"]
        allowed_logout_urls: ["https://localhost:3443/react/"]
        web_origins: ["https://localhost:3443"]
        allowed_origins: ["https://localhost:3443"]
      - client_id: e2e-next
        name: E2E Next.js
        app_type: regular_web
        client_secret: e2e-next-secret-not-for-production
        token_endpoint_auth_method: client_secret_post
        grant_types: [authorization_code, refresh_token]
        callbacks: ["http://localhost:3000/auth/callback"]
        allowed_logout_urls: ["http://localhost:3000", "http://localhost:3000/"]
      - client_id: e2e-node
        name: E2E node-auth0
        app_type: regular_web
        client_secret: e2e-node-secret-not-for-production
        grant_types: [password, "http://auth0.com/oauth/grant-type/password-realm", refresh_token]
      - client_id: e2e-3p-web
        name: E2E Partner Web
        app_type: regular_web
        is_first_party: false
        third_party_security_mode: permissive
        client_secret: e2e-3p-web-secret-not-for-production
        token_endpoint_auth_method: client_secret_basic # express-openid-connect's default
        grant_types: [authorization_code]
        callbacks: ["http://localhost:3001/callback"]
        allowed_logout_urls: ["http://localhost:3001"]
      - client_id: e2e-3p-strict
        name: E2E Partner Strict
        app_type: spa
        is_first_party: false
        grant_types: [authorization_code]
        callbacks: ["https://localhost:3443/strict/"]
        web_origins: ["https://localhost:3443"]
        allowed_origins: ["https://localhost:3443"]
      - client_id: e2e-confirm
        name: E2E Confirm
        app_type: spa
        grant_types: [authorization_code]
        skip_non_verifiable_callback_uri_confirmation_prompt: false
        callbacks: ["https://localhost:3443/confirm/"]
        web_origins: ["https://localhost:3443"]
        allowed_origins: ["https://localhost:3443"]
      - client_id: e2e-par-web
        name: E2E PAR express-openid-connect
        app_type: regular_web
        client_secret: e2e-par-web-secret-not-for-production
        token_endpoint_auth_method: client_secret_basic # express-openid-connect's default
        require_pushed_authorization_requests: true
        grant_types: [authorization_code]
        callbacks: ["http://localhost:3004/callback"]
        allowed_logout_urls: ["http://localhost:3004"]
      - client_id: e2e-next-par
        name: E2E PAR Next.js
        app_type: regular_web
        client_secret: e2e-next-par-secret-not-for-production
        token_endpoint_auth_method: client_secret_post
        require_pushed_authorization_requests: true
        grant_types: [authorization_code, refresh_token]
        callbacks: ["http://localhost:3002/auth/callback"]
        allowed_logout_urls: ["http://localhost:3002", "http://localhost:3002/"]
      - client_id: e2e-par-authjs
        name: E2E PAR auth0-auth-js
        app_type: regular_web
        client_secret: e2e-par-authjs-secret-not-for-production
        token_endpoint_auth_method: client_secret_post
        require_pushed_authorization_requests: true
        grant_types: [authorization_code]
        callbacks: ["https://par.e2e.invalid/cb"]
      - client_id: e2e-device
        name: E2E Device
        app_type: native
        token_endpoint_auth_method: none
        grant_types: ["urn:ietf:params:oauth:grant-type:device_code", refresh_token]
    client_grants:
      - client_id: e2e-m2m
        audience: https://api.e2e.local
        scopes: ["read:things"]
      - {client_id: e2e-3p-strict, audience: https://api.e2e.local, subject_type: user, scopes: ["read:things"]}
    connections:
      - name: Username-Password-Authentication
        is_domain_connection: true
        enabled_clients: [e2e-spa, e2e-react, e2e-next, e2e-node, e2e-confirm, e2e-par-web, e2e-next-par, e2e-par-authjs, e2e-device]
      # Custom database connections backed by tests/e2e/legacy-store.mjs.
      - name: legacy-users
        enabledDatabaseCustomization: true
        import_mode: false
        enabled_clients: [e2e-spa, e2e-node]
        configuration: &legacy_configuration
          API: "http://127.0.0.1:8099"
          TOKEN: "e2e-legacy-token"
        customScripts: &legacy_scripts
          login: |
            async function login(email, password, callback) {
              const res = await fetch(configuration.API + "/login", {
                method: "POST",
                headers: { "content-type": "application/json", authorization: "Bearer " + configuration.TOKEN },
                body: JSON.stringify({ email, password }),
                signal: AbortSignal.timeout(5000),
              });
              if (res.status === 401) return callback(new WrongUsernameOrPasswordError(email));
              if (!res.ok) return callback(new Error("legacy store answered " + res.status));
              callback(null, await res.json());
            }
          get_user: |
            async function getUser(email, callback) {
              const res = await fetch(configuration.API + "/users?email=" + encodeURIComponent(email), {
                headers: { authorization: "Bearer " + configuration.TOKEN },
                signal: AbortSignal.timeout(5000),
              });
              if (res.status === 404) return callback(null);
              if (!res.ok) return callback(new Error("legacy store answered " + res.status));
              callback(null, await res.json());
            }
          create: |
            async function create(user, callback) {
              const res = await fetch(configuration.API + "/users", {
                method: "POST",
                headers: { "content-type": "application/json", authorization: "Bearer " + configuration.TOKEN },
                body: JSON.stringify({ email: user.email, password: user.password }),
                signal: AbortSignal.timeout(5000),
              });
              if (!res.ok) return callback(new Error("legacy store answered " + res.status));
              callback(null);
            }
          change_password: |
            async function changePassword(email, newPassword, callback) {
              const res = await fetch(configuration.API + "/password", {
                method: "POST",
                headers: { "content-type": "application/json", authorization: "Bearer " + configuration.TOKEN },
                body: JSON.stringify({ email, password: newPassword }),
                signal: AbortSignal.timeout(5000),
              });
              if (!res.ok) return callback(new Error("legacy store answered " + res.status));
              callback(null, true);
            }
      - name: import-users
        enabledDatabaseCustomization: true
        import_mode: true
        enabled_clients: [e2e-spa, e2e-node]
        configuration: *legacy_configuration
        customScripts: *legacy_scripts
    users:
      - connection: Username-Password-Authentication
        email: alice@e2e.local
        password: "Correct-Horse-Battery-9"
        email_verified: true
        name: Alice Example
      - connection: Username-Password-Authentication
        email: reset-me@e2e.local
        password: "Correct-Horse-Battery-9"
        email_verified: true
        name: Reset Example
