<!doctype html>
<html lang="{{.L.Lang}}" dir="{{.L.Dir}}"><body style="font-family:system-ui,sans-serif;color:#1f2933">
{{if .Logo}}<img src="{{.Logo}}" alt="{{.DisplayName}}">{{end}}
{{if .DisplayName}}<p>{{.DisplayName}}</p>{{end}}
<h1 style="font-size:20px">{{t .L "zeroauthy.email-reset-password.heading"}}</h1>
<p>{{t .L "zeroauthy.email-reset-password.body"}}</p>
<p><a href="{{.Link}}" style="background:{{.Primary}};color:#fff;padding:10px 16px;border-radius:6px;text-decoration:none">{{t .L "zeroauthy.email-reset-password.button"}}</a></p>
</body></html>
