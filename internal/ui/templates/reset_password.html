{{define "title"}}{{t .Tenant.L "reset-password.reset-password.title"}}{{end}}
{{define "description"}}{{t .Tenant.L "reset-password.reset-password.description"}}{{end}}
{{define "content"}}
{{if .Data.Error}}<p class="alert" role="alert">{{.Data.Error}}</p>{{end}}
<form method="post" action="/u/reset-password" novalidate>
<input type="hidden" name="ticket" value="{{.Data.Ticket}}">
<input type="hidden" name="csrf" value="{{.Data.CSRF}}">
<label for="password">{{t .Tenant.L "reset-password.reset-password.passwordPlaceholder"}}</label>
<input id="password" name="password" type="password" autocomplete="new-password" required autofocus>
<label for="password_confirm">{{t .Tenant.L "reset-password.reset-password.reEnterpasswordPlaceholder"}}</label>
<input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required>
{{template "captcha" .}}
<button type="submit">{{t .Tenant.L "reset-password.reset-password.buttonText"}}</button>
</form>
{{end}}
