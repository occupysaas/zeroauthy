syntax = "proto3";

package zeroauthy.store.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/zeroauthy/zeroauthy/proto/store/v1;storev1";

// Protocol contract for plugin authors (any language).
//
// Transactions
//   BeginTx returns a tx_id; Commit or Rollback ends it. Send the tx_id on
//   every call that belongs to the transaction. A BeginTx with parent_tx_id
//   opens a nested transaction (a savepoint): rolling it back undoes only the
//   inner work. A transaction tree is a stack: a transaction has at most one
//   open nested transaction, and only the innermost one accepts calls and
//   Commit. Rolling back an ancestor rolls back the chain below it first.
//   Misuse is reported in the response's `error` as KIND_UNSPECIFIED with a
//   message: an unknown or already finished tx_id ("unknown or finished
//   transaction"), and a call or Commit on a transaction that has an open
//   nested one ("has an open nested transaction"). Each tree has one 60
//   second idle timer, restarted by any call in the tree; when it fires the
//   root and everything nested in it are rolled back. A plugin that exits
//   abandons its open transactions; its database rolls them back when the
//   connection drops. The host never retries across the boundary.
//
// Units
//   Every int64 that holds a lifetime, timeout or leeway counts SECONDS
//   (session_lifetime, token_lifetime, leeway, ...). The one exception is
//   RefreshTokensRotateRequest.leeway, a google.protobuf.Duration. Instants
//   are google.protobuf.Timestamp with nanosecond precision.
//
// JSON fields
//   custom_text_json is a JSON object: prompt -> language -> screen -> key ->
//   text, every level an object and every leaf a string. user_metadata_json
//   and app_metadata_json are each any JSON object (nested objects, arrays, strings, numbers, booleans,
//   null); numbers are read back as double-precision floats. An absent
//   optional field means "nil", which is distinct from an empty object.
//
// Absent fields (plugins older than the consent fields)
//   Client.is_first_party absent = true; Client.skip_non_verifiable_callback_
//   uri_confirmation_prompt absent = nil (inherit the tenant);
//   ResourceServer.skip_consent_for_verifiable_first_party_clients absent =
//   true; ClientGrant.subject_type empty = "client". A host sends
//   ClientGrantsFindRequest.subject_type; a plugin that ignores it may return
//   a grant of the other type, which the host treats as not found.
//
// Evolution
//   Within v1, fields are only added, never renumbered or reused. A plugin
//   that predates a field drops it silently. New RPCs may be added; a plugin
//   that lacks one answers with gRPC status Unimplemented, which the host
//   reports as an error.
//
// StoreService mirrors zeroauthy's store.Store. Every request carries tx_id:
// empty means "no transaction"; otherwise the call runs inside the
// transaction BeginTx returned. Domain errors are reported in the response's
// `error` field; gRPC status codes mean transport or plugin failure.
service StoreService {
  rpc Ping(PingRequest) returns (Result);
  rpc BeginTx(BeginTxRequest) returns (BeginTxResponse);
  rpc Commit(EndTxRequest) returns (Result);
  rpc Rollback(EndTxRequest) returns (Result);

  rpc TenantsCreate(TenantWrite) returns (Result);
  rpc TenantsGet(TenantsGetRequest) returns (TenantResult);
  rpc TenantsGetByName(TenantsGetRequest) returns (TenantResult);
  rpc TenantsGetByDomain(TenantsGetRequest) returns (TenantResult);
  rpc TenantsUpdate(TenantWrite) returns (Result);
  rpc TenantsList(TenantsListRequest) returns (TenantList);
  // TenantsDelete removes the tenant and all of its data (key = id).
  // Hosts report Unimplemented as "plugin too old".
  rpc TenantsDelete(TenantsGetRequest) returns (Result);

  rpc ClientsCreate(ClientWrite) returns (Result);
  rpc ClientsGet(ScopedKey) returns (ClientResult);
  rpc ClientsUpdate(ClientWrite) returns (Result);
  rpc ClientsDelete(ScopedKey) returns (Result);
  rpc ClientsList(TenantScope) returns (ClientList);

  rpc ResourceServersCreate(ResourceServerWrite) returns (Result);
  rpc ResourceServersGet(ScopedKey) returns (ResourceServerResult);
  rpc ResourceServersGetByIdentifier(ScopedKey) returns (ResourceServerResult);
  rpc ResourceServersUpdate(ResourceServerWrite) returns (Result);
  rpc ResourceServersDelete(ScopedKey) returns (Result);
  rpc ResourceServersList(TenantScope) returns (ResourceServerList);

  rpc ClientGrantsCreate(ClientGrantWrite) returns (Result);
  rpc ClientGrantsFind(ClientGrantsFindRequest) returns (ClientGrantResult);
  rpc ClientGrantsUpdate(ClientGrantWrite) returns (Result);
  rpc ClientGrantsDelete(ScopedKey) returns (Result);
  rpc ClientGrantsList(ClientGrantsListRequest) returns (ClientGrantList);

  rpc UserGrantsFind(UserGrantsFindRequest) returns (UserGrantResult);
  rpc UserGrantsUpsert(UserGrantWrite) returns (UserGrantResult);
  rpc UserGrantsListByUser(ScopedKey) returns (UserGrantList);   // key = user_id
  rpc UserGrantsListByAudience(ScopedKey) returns (UserGrantList); // key = audience
  rpc UserGrantsDelete(ScopedKey) returns (Result);
  rpc UserGrantsDeleteByUser(ScopedKey) returns (CountResult);   // key = user_id

  rpc SigningKeysCreate(SigningKeyWrite) returns (Result);
  rpc SigningKeysList(TenantScope) returns (SigningKeyList);
  rpc SigningKeysRotate(SigningKeysRotateRequest) returns (Result);

  rpc ConnectionsCreate(ConnectionWrite) returns (Result);
  rpc ConnectionsGet(ScopedKey) returns (ConnectionResult);
  rpc ConnectionsGetByName(ScopedKey) returns (ConnectionResult);
  rpc ConnectionsUpdate(ConnectionWrite) returns (Result);
  rpc ConnectionsList(TenantScope) returns (ConnectionList); // before Plan 15: every connection, by name
  rpc ConnectionsListPage(ConnectionsListPageRequest) returns (ConnectionPage);
  rpc ConnectionsDelete(ScopedKey) returns (Result);

  rpc PasswordHistoriesAdd(PasswordHistoryAdd) returns (Result);
  rpc PasswordHistoriesList(ScopedKey) returns (PasswordHistoryList); // key = user ID

  rpc UsersCreate(UserWrite) returns (Result);
  rpc UsersGet(ScopedKey) returns (UserResult);
  rpc UsersFindByLogin(UsersFindByLoginRequest) returns (UserResult);
  rpc UsersUpdate(UserWrite) returns (Result);
  rpc UsersRecordLogin(UsersRecordLoginRequest) returns (Result);
  rpc UsersSetPasswordHash(UsersSetPasswordHashRequest) returns (Result);
  rpc UsersFindByEmail(UsersFindByEmailRequest) returns (UserListResult);
  rpc UsersSetPasswordHashIfEmpty(UsersSetPasswordHashRequest) returns (Result);
  rpc UsersBumpVersion(ScopedKey) returns (VersionResult);
  rpc UsersDelete(ScopedKey) returns (Result);

  rpc SessionsCreate(SessionWrite) returns (Result);
  rpc SessionsGetByTokenHash(ScopedKey) returns (SessionResult);
  rpc SessionsTouch(TouchRequest) returns (Result);
  rpc SessionsAddClient(SessionsAddClientRequest) returns (Result);
  rpc SessionsDelete(ScopedKey) returns (Result);
  rpc SessionsDeleteByUser(ScopedKey) returns (CountResult);
  rpc SessionsDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  rpc AuthTransactionsCreate(AuthTransactionWrite) returns (Result);
  rpc AuthTransactionsGet(ScopedKey) returns (AuthTransactionResult);
  rpc AuthTransactionsDelete(ScopedKey) returns (Result);
  rpc AuthTransactionsDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  rpc AuthCodesCreate(AuthCodeWrite) returns (Result);
  rpc AuthCodesConsume(ConsumeRequest) returns (AuthCodeResult);
  rpc AuthCodesGet(ScopedKey) returns (AuthCodeResult);
  rpc AuthCodesDeleteExpired(DeleteExpiredRequest) returns (CountResult);
  rpc PushedAuthRequestsCreate(PushedAuthRequestWrite) returns (Result);
  rpc PushedAuthRequestsConsume(ConsumeRequest) returns (PushedAuthRequestResult);
  rpc PushedAuthRequestsGet(ScopedKey) returns (PushedAuthRequestResult);
  rpc PushedAuthRequestsDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  rpc DeviceCodesCreate(DeviceCodeWrite) returns (Result);
  rpc DeviceCodesGet(ScopedKey) returns (DeviceCodeResult);
  rpc DeviceCodesGetByUserCode(ScopedKey) returns (DeviceCodeResult);
  rpc DeviceCodesDecide(DeviceDecisionRequest) returns (DeviceCodeResult);
  rpc DeviceCodesPoll(DevicePollRequest) returns (DevicePollResult);
  rpc DeviceCodesDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  rpc RefreshTokensCreate(RefreshTokenWrite) returns (Result);
  rpc RefreshTokensGetByTokenHash(ScopedKey) returns (RefreshTokenResult);
  rpc RefreshTokensRotate(RefreshTokensRotateRequest) returns (Result);
  rpc RefreshTokensTouch(TouchRequest) returns (Result);
  rpc RefreshTokensRevokeFamily(RevokeRequest) returns (Result);
  rpc RefreshTokensRevokeByUser(RevokeRequest) returns (CountResult);
  rpc RefreshTokensDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  rpc PasswordResetTicketsCreate(PasswordResetTicketWrite) returns (Result);
  rpc PasswordResetTicketsGetByTokenHash(ScopedKey) returns (PasswordResetTicketResult);
  rpc PasswordResetTicketsConsume(ConsumeRequest) returns (PasswordResetTicketResult);
  rpc PasswordResetTicketsDeleteByUser(ScopedKey) returns (CountResult);
  rpc PasswordResetTicketsDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  // Console operators (Plan 13), keyed by (tenant_id, user_id). Hosts
  // report Unimplemented as "plugin too old".
  rpc OperatorsGet(ScopedKey) returns (OperatorResult);   // key = user_id
  rpc OperatorsUpsert(OperatorWrite) returns (Result);
  rpc OperatorsList(TenantScope) returns (OperatorList);
  rpc OperatorsDelete(ScopedKey) returns (Result);        // key = user_id
}

// ---- errors and generic results ----

message Error {
  enum Kind {
    KIND_UNSPECIFIED = 0; // any other error; see message
    KIND_NOT_FOUND = 1;   // store.ErrNotFound
    KIND_CONFLICT = 2;    // store.ErrConflict
    KIND_ALREADY_USED = 3; // store.ErrAlreadyUsed
  }
  Kind kind = 1;
  string message = 2; // human-readable; for KIND_UNSPECIFIED the whole error
}

message Result { Error error = 1; }            // absent error = success
message CountResult { Error error = 1; int64 count = 2; }

// ---- transactions ----

message PingRequest {}
message BeginTxRequest { string parent_tx_id = 1; } // empty = top level
message BeginTxResponse { Error error = 1; string tx_id = 2; }
message EndTxRequest { string tx_id = 1; }

// ---- shared request shapes ----

message TenantScope { string tx_id = 1; string tenant_id = 2; }
// ScopedKey addresses one entity in a tenant by its key (ID, client ID,
// identifier, name or token hash, depending on the RPC).
message ScopedKey { string tx_id = 1; string tenant_id = 2; string key = 3; }
message TouchRequest {
  string tx_id = 1; string tenant_id = 2; string id = 3;
  google.protobuf.Timestamp idle_expires_at = 4;
}
message DeleteExpiredRequest { string tx_id = 1; google.protobuf.Timestamp before = 2; }
message ConsumeRequest {
  string tx_id = 1; string tenant_id = 2; string hash = 3;
  google.protobuf.Timestamp at = 4;
}
message RevokeRequest {
  string tx_id = 1; string tenant_id = 2; string key = 3; // family ID or user ID
  google.protobuf.Timestamp at = 4;
}

// ---- presence-preserving wrappers: an absent wrapper is a nil slice/map ----

message StringList { repeated string values = 1; }
message StringMap { map<string, string> values = 1; }

// ---- entities ----

message Tenant {
  string id = 1;
  string name = 2;
  string friendly_name = 3;
  StringList domains = 4;
  string default_audience = 5;
  StringList allowed_logout_urls = 6;
  StringList enabled_locales = 7;
  optional bytes custom_text_json = 8; // absent = nil CustomText
  int64 session_lifetime = 9;
  int64 idle_session_lifetime = 10;
  Branding branding = 11;
  string default_directory = 12;
  google.protobuf.Timestamp created_at = 13;
  bool skip_non_verifiable_callback_uri_confirmation_prompt = 14;
  bool use_scope_descriptions_for_consent = 15;
  bool pushed_authorization_requests_supported = 16; // absent = false
  string device_flow_charset = 17;                   // absent = "" (the host default)
  string device_flow_mask = 18;                      // absent = ""
  bool reserved = 19;                                // absent = false
  bool seeded = 20;                                  // absent = false
  string origin = 21;                                // "api" or empty (seed)
}
message Branding { string logo_url = 1; string primary_color = 2; }

message ClientSecret {
  string hash = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp expires_at = 3; // absent = nil
  // keys.SealClientSecret envelope; empty when hash is set. Requires an
  // up-to-date plugin: one that drops this field fails the codec's check.
  bytes sealed = 4;
}
message ClientSecretList { repeated ClientSecret values = 1; }
message RefreshTokenPolicy {
  bool rotating = 1; int64 leeway = 2; bool expiring = 3;
  int64 token_lifetime = 4; int64 idle_token_lifetime = 5;
}
message Client {
  string tenant_id = 1;
  string client_id = 2;
  string name = 3;
  string app_type = 4;
  ClientSecretList secrets = 5;
  string token_endpoint_auth_method = 6;
  StringList grant_types = 7;
  StringList callbacks = 8;
  StringList allowed_logout_urls = 9;
  StringList web_origins = 10;
  StringList allowed_origins = 11;
  int64 id_token_lifetime = 12;
  RefreshTokenPolicy refresh_token = 13;
  google.protobuf.Timestamp created_at = 14;
  optional bool is_first_party = 15;                                       // absent = true
  string third_party_security_mode = 16;
  string redirection_policy = 17;
  optional bool skip_non_verifiable_callback_uri_confirmation_prompt = 18; // absent = nil
  bool require_pushed_authorization_requests = 19;   // absent = false
  string origin = 20;                                // "api" or empty (seed)
}

message Scope { string value = 1; string description = 2; }
message ScopeList { repeated Scope values = 1; }
message ResourceServer {
  string tenant_id = 1; string id = 2; string identifier = 3; string name = 4;
  ScopeList scopes = 5; string signing_alg = 6; int64 token_lifetime = 7;
  bool allow_offline_access = 8; google.protobuf.Timestamp created_at = 9;
  optional bool skip_consent_for_verifiable_first_party_clients = 10;      // absent = true
  string user_policy = 11;
  string client_policy = 12;
  bool is_system = 13;
  string origin = 14;                                // "api" or empty (seed)
  int64 token_lifetime_for_web = 15;                 // 0 = the default
}

message ClientGrant {
  string tenant_id = 1; string id = 2; string client_id = 3; string audience = 4;
  StringList scopes = 5; google.protobuf.Timestamp created_at = 6;
  string subject_type = 7; // empty = "client" (plugins older than Plan 9)
  string origin = 8;       // "api" or empty (seed)
  bool allow_all_scopes = 9; // every scope the API defines; absent = false
}

message UserGrant {
  string tenant_id = 1; string id = 2; string client_id = 3; string user_id = 4; string audience = 5;
  StringList scopes = 6; google.protobuf.Timestamp created_at = 7; google.protobuf.Timestamp updated_at = 8;
}

message SigningKey {
  string tenant_id = 1; string kid = 2; string alg = 3; string status = 4;
  optional bytes private_key = 5; // absent = nil
  optional bytes public_jwk = 6;  // absent = nil
  google.protobuf.Timestamp created_at = 7;
}

// PasswordPolicy is the password policy of plugins older than Plan 15: a
// minimum length and a number of required character classes. Connection
// still carries it, derived from password_options, so that such a plugin
// keeps the minimum length; password_options wins when both are present.
message PasswordPolicy { int64 min_length = 1; int64 require_character_classes = 2; }

message PasswordComplexity {
  int64 min_length = 1;
  optional StringList character_types = 2;  // absent = nil
  string character_type_rule = 3;
  string identical_characters = 4;
  string sequential_characters = 5;
  string max_length_exceeded = 6;
  int64 min_character_classes = 7;
}
message PasswordHistorySettings { bool active = 1; int64 size = 2; }
message PasswordDictionary { bool active = 1; string default = 2; optional StringList custom = 3; }
message PasswordProfileData { bool active = 1; optional StringList blocked_fields = 2; }
message PasswordOptions {
  PasswordComplexity complexity = 1;
  PasswordHistorySettings history = 2;
  PasswordDictionary dictionary = 3;
  PasswordProfileData profile_data = 4;
}

message Connection {
  string tenant_id = 1; string id = 2; string name = 3; string strategy = 4;
  StringList enabled_clients = 5; bool disable_signup = 6; bool requires_username = 7;
  PasswordPolicy password_policy = 8; google.protobuf.Timestamp created_at = 9;
  bool enabled_database_customization = 10; bool import_mode = 11;
  StringMap custom_scripts = 12;            // absent = nil map
  optional bytes configuration_sealed = 13; // absent = nil
  string set_user_root_attributes = 14;
  bool is_domain_connection = 15;
  PasswordOptions password_options = 16;
  bool brute_force_protection = 17;
  int64 username_min = 18;
  int64 username_max = 19;
  string origin = 20;                 // "api" or empty (seed)
  optional bytes extra_json = 21;     // absent = nil map; any JSON object
}

message Identity { string connection = 1; string provider = 2; string user_id = 3; string password_hash = 4; }
message IdentityList { repeated Identity values = 1; }
message User {
  string tenant_id = 1; string user_id = 2; string email = 3; bool email_verified = 4;
  string username = 5; string name = 6; string nickname = 7; string picture = 8;
  string given_name = 9; string family_name = 10;
  optional bytes user_metadata_json = 11; // absent = nil map
  bool blocked = 12; IdentityList identities = 13;
  google.protobuf.Timestamp last_login = 14; // absent = nil
  int64 logins_count = 15;
  google.protobuf.Timestamp created_at = 16; google.protobuf.Timestamp updated_at = 17;
  optional bytes app_metadata_json = 18; // absent = nil map
  string phone_number = 19; bool phone_verified = 20; string last_ip = 21;
  int64 version = 22;
}

message LoginSession {
  string tenant_id = 1; string id = 2; string token_hash = 3; string user_id = 4;
  string connection = 5; google.protobuf.Timestamp authenticated_at = 6;
  StringList client_ids = 7; google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp idle_expires_at = 9; google.protobuf.Timestamp created_at = 10;
}

message AuthTransaction {
  string tenant_id = 1; string id = 2; string cookie_hash = 3; string csrf_token = 4;
  string client_id = 5; StringMap params = 6;
  google.protobuf.Timestamp expires_at = 7; google.protobuf.Timestamp created_at = 8;
}

message AuthCode {
  string tenant_id = 1; string code_hash = 2; string client_id = 3; string redirect_uri = 4;
  string user_id = 5; string session_id = 6; StringList scopes = 7; string audience = 8;
  string nonce = 9; string code_challenge = 10; string code_challenge_method = 11;
  google.protobuf.Timestamp auth_time = 12; google.protobuf.Timestamp expires_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp used_at = 15;     // absent = nil
  google.protobuf.Timestamp replayed_at = 16; // absent = nil
}
message PushedAuthRequest {
  string tenant_id = 1; string id_hash = 2; string client_id = 3; StringMap params = 4;
  google.protobuf.Timestamp expires_at = 5; google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp used_at = 7; // absent = nil
}

message DeviceCode {
  string tenant_id = 1; string device_code_hash = 2; string user_code_hash = 3; string client_id = 4;
  StringList scopes = 5; string audience = 6; string status = 7; string user_id = 8;
  StringList granted_scopes = 9;
  optional google.protobuf.Timestamp last_polled_at = 10;      // absent = nil
  optional google.protobuf.Timestamp expired_reported_at = 11; // absent = nil
  google.protobuf.Timestamp expires_at = 12; google.protobuf.Timestamp created_at = 13;
}

message RefreshToken {
  string tenant_id = 1; string id = 2; string token_hash = 3; string family_id = 4;
  string client_id = 5; string user_id = 6; string session_id = 7; StringList scopes = 8;
  string audience = 9; google.protobuf.Timestamp auth_time = 10; bool rotating = 11;
  google.protobuf.Timestamp expires_at = 12; google.protobuf.Timestamp idle_expires_at = 13;
  google.protobuf.Timestamp rotated_at = 14; // absent = nil
  google.protobuf.Timestamp revoked_at = 15; // absent = nil
  google.protobuf.Timestamp created_at = 16;
}

message PasswordResetTicket {
  string tenant_id = 1; string id = 2; string token_hash = 3; string user_id = 4;
  string connection = 5; string client_id = 6; string lang = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp used_at = 9; // absent = nil
  google.protobuf.Timestamp created_at = 10;
}

message Operator {
  string tenant_id = 1; string user_id = 2;
  StringList tenants = 3; // tenant names, or ["*"] for every tenant
  google.protobuf.Timestamp created_at = 4; google.protobuf.Timestamp updated_at = 5;
}

// ---- per-entity requests and results ----

message TenantWrite { string tx_id = 1; Tenant value = 2; }
message TenantsGetRequest { string tx_id = 1; string key = 2; } // id, name or domain
message TenantsListRequest { string tx_id = 1; }
message TenantResult { Error error = 1; Tenant value = 2; }
message TenantList { Error error = 1; repeated Tenant values = 2; }

message ClientWrite { string tx_id = 1; Client value = 2; }
message ClientResult { Error error = 1; Client value = 2; }
message ClientList { Error error = 1; repeated Client values = 2; }

message ResourceServerWrite { string tx_id = 1; ResourceServer value = 2; }
message ResourceServerResult { Error error = 1; ResourceServer value = 2; }
// ResourceServersList returns the tenant's resource servers ordered by
// created_at, then id.
message ResourceServerList { Error error = 1; repeated ResourceServer values = 2; }

message ClientGrantWrite { string tx_id = 1; ClientGrant value = 2; }
message ClientGrantsFindRequest { string tx_id = 1; string tenant_id = 2; string client_id = 3; string audience = 4; string subject_type = 5; }
message ClientGrantResult { Error error = 1; ClientGrant value = 2; }
// ClientGrantsList filters on the non-empty client_id, audience,
// subject_type, id and after_id, orders by id (byte order), skips offset rows and returns at
// most limit (0 = no limit). total counts the matches before paging.
message ClientGrantsListRequest {
  string tx_id = 1; string tenant_id = 2; string client_id = 3; string audience = 4; string subject_type = 5;
  int64 offset = 6; int64 limit = 7;
  string after_id = 8; // keep only ids that sort after it (byte order)
  string id = 9;       // keep only this id
}
message ClientGrantList { Error error = 1; repeated ClientGrant values = 2; int64 total = 3; }

message UserGrantWrite { string tx_id = 1; UserGrant value = 2; }
message UserGrantsFindRequest { string tx_id = 1; string tenant_id = 2; string client_id = 3; string user_id = 4; string audience = 5; }
message UserGrantResult { Error error = 1; UserGrant value = 2; }
message UserGrantList { Error error = 1; repeated UserGrant values = 2; }

message SigningKeyWrite { string tx_id = 1; SigningKey value = 2; }
message SigningKeyList { Error error = 1; repeated SigningKey values = 2; }
message SigningKeysRotateRequest { string tx_id = 1; string tenant_id = 2; SigningKey next = 3; }

message ConnectionWrite { string tx_id = 1; Connection value = 2; }
message ConnectionResult { Error error = 1; Connection value = 2; }
message ConnectionList { Error error = 1; repeated Connection values = 2; }
// ConnectionsListPage filters on a non-empty name (exact) and, when
// strategies is not empty, on any of them; orders by lower-cased name, then
// id; skips offset rows and returns at most limit (0 = no limit). total
// counts the matches before paging.
message ConnectionsListPageRequest {
  string tx_id = 1; string tenant_id = 2; string name = 3; repeated string strategies = 4;
  int64 offset = 5; int64 limit = 6;
}
message ConnectionPage { Error error = 1; repeated Connection values = 2; int64 total = 3; }

message PasswordHistoryAdd { string tx_id = 1; string tenant_id = 2; string user_id = 3; bytes hash = 4; int64 keep = 5; }
message PasswordHistoryList { Error error = 1; repeated bytes values = 2; } // newest first

message UserWrite { string tx_id = 1; User value = 2; }
message UserResult { Error error = 1; User value = 2; }
message UsersFindByLoginRequest { string tx_id = 1; string tenant_id = 2; string connection = 3; string login = 4; }
message UsersRecordLoginRequest { string tx_id = 1; string tenant_id = 2; string user_id = 3; google.protobuf.Timestamp at = 4; string ip = 5; }
message UsersFindByEmailRequest { string tx_id = 1; string tenant_id = 2; string email = 3; }
message UserListResult { Error error = 1; repeated User values = 2; }
message VersionResult { Error error = 1; int64 value = 2; }
message UsersSetPasswordHashRequest {
  string tx_id = 1; string tenant_id = 2; string user_id = 3; string connection = 4;
  string hash = 5; google.protobuf.Timestamp at = 6;
}

message SessionWrite { string tx_id = 1; LoginSession value = 2; }
message SessionResult { Error error = 1; LoginSession value = 2; }
message SessionsAddClientRequest { string tx_id = 1; string tenant_id = 2; string id = 3; string client_id = 4; }

message AuthTransactionWrite { string tx_id = 1; AuthTransaction value = 2; }
message AuthTransactionResult { Error error = 1; AuthTransaction value = 2; }

message AuthCodeWrite { string tx_id = 1; AuthCode value = 2; }
message AuthCodeResult { Error error = 1; AuthCode value = 2; } // Consume may set both
message PushedAuthRequestWrite { string tx_id = 1; PushedAuthRequest value = 2; }
message PushedAuthRequestResult { Error error = 1; PushedAuthRequest value = 2; } // Consume may set both
message DeviceCodeWrite { string tx_id = 1; DeviceCode value = 2; }
message DeviceCodeResult { Error error = 1; DeviceCode value = 2; } // Decide may set both (ALREADY_USED)
message DeviceDecisionRequest {
  string tx_id = 1; string tenant_id = 2; string device_code_hash = 3;
  string status = 4; string user_id = 5; StringList granted_scopes = 6;
}
message DevicePollRequest {
  string tx_id = 1; string tenant_id = 2; string device_code_hash = 3; google.protobuf.Timestamp at = 4;
}
// outcome is a store.DevicePollOutcome: pending, slow_down, approved, denied,
// expired or invalid. A host rejects any other value.
message DevicePollResult { Error error = 1; DeviceCode code = 2; string outcome = 3; }

message RefreshTokenWrite { string tx_id = 1; RefreshToken value = 2; }
message RefreshTokenResult { Error error = 1; RefreshToken value = 2; }
message RefreshTokensRotateRequest {
  string tx_id = 1; string tenant_id = 2; string old_id = 3; RefreshToken next = 4;
  google.protobuf.Timestamp at = 5; google.protobuf.Duration leeway = 6;
}

message PasswordResetTicketWrite { string tx_id = 1; PasswordResetTicket value = 2; }
message PasswordResetTicketResult { Error error = 1; PasswordResetTicket value = 2; }

