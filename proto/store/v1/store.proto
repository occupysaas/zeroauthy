syntax = "proto3";

package zeroauthy.store.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/zeroauthy/zeroauthy/proto/store/v1;storev1";

// Protocol contract for plugin authors (any language).
//
// Transactions
//   BeginTx returns a tx_id; Commit or Rollback ends it. Send the tx_id on
//   every call that belongs to the transaction. A BeginTx with parent_tx_id
//   opens a nested transaction (a savepoint): rolling it back undoes only the
//   inner work. A transaction tree is a stack: a transaction has at most one
//   open nested transaction, and only the innermost one accepts calls and
//   Commit. Rolling back an ancestor rolls back the chain below it first.
//   Misuse is reported in the response's `error` as KIND_UNSPECIFIED with a
//   message: an unknown or already finished tx_id ("unknown or finished
//   transaction"), and a call or Commit on a transaction that has an open
//   nested one ("has an open nested transaction"). Each tree has one 60
//   second idle timer, restarted by any call in the tree; when it fires the
//   root and everything nested in it are rolled back. A plugin that exits
//   abandons its open transactions; its database rolls them back when the
//   connection drops. The host never retries across the boundary.
//
// Units
//   Every int64 that holds a lifetime, timeout or leeway counts SECONDS
//   (session_lifetime, token_lifetime, leeway, ...). The one exception is
//   RefreshTokensRotateRequest.leeway and ProtectionLimit intervals use
//   google.protobuf.Duration. Instants
//   are google.protobuf.Timestamp with nanosecond precision.
//
// JSON fields
//   custom_text_json is a JSON object: prompt -> language -> screen -> key ->
//   text, every level an object and every leaf a string. user_metadata_json
//   and app_metadata_json are each any JSON object (nested objects, arrays, strings, numbers, booleans,
//   null); numbers are read back as double-precision floats. An absent
//   optional field means "nil", which is distinct from an empty object.
//
// Absent fields (plugins older than the consent fields)
//   Client.is_first_party absent = true; Client.skip_non_verifiable_callback_
//   uri_confirmation_prompt absent = nil (inherit the tenant);
//   ResourceServer.skip_consent_for_verifiable_first_party_clients absent =
//   true; ClientGrant.subject_type empty = "client". A host sends
//   ClientGrantsFindRequest.subject_type; a plugin that ignores it may return
//   a grant of the other type, which the host treats as not found.
//
// Evolution
//   Within v1, fields are only added, never renumbered or reused. A plugin
//   that predates a field drops it silently. New RPCs may be added; a plugin
//   that lacks one answers with gRPC status Unimplemented, which the host
//   reports as an error.
//
// StoreService mirrors zeroauthy's store.Store. Every request carries tx_id:
// empty means "no transaction"; otherwise the call runs inside the
// transaction BeginTx returned. Domain errors are reported in the response's
// `error` field; gRPC status codes mean transport or plugin failure.
service StoreService {
  rpc RBACCapabilities(PingRequest) returns (RBACCapabilitiesResult);
  rpc RBACCreateRole(RBACRequest) returns (RBACResponse);
  rpc RBACGetRole(RBACRequest) returns (RBACResponse);
  rpc RBACUpdateRole(RBACRequest) returns (RBACResponse);
  rpc RBACDeleteRole(RBACRequest) returns (RBACResponse);
  rpc RBACListRoles(RBACRequest) returns (RBACResponse);
  rpc RBACRolePermissions(RBACRequest) returns (RBACResponse);
  rpc RBACChangeRolePermissions(RBACRequest) returns (RBACResponse);
  rpc RBACRoleUsers(RBACRequest) returns (RBACResponse);
  rpc RBACAssignRoleUsers(RBACRequest) returns (RBACResponse);
  rpc RBACUserRoles(RBACRequest) returns (RBACResponse);
  rpc RBACChangeUserRoles(RBACRequest) returns (RBACResponse);
  rpc RBACUserPermissions(RBACRequest) returns (RBACResponse);
  rpc RBACChangeUserPermissions(RBACRequest) returns (RBACResponse);
  rpc RBACSnapshot(RBACRequest) returns (RBACResponse);

  // Plan 30 capability is independently negotiated; Plan 29 remains version 1.
  rpc OrganizationsIICapabilities(PingRequest) returns (OrganizationsCapabilitiesResult);
  rpc OrganizationsIICreateInvitation(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIGetInvitation(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIFindInvitation(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIListInvitations(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIDeleteInvitation(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIConsumeInvitation(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIGetInvitationReceipt(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIPutClients(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIGetClient(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIListClients(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIDeleteClients(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIPutClientGrant(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIDeleteClientGrant(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIListClientGrants(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIGrantOrganizations(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIHasClientGrant(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIPutDiscoveryDomain(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIGetDiscoveryDomain(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIGetDiscoveryDomainByName(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIListDiscoveryDomains(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIDeleteDiscoveryDomain(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  rpc OrganizationsIIDiscoverOrganizations(OrganizationsIIRequest) returns (OrganizationsIIResponse);
  // Plan 29 Organizations repository. Missing capability disables this feature.
  rpc OrganizationsCapabilities(PingRequest) returns (OrganizationsCapabilitiesResult);
  rpc OrganizationsCreate(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsGet(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsGetByName(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsList(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsUpdate(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsDelete(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsConnections(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsGetConnection(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsPutConnection(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsDeleteConnection(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsConnectionsByConnection(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsMembers(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsAddMembers(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsRemoveMembers(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsIsMember(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsUserOrganizations(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsMemberRoles(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsChangeMemberRoles(OrganizationsRequest) returns (OrganizationsResponse);
  rpc OrganizationsRoleMembers(OrganizationsRequest) returns (OrganizationsResponse);

  // Plan 27 Actions repository. A plugin lacking ActionsCapabilities fails
  // closed; artifacts stream in chunks because they may exceed gRPC's
  // default message size.
  rpc ActionsCapabilities(PingRequest) returns (ActionsCapabilitiesResult);
  rpc ActionsCreateAction(ActionsRequest) returns (ActionsResponse);
  rpc ActionsGetAction(ActionsRequest) returns (ActionsResponse);
  rpc ActionsGetActionByName(ActionsRequest) returns (ActionsResponse);
  rpc ActionsUpdateAction(ActionsRequest) returns (ActionsResponse);
  rpc ActionsDeleteAction(ActionsRequest) returns (ActionsResponse);
  rpc ActionsListActions(ActionsRequest) returns (ActionsResponse);
  rpc ActionsDeploy(ActionsRequest) returns (ActionsResponse);
  rpc ActionsGetVersion(ActionsRequest) returns (ActionsResponse);
  rpc ActionsListVersions(ActionsRequest) returns (ActionsResponse);
  rpc ActionsPutBuild(ActionsRequest) returns (ActionsResponse);
  rpc ActionsGetBuild(ActionsRequest) returns (ActionsResponse);
  // The first message carries the header (tx_id, tenant_id, build_id,
  // total_size, sha256); every message may carry data.
  rpc ActionsPutArtifact(stream ActionsArtifactChunk) returns (Result);
  // The first message carries total_size and sha256 for integrity checks.
  rpc ActionsGetArtifact(ActionsRequest) returns (stream ActionsArtifactChunk);
  rpc ActionsBindings(ActionsRequest) returns (ActionsResponse);
  rpc ActionsBindingsInitialized(ActionsRequest) returns (ActionsResponse);
  rpc ActionsInitializeBindings(ActionsRequest) returns (ActionsResponse);
  rpc ActionsReplaceBindings(ActionsRequest) returns (ActionsResponse);
  rpc ActionsCreateExecution(ActionsRequest) returns (ActionsResponse);
  rpc ActionsGetExecution(ActionsRequest) returns (ActionsResponse);
  rpc ActionsPurgeExecutions(ActionsRequest) returns (ActionsResponse);
  rpc ActionsCreateContinue(ActionsRequest) returns (ActionsResponse);
  rpc ActionsConsumeContinue(ActionsRequest) returns (ActionsResponse);
  rpc ActionsPurgeContinue(ActionsRequest) returns (ActionsResponse);

  // Capability 3: Actions II modules, immutable pins and durable jobs.
  rpc ActionsCreateModule(ActionsRequest) returns (ActionsResponse);
  rpc ActionsGetModule(ActionsRequest) returns (ActionsResponse);
  rpc ActionsGetModuleByName(ActionsRequest) returns (ActionsResponse);
  rpc ActionsUpdateModule(ActionsRequest) returns (ActionsResponse);
  rpc ActionsDeleteModule(ActionsRequest) returns (ActionsResponse);
  rpc ActionsListModules(ActionsRequest) returns (ActionsResponse);
  rpc ActionsPublishModule(ActionsRequest) returns (ActionsResponse);
  rpc ActionsRollbackModule(ActionsRequest) returns (ActionsResponse);
  rpc ActionsListModuleVersions(ActionsRequest) returns (ActionsResponse);
  rpc ActionsGetModuleVersion(ActionsRequest) returns (ActionsResponse);
  rpc ActionsModuleUsers(ActionsRequest) returns (ActionsResponse);
  rpc ActionsEnqueueJob(ActionsRequest) returns (ActionsResponse);
  rpc ActionsClaimJobs(ActionsRequest) returns (ActionsResponse);
  rpc ActionsFinishJob(ActionsRequest) returns (ActionsResponse);
  rpc ActionsPurgeJobs(ActionsRequest) returns (ActionsResponse);

  rpc Ping(PingRequest) returns (Result);
  // Plan 23 capability: lossless canonical/origin fields and registry/TLS RPCs.
  rpc MicrosoftFederationSupported(MicrosoftFederationCapabilitiesRequest) returns (Result);
  rpc CustomDomainsSupported(CustomDomainCapabilitiesRequest) returns (Result);
  rpc CustomDomainsGet(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsList(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsListDue(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsCreate(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsUpdate(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsDelete(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsGetHost(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsPutHost(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsDeleteHost(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsGetDefault(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsSetDefault(CustomDomainRequest) returns (CustomDomainResult);
  rpc CustomDomainsAdmitAttempt(CustomDomainRequest) returns (CustomDomainResult);
  rpc TLSAssetsGet(TLSAssetRequest) returns (TLSAssetResult);
  rpc TLSAssetsPut(TLSAssetRequest) returns (TLSAssetResult);
  rpc TLSAssetsDelete(TLSAssetRequest) returns (TLSAssetResult);
  rpc TLSAssetsListExpired(TLSAssetRequest) returns (TLSAssetResult);
  rpc TLSAssetsClaimLease(TLSAssetRequest) returns (TLSAssetResult);
  rpc TLSAssetsRenewLease(TLSAssetRequest) returns (TLSAssetResult);
  rpc TLSAssetsCheckLease(TLSAssetRequest) returns (TLSAssetResult);
  rpc TLSAssetsReleaseLease(TLSAssetRequest) returns (TLSAssetResult);
  // Required before writing Plan 19 tenant settings: old plugins must fail closed.
  rpc ProtectionReserve(ProtectionRequest) returns (ProtectionResult);
  rpc ProtectionComplete(ProtectionRequest) returns (ProtectionResult);
  rpc ProtectionBlocks(ProtectionRequest) returns (ProtectionResult);
  rpc ProtectionClear(ProtectionRequest) returns (ProtectionResult);
  rpc ProtectionUseProof(ProtectionRequest) returns (ProtectionResult);
  rpc ProtectionRecordRisk(ProtectionRequest) returns (ProtectionResult);
  rpc ProtectionRiskCount(ProtectionRequest) returns (ProtectionResult);
  rpc ProtectionSweep(ProtectionRequest) returns (ProtectionResult);
  rpc TenantSettingsSupported(PingRequest) returns (Result);
  rpc BeginTx(BeginTxRequest) returns (BeginTxResponse);
  rpc Commit(EndTxRequest) returns (Result);
  rpc Rollback(EndTxRequest) returns (Result);

  rpc TenantsCreate(TenantWrite) returns (Result);
  rpc TenantsGet(TenantsGetRequest) returns (TenantResult);
  rpc TenantsGetByName(TenantsGetRequest) returns (TenantResult);
  rpc TenantsGetByDomain(TenantsGetRequest) returns (TenantResult);
  rpc TenantsUpdate(TenantWrite) returns (Result);
  rpc TenantsList(TenantsListRequest) returns (TenantList);
  // TenantsDelete removes the tenant and all of its data (key = id).
  // Hosts report Unimplemented as "plugin too old".
  rpc TenantsDelete(TenantsGetRequest) returns (Result);

  rpc ClientsCreate(ClientWrite) returns (Result);
  rpc ClientsGet(ScopedKey) returns (ClientResult);
  rpc ClientsUpdate(ClientWrite) returns (Result);
  rpc ClientsDelete(ScopedKey) returns (Result);
  rpc ClientsList(TenantScope) returns (ClientList);
  rpc ClientsListPage(ClientsListPageRequest) returns (ClientPage);

  rpc ResourceServersCreate(ResourceServerWrite) returns (Result);
  rpc ResourceServersGet(ScopedKey) returns (ResourceServerResult);
  rpc ResourceServersGetByIdentifier(ScopedKey) returns (ResourceServerResult);
  rpc ResourceServersUpdate(ResourceServerWrite) returns (Result);
  rpc ResourceServersDelete(ScopedKey) returns (Result);
  rpc ResourceServersList(TenantScope) returns (ResourceServerList);
  rpc ResourceServersRenameSystem(ResourceServerRenameSystemRequest) returns (Result);

  rpc ClientGrantsCreate(ClientGrantWrite) returns (Result);
  rpc ClientGrantsFind(ClientGrantsFindRequest) returns (ClientGrantResult);
  rpc ClientGrantsUpdate(ClientGrantWrite) returns (Result);
  rpc ClientGrantsDelete(ScopedKey) returns (Result);
  rpc ClientGrantsList(ClientGrantsListRequest) returns (ClientGrantList);

  rpc UserGrantsFind(UserGrantsFindRequest) returns (UserGrantResult);
  rpc UserGrantsUpsert(UserGrantWrite) returns (UserGrantResult);
  rpc UserGrantsList(UserGrantsListRequest) returns (UserGrantList);
  rpc UserGrantsListByUser(ScopedKey) returns (UserGrantList);   // key = user_id
  rpc UserGrantsListByAudience(ScopedKey) returns (UserGrantList); // key = audience
  rpc UserGrantsDelete(ScopedKey) returns (Result);
  rpc UserGrantsDeleteByUser(ScopedKey) returns (CountResult);   // key = user_id

  rpc SigningKeysCreate(SigningKeyWrite) returns (Result);
  rpc SigningKeysList(TenantScope) returns (SigningKeyList);
  rpc SigningKeysRotate(SigningKeysRotateRequest) returns (Result);
  rpc SigningKeysGet(ScopedKey) returns (SigningKeyResult);
  rpc SigningKeysRotateWithResult(SigningKeysRotateRequest) returns (SigningKeyRotationResult);
  rpc SigningKeysRevoke(SigningKeyRevokeRequest) returns (SigningKeyResult);
  rpc SigningKeysSetCertificate(SigningKeyCertificateRequest) returns (SigningKeyResult);
  rpc CustomSigningKeysGet(TenantScope) returns (CustomSigningKeySetResult);
  rpc CustomSigningKeysReplace(CustomSigningKeySetWrite) returns (Result);
  rpc CustomSigningKeysDelete(TenantScope) returns (Result);

  rpc HostedLoginsGet(TenantScope) returns (HostedLoginConfigResult);
  rpc HostedLoginsPut(HostedLoginConfigWrite) returns (Result);
  // Plan 24 federation. An older server answers Unimplemented and social
  // login stays unavailable; nothing falls back to non-atomic behavior.
  rpc FederationIdentityEpoch(TenantScope) returns (VersionResult);
  rpc FederationBumpIdentityEpoch(TenantScope) returns (Result);
  rpc FederationCreateAttempt(FederationAttemptWrite) returns (Result);
  rpc FederationGetAttempt(FederationAttemptKey) returns (FederationAttemptResult);
  rpc FederationClaimAttempt(FederationClaimRequest) returns (FederationAttemptResult);
  rpc FederationFinishAttempt(FederationAttemptKey) returns (Result);
  rpc FederationPutIdentity(FederatedIdentityWrite) returns (Result);
  rpc FederationDeleteIdentity(FederatedIdentityWrite) returns (Result);
  rpc FederationGetTokens(FederatedIdentityRequest) returns (FederatedTokensResult);
  rpc FederationPutTokens(FederatedTokensWrite) returns (Result);
  rpc FederationDeleteTokens(FederatedIdentityRequest) returns (Result);
  rpc FederationDeleteExpired(DeleteExpiredRequest) returns (CountResult);
  rpc UsersFindByIdentity(UsersFindByIdentityRequest) returns (UserResult);

  rpc EmailProvidersGet(TenantScope) returns (EmailProviderResult);
  rpc EmailProvidersPut(EmailProviderWrite) returns (Result);
  rpc EmailProvidersDelete(EmailProviderDeleteRequest) returns (Result);
  rpc EmailTemplatesGet(EmailTemplateKey) returns (EmailTemplateResult);
  rpc EmailTemplatesPut(EmailTemplateWrite) returns (Result);
  rpc EmailNotificationsClaim(EmailNotificationClaimRequest) returns (EmailNotificationClaimResult);
  rpc EmailNotificationsSweep(EmailNotificationSweepRequest) returns (CountResult);

  rpc ConnectionsCreate(ConnectionWrite) returns (Result);
  rpc ConnectionsGet(ScopedKey) returns (ConnectionResult);
  rpc ConnectionsGetByName(ScopedKey) returns (ConnectionResult);
  rpc ConnectionsUpdate(ConnectionWrite) returns (Result);
  rpc ConnectionsList(TenantScope) returns (ConnectionList); // before Plan 15: every connection, by name
  rpc ConnectionsListPage(ConnectionsListPageRequest) returns (ConnectionPage);
  rpc ConnectionsDelete(ScopedKey) returns (Result);

  rpc PasswordHistoriesAdd(PasswordHistoryAdd) returns (Result);
  rpc PasswordHistoriesList(ScopedKey) returns (PasswordHistoryList); // key = user ID

  rpc UsersCreate(UserWrite) returns (Result);
  rpc UsersGet(ScopedKey) returns (UserResult);
  rpc UsersFindByLogin(UsersFindByLoginRequest) returns (UserResult);
  rpc UsersUpdate(UserWrite) returns (Result);
  rpc UsersRecordLogin(UsersRecordLoginRequest) returns (Result);
  rpc UsersSetPasswordHash(UsersSetPasswordHashRequest) returns (Result);
  rpc UsersFindByEmail(UsersFindByEmailRequest) returns (UserListResult);
  rpc UsersSetPasswordHashIfEmpty(UsersSetPasswordHashRequest) returns (Result);
  // Plan 18. Hosts report Unimplemented as "plugin too old".
  rpc UsersUpgradeImportedHash(UsersUpgradeImportedHashRequest) returns (Result);
  rpc UsersBumpVersion(ScopedKey) returns (VersionResult);
  rpc UsersGetForUpdate(ScopedKey) returns (UserResult); // Plan 17
  rpc UsersDelete(ScopedKey) returns (Result);
  rpc UsersList(UsersListRequest) returns (UserListResult);

  rpc SessionsCreate(SessionWrite) returns (Result);
  rpc SessionsGetByTokenHash(ScopedKey) returns (SessionResult);
  rpc SessionsGet(ScopedKey) returns (SessionResult);                // key = id
  rpc SessionsListByUser(ScopedKey) returns (SessionList);           // key = user_id
  rpc SessionsTouch(TouchRequest) returns (Result);
  rpc SessionsAddClient(SessionsAddClientRequest) returns (Result);
  rpc SessionsDelete(ScopedKey) returns (Result);
  rpc SessionsDeleteByUser(ScopedKey) returns (CountResult);
  rpc SessionsDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  rpc AuthTransactionsCreate(AuthTransactionWrite) returns (Result);
  rpc AuthTransactionsGet(ScopedKey) returns (AuthTransactionResult);
  rpc AuthTransactionsDelete(ScopedKey) returns (Result);
  rpc AuthTransactionsDeleteExpired(DeleteExpiredRequest) returns (CountResult);
  rpc AuthTransactionsCompareAndSwapHosted(HostedStateCASRequest) returns (Result);

  rpc AuthCodesCreate(AuthCodeWrite) returns (Result);
  rpc AuthCodesConsume(ConsumeRequest) returns (AuthCodeResult);
  rpc AuthCodesGet(ScopedKey) returns (AuthCodeResult);
  rpc AuthCodesDeleteExpired(DeleteExpiredRequest) returns (CountResult);
  rpc PushedAuthRequestsCreate(PushedAuthRequestWrite) returns (Result);
  rpc PushedAuthRequestsConsume(ConsumeRequest) returns (PushedAuthRequestResult);
  rpc PushedAuthRequestsGet(ScopedKey) returns (PushedAuthRequestResult);
  rpc PushedAuthRequestsDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  rpc DeviceCodesCreate(DeviceCodeWrite) returns (Result);
  rpc DeviceCodesGet(ScopedKey) returns (DeviceCodeResult);
  rpc DeviceCodesGetByUserCode(ScopedKey) returns (DeviceCodeResult);
  rpc DeviceCodesDecide(DeviceDecisionRequest) returns (DeviceCodeResult);
  rpc DeviceCodesPoll(DevicePollRequest) returns (DevicePollResult);
  rpc DeviceCodesDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  rpc RefreshTokensCreate(RefreshTokenWrite) returns (Result);
  rpc RefreshTokensGetByTokenHash(ScopedKey) returns (RefreshTokenResult);
  rpc RefreshTokensGet(ScopedKey) returns (RefreshTokenResult);      // key = id
  rpc RefreshTokensListByUser(ScopedKey) returns (RefreshTokenList); // key = user_id
  rpc RefreshTokensRevoke(RevokeRequest) returns (Result);           // key = id
  rpc RefreshTokensRotate(RefreshTokensRotateRequest) returns (Result);
  rpc RefreshTokensTouch(TouchRequest) returns (Result);
  rpc RefreshTokensRevokeFamily(RevokeRequest) returns (Result);
  rpc RefreshTokensRevokeByUser(RevokeRequest) returns (CountResult);
  rpc RefreshTokensDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  rpc PasswordResetTicketsMarkChallengePassed(PasswordResetTicketChallengeRequest) returns (Result);
  rpc PasswordResetTicketsCreate(PasswordResetTicketWrite) returns (Result);
  rpc PasswordResetTicketsGetByTokenHash(ScopedKey) returns (PasswordResetTicketResult);
  rpc PasswordResetTicketsConsume(ConsumeRequest) returns (PasswordResetTicketResult);
  rpc PasswordResetTicketsDeleteByUser(ScopedKey) returns (CountResult);
  rpc PasswordResetTicketsDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  rpc EmailVerificationTicketsCreate(EmailVerificationTicketWrite) returns (Result);
  rpc EmailVerificationTicketsGetByTokenHash(ScopedKey) returns (EmailVerificationTicketResult);
  rpc EmailVerificationTicketsConsume(ConsumeRequest) returns (EmailVerificationTicketResult);
  rpc EmailVerificationTicketsDeleteByUser(ScopedKey) returns (CountResult);
  rpc EmailVerificationTicketsDeleteExpired(DeleteExpiredRequest) returns (CountResult);

  // Console operators (Plan 13), keyed by (tenant_id, user_id). Hosts
  // report Unimplemented as "plugin too old".
  rpc OperatorsGet(ScopedKey) returns (OperatorResult);   // key = user_id
  rpc OperatorsUpsert(OperatorWrite) returns (Result);
  rpc OperatorsList(TenantScope) returns (OperatorList);
  rpc OperatorsDelete(ScopedKey) returns (Result);        // key = user_id

  // Management API jobs (Plan 18). Hosts report Unimplemented as "plugin
  // too old", except JobsDeleteExpired, which the sweeper calls on every
  // deployment: a plugin that predates it is treated as holding no jobs.
  // Tenants.Delete removes the tenant's jobs, errors and file chunks.
  rpc JobsCreate(JobWrite) returns (Result);
  rpc JobsGet(ScopedKey) returns (JobResult);                 // key = id
  rpc JobsList(JobsListRequest) returns (JobPage);
  rpc JobsCountActive(JobsCountActiveRequest) returns (CountResult);
  rpc JobsClaim(JobsClaimRequest) returns (JobResult);
  rpc JobsRenew(JobsRenewRequest) returns (Result);
  rpc JobsCheckpoint(JobsCheckpointRequest) returns (Result);
  rpc JobsFinish(JobsFinishRequest) returns (Result);
  rpc JobsErrors(ScopedKey) returns (JobErrorList);           // key = job id
  rpc JobsAppendFile(JobsAppendFileRequest) returns (Result);
  // JobsReadFile streams the export file's chunks in seq order. A failure
  // that is not a transport fault ends the stream with one message whose
  // error is set.
  rpc JobsReadFile(ScopedKey) returns (stream JobFileChunk);  // key = job id
  rpc JobsDeleteExpired(DeleteExpiredRequest) returns (CountResult);
}

// ---- errors and generic results ----

message Error {
  enum Kind {
    KIND_UNSPECIFIED = 0; // any other error; see message
    KIND_NOT_FOUND = 1;   // store.ErrNotFound
    KIND_CONFLICT = 2;    // store.ErrConflict
    KIND_ALREADY_USED = 3; // store.ErrAlreadyUsed
    KIND_INVALID = 4; // store.ErrInvalid
    KIND_CUSTOM_DOMAIN_UNAVAILABLE = 5; // store.ErrCustomDomainRepositoryUnavailable
    KIND_TLS_ASSET_UNAVAILABLE = 6; // store.ErrTLSAssetRepositoryUnavailable
    KIND_RBAC_UNAVAILABLE = 8; // store.ErrRBACUnavailable
    KIND_ACTIONS_UNAVAILABLE = 9; // store.ErrActionsUnavailable
    KIND_BUILD_NOT_READY = 10; // store.ErrBuildNotReady
    KIND_PRECONDITION = 11; // store.ErrPrecondition
    KIND_FEDERATION_UNAVAILABLE = 7; // store.ErrFederationUnavailable
    KIND_ORGANIZATIONS_II_UNAVAILABLE = 13; // store.ErrOrganizationsIIUnavailable
    KIND_ORGANIZATIONS_UNAVAILABLE = 12; // store.ErrOrganizationsUnavailable
  }
  Kind kind = 1;
  string message = 2; // human-readable; for KIND_UNSPECIFIED the whole error
}

message Result { Error error = 1; }            // absent error = success
message CountResult { Error error = 1; int64 count = 2; }

// ---- transactions ----

message PingRequest {}
message BeginTxRequest { string parent_tx_id = 1; } // empty = top level
message BeginTxResponse { Error error = 1; string tx_id = 2; }
message EndTxRequest { string tx_id = 1; }

// ---- shared request shapes ----

message TenantScope { string tx_id = 1; string tenant_id = 2; }
// ScopedKey addresses one entity in a tenant by its key (ID, client ID,
// identifier, name or token hash, depending on the RPC).
message ScopedKey { string tx_id = 1; string tenant_id = 2; string key = 3; }
message TouchRequest {
  string tx_id = 1; string tenant_id = 2; string id = 3;
  google.protobuf.Timestamp idle_expires_at = 4;
  // SessionsTouch only (a plugin that predates them drops them silently):
  google.protobuf.Timestamp at = 5; string ip = 6; string user_agent = 7;
}
message DeleteExpiredRequest { string tx_id = 1; google.protobuf.Timestamp before = 2; }
message ConsumeRequest {
  string tx_id = 1; string tenant_id = 2; string hash = 3;
  google.protobuf.Timestamp at = 4;
}
message RevokeRequest {
  string tx_id = 1; string tenant_id = 2; string key = 3; // family ID, user ID, or (RefreshTokensRevoke) token ID
  google.protobuf.Timestamp at = 4;
}

// ---- presence-preserving wrappers: an absent wrapper is a nil slice/map ----

message StringList { repeated string values = 1; }
message StringMap { map<string, string> values = 1; }

// ---- entities ----

message Tenant {
  string id = 1;
  string name = 2;
  string friendly_name = 3;
  StringList domains = 4;
  string default_audience = 5;
  StringList allowed_logout_urls = 6;
  StringList enabled_locales = 7;
  optional bytes custom_text_json = 8; // absent = nil CustomText
  int64 session_lifetime = 9;
  int64 idle_session_lifetime = 10;
  Branding branding = 11;
  string default_directory = 12;
  google.protobuf.Timestamp created_at = 13;
  bool skip_non_verifiable_callback_uri_confirmation_prompt = 14;
  bool use_scope_descriptions_for_consent = 15;
  bool pushed_authorization_requests_supported = 16; // absent = false
  string device_flow_charset = 17;                   // absent = "" (the host default)
  string device_flow_mask = 18;                      // absent = ""
  bool reserved = 19;                                // absent = false
  bool seeded = 20;                                  // absent = false
  string origin = 21;                                // "api" or empty (seed)
  string support_email = 22;
  string support_url = 23;
  string picture_url = 24;
  optional bytes settings_extra_json = 25; // absent = nil; stored-only settings
  optional bytes settings_presence_json = 26; // absent = nil; explicit zero values
  optional bytes protection_settings_json = 27; // typed internal policy, including private credentials
  bool protection_settings_initialized = 28;
  int64 ephemeral_session_lifetime = 29; // internal seconds
  int64 idle_ephemeral_session_lifetime = 30; // internal seconds
  string session_cookie_mode = 31;
  string canonical_host = 32;
  int64 identity_epoch = 33; // Plan 24; absent = 0, maintained only by Federation
}
message Branding { string logo_url = 1; string primary_color = 2; }

message ClientSecret {
  string hash = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp expires_at = 3; // absent = nil
  // keys.SealClientSecret envelope; empty when hash is set. Requires an
  // up-to-date plugin: one that drops this field fails the codec's check.
  bytes sealed = 4;
}
message ClientSecretList { repeated ClientSecret values = 1; }
message RefreshTokenPolicy {
  bool rotating = 1; int64 leeway = 2; bool expiring = 3;
  int64 token_lifetime = 4; int64 idle_token_lifetime = 5;
}
message Client {
  string tenant_id = 1;
  string client_id = 2;
  string name = 3;
  string app_type = 4;
  ClientSecretList secrets = 5;
  string token_endpoint_auth_method = 6;
  StringList grant_types = 7;
  StringList callbacks = 8;
  StringList allowed_logout_urls = 9;
  StringList web_origins = 10;
  StringList allowed_origins = 11;
  int64 id_token_lifetime = 12;
  RefreshTokenPolicy refresh_token = 13;
  google.protobuf.Timestamp created_at = 14;
  optional bool is_first_party = 15;                                       // absent = true
  string third_party_security_mode = 16;
  string redirection_policy = 17;
  optional bool skip_non_verifiable_callback_uri_confirmation_prompt = 18; // absent = nil
  bool require_pushed_authorization_requests = 19;   // absent = false
  string origin = 20;                                // "api" or empty (seed)
  // Organization settings (Plan 29, D-0055); empty/absent = unset. A plugin
  // without OrganizationsCapabilities drops them, so the Management API
  // refuses non-deny usage with 501 for such a plugin.
  string organization_usage = 21;
  string organization_require_behavior = 22;
  string initiate_login_uri = 24;
  StringList organization_discovery_methods = 23;   // absent = unset
}

message Scope { string value = 1; string description = 2; }
message ScopeList { repeated Scope values = 1; }
message ResourceServer {
  string tenant_id = 1; string id = 2; string identifier = 3; string name = 4;
  ScopeList scopes = 5; string signing_alg = 6; int64 token_lifetime = 7;
  bool allow_offline_access = 8; google.protobuf.Timestamp created_at = 9;
  optional bool skip_consent_for_verifiable_first_party_clients = 10;      // absent = true
  string user_policy = 11;
  string client_policy = 12;
  bool is_system = 13;
  string origin = 14;                                // "api" or empty (seed)
  bool enforce_policies = 16;
  string token_dialect = 17;
  int64 token_lifetime_for_web = 15;                 // 0 = the default
}
message ResourceServerRenameSystemRequest {
  string tx_id = 1; string tenant_id = 2; string identifier = 3; string name = 4;
}

message ClientGrant {
  string tenant_id = 1; string id = 2; string client_id = 3; string audience = 4;
  StringList scopes = 5; google.protobuf.Timestamp created_at = 6;
  string subject_type = 7; // empty = "client" (plugins older than Plan 9)
  string origin = 8;       // "api" or empty (seed)
  bool allow_all_scopes = 9; // every scope the API defines; absent = false
  string organization_usage = 10; bool allow_any_organization = 11;
}

message UserGrant {
  string tenant_id = 1; string id = 2; string client_id = 3; string user_id = 4; string audience = 5;
  StringList scopes = 6; google.protobuf.Timestamp created_at = 7; google.protobuf.Timestamp updated_at = 8;
}

message SigningKey {
  string tenant_id = 1; string kid = 2; string alg = 3; string status = 4;
  optional bytes private_key = 5; // absent = nil
  optional bytes public_jwk = 6;  // absent = nil
  google.protobuf.Timestamp created_at = 7;
  optional bytes certificate_der = 8;
  google.protobuf.Timestamp current_since = 9;
  google.protobuf.Timestamp current_until = 10;
  google.protobuf.Timestamp revoked_at = 11;
}
message SigningKeyResult { Error error = 1; SigningKey value = 2; }
message SigningKeyRotation { SigningKey current = 1; SigningKey next = 2; }
message SigningKeyRotationResult { Error error = 1; SigningKeyRotation value = 2; }
message SigningKeyRevokeRequest { string tx_id = 1; string tenant_id = 2; string kid = 3; google.protobuf.Timestamp at = 4; }
message SigningKeyCertificateRequest { string tx_id = 1; string tenant_id = 2; string kid = 3; bytes der = 4; }
message CustomSigningKeySet { string tenant_id = 1; bytes jwks = 2; }
message CustomSigningKeySetResult { Error error = 1; CustomSigningKeySet value = 2; }
message CustomSigningKeySetWrite { string tx_id = 1; CustomSigningKeySet value = 2; }

message HostedLoginConfig { string tenant_id = 1; int64 revision = 2; string config_json = 3; }
message HostedLoginConfigResult { Error error = 1; HostedLoginConfig value = 2; }
message HostedLoginConfigWrite { string tx_id = 1; HostedLoginConfig value = 2; int64 expected_revision = 3; }

// Plan 24 federation. Sealed bytes are opaque ciphertext; no plaintext token
// or credential field exists in any message.
message FederationEndpoints {
  string authorization_url = 1; string token_url = 2; string jwks_url = 3;
  string userinfo_url = 4; string token_auth_method = 5;
}
message FederationAttempt {
  string state_hash = 1; string tenant_id = 2; string transaction_id = 3; string connection_id = 4;
  int64 revision = 5; int64 identity_epoch = 6; string cookie_hash = 7; string origin = 8;
  string callback_url = 9; string issuer = 10; FederationEndpoints endpoints = 11;
  optional bytes sealed_proof = 12; // absent = nil
  google.protobuf.Timestamp expires_at = 13; string status = 14; bool superseded = 15;
  google.protobuf.Timestamp created_at = 16;
}
message FederationAttemptWrite { string tx_id = 1; FederationAttempt value = 2; }
message FederationAttemptKey { string tx_id = 1; string tenant_id = 2; string state_hash = 3; }
message FederationClaimRequest {
  string tx_id = 1; string tenant_id = 2; string state_hash = 3; string cookie_hash = 4;
  string origin = 5; google.protobuf.Timestamp now = 6;
}
message FederationAttemptResult { Error error = 1; FederationAttempt value = 2; }
message FederatedIdentityKey { string tenant_id = 1; string connection_id = 2; bytes subject = 3; }
message FederatedIdentityRequest { string tx_id = 1; FederatedIdentityKey key = 2; }
message FederatedIdentityWrite { string tx_id = 1; FederatedIdentityKey key = 2; string user_id = 3; }
message FederatedTokensWrite { string tx_id = 1; FederatedIdentityKey key = 2; bytes sealed = 3; }
message FederatedTokensResult { Error error = 1; bytes sealed = 2; }
message UsersFindByIdentityRequest { string tx_id = 1; FederatedIdentityKey key = 2; }
message HostedStateCASRequest { string tx_id = 1; string tenant_id = 2; string id = 3; int64 expected_revision = 4; string next_json = 5; google.protobuf.Timestamp now = 6; }

// Email provider credentials are opaque ciphertext to storage plugins.
message EmailProvider {
  string tenant_id = 1; string name = 2; bool enabled = 3; string default_from = 4;
  string public_config_json = 5; bytes sealed_credentials = 6; int64 revision = 7;
}
message EmailProviderResult { Error error = 1; EmailProvider value = 2; }
message EmailProviderWrite { string tx_id = 1; EmailProvider value = 2; int64 expected_revision = 3; }
message EmailProviderDeleteRequest { string tx_id = 1; string tenant_id = 2; int64 expected_revision = 3; }
message EmailTemplate { string tenant_id = 1; string name = 2; string fields_json = 3; int64 revision = 4; }
message EmailTemplateKey { string tx_id = 1; string tenant_id = 2; string name = 3; }
message EmailTemplateResult { Error error = 1; EmailTemplate value = 2; }
message EmailTemplateWrite { string tx_id = 1; EmailTemplate value = 2; int64 expected_revision = 3; }
message EmailNotificationClaimRequest {
  string tx_id = 1; string tenant_id = 2; string subject_id = 3; string purpose = 4; string event_key = 5;
  google.protobuf.Timestamp now = 6; google.protobuf.Timestamp expires_at = 7; int32 limit = 8;
}
message EmailNotificationClaimResult { Error error = 1; bool claimed = 2; }
message EmailNotificationSweepRequest { string tx_id = 1; google.protobuf.Timestamp before = 2; int32 limit = 3; }

// PasswordPolicy is the password policy of plugins older than Plan 15: a
// minimum length and a number of required character classes. Connection
// still carries it, derived from password_options, so that such a plugin
// keeps the minimum length; password_options wins when both are present.
message PasswordPolicy { int64 min_length = 1; int64 require_character_classes = 2; }

message PasswordComplexity {
  int64 min_length = 1;
  optional StringList character_types = 2;  // absent = nil
  string character_type_rule = 3;
  string identical_characters = 4;
  string sequential_characters = 5;
  string max_length_exceeded = 6;
  int64 min_character_classes = 7;
}
message PasswordHistorySettings { bool active = 1; int64 size = 2; }
message PasswordDictionary { bool active = 1; string default = 2; optional StringList custom = 3; }
message PasswordProfileData { bool active = 1; optional StringList blocked_fields = 2; }
message PasswordOptions {
  PasswordComplexity complexity = 1;
  PasswordHistorySettings history = 2;
  PasswordDictionary dictionary = 3;
  PasswordProfileData profile_data = 4;
}

message Connection {
  string tenant_id = 1; string id = 2; string name = 3; string strategy = 4;
  StringList enabled_clients = 5; bool disable_signup = 6; bool requires_username = 7;
  PasswordPolicy password_policy = 8; google.protobuf.Timestamp created_at = 9;
  bool enabled_database_customization = 10; bool import_mode = 11;
  StringMap custom_scripts = 12;            // absent = nil map
  optional bytes configuration_sealed = 13; // absent = nil
  string set_user_root_attributes = 14;
  bool is_domain_connection = 15;
  PasswordOptions password_options = 16;
  bool brute_force_protection = 17;
  int64 username_min = 18;
  int64 username_max = 19;
  string origin = 20;                 // "api" or empty (seed)
  optional bytes extra_json = 21;     // absent = nil map; any JSON object
  int64 federation_revision = 22;     // Plan 24; absent = 0
  optional bytes federation_secrets_sealed = 23; // Plan 24; absent = nil; sealed, never plaintext
}

message Identity {
  string connection = 1; string provider = 2; string user_id = 3; string password_hash = 4;
  optional bytes profile_data_json = 5; // absent = nil map (the user's own identity)
  string imported_hash = 6; // JSON of an imported password hash spec; opaque
}
message IdentityList { repeated Identity values = 1; }
message User {
  string tenant_id = 1; string user_id = 2; string email = 3; bool email_verified = 4;
  string username = 5; string name = 6; string nickname = 7; string picture = 8;
  string given_name = 9; string family_name = 10;
  optional bytes user_metadata_json = 11; // absent = nil map
  bool blocked = 12; IdentityList identities = 13;
  google.protobuf.Timestamp last_login = 14; // absent = nil
  int64 logins_count = 15;
  google.protobuf.Timestamp created_at = 16; google.protobuf.Timestamp updated_at = 17;
  optional bytes app_metadata_json = 18; // absent = nil map
  string phone_number = 19; bool phone_verified = 20; string last_ip = 21;
  int64 version = 22;
  google.protobuf.Timestamp last_password_reset = 23; // absent = nil
}

message LoginSession {
  string tenant_id = 1; string id = 2; string token_hash = 3; string user_id = 4;
  string connection = 5; google.protobuf.Timestamp authenticated_at = 6;
  StringList client_ids = 7; google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp idle_expires_at = 9; google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11; google.protobuf.Timestamp last_interacted_at = 12;
  string initial_ip = 13; string initial_user_agent = 14; string last_ip = 15; string last_user_agent = 16;
  string cookie_mode = 17; // creation-time persistent/non-persistent choice
  string origin = 18;
}

message AuthTransaction {
  string tenant_id = 1; string id = 2; string cookie_hash = 3; string csrf_token = 4;
  string client_id = 5; StringMap params = 6;
  google.protobuf.Timestamp expires_at = 7; google.protobuf.Timestamp created_at = 8;
  string hosted_state_json = 9;
  string origin = 10;
}

message AuthCode {
  string tenant_id = 1; string code_hash = 2; string client_id = 3; string redirect_uri = 4;
  string user_id = 5; string session_id = 6; StringList scopes = 7; string audience = 8;
  string nonce = 9; string code_challenge = 10; string code_challenge_method = 11;
  google.protobuf.Timestamp auth_time = 12; google.protobuf.Timestamp expires_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp used_at = 15;     // absent = nil
  google.protobuf.Timestamp replayed_at = 16; // absent = nil
  string origin = 17;
  bytes action_effects = 18; // sealed post-login effects; empty = none
  string organization_id = 19; // Plan 29; empty = no organization
  string organization_connection_id = 20; // Original authenticated connection
}
message PushedAuthRequest {
  string tenant_id = 1; string id_hash = 2; string client_id = 3; StringMap params = 4;
  google.protobuf.Timestamp expires_at = 5; google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp used_at = 7; // absent = nil
  string origin = 8;
}

message DeviceCode {
  string tenant_id = 1; string device_code_hash = 2; string user_code_hash = 3; string client_id = 4;
  StringList scopes = 5; string audience = 6; string status = 7; string user_id = 8;
  StringList granted_scopes = 9;
  optional google.protobuf.Timestamp last_polled_at = 10;      // absent = nil
  optional google.protobuf.Timestamp expired_reported_at = 11; // absent = nil
  google.protobuf.Timestamp expires_at = 12; google.protobuf.Timestamp created_at = 13;
  string origin = 14;
  bytes action_effects = 15; // sealed post-login effects; empty = none
}

message RefreshToken {
  string tenant_id = 1; string id = 2; string token_hash = 3; string family_id = 4;
  string client_id = 5; string user_id = 6; string session_id = 7; StringList scopes = 8;
  string audience = 9; google.protobuf.Timestamp auth_time = 10; bool rotating = 11;
  google.protobuf.Timestamp expires_at = 12; google.protobuf.Timestamp idle_expires_at = 13;
  google.protobuf.Timestamp rotated_at = 14; // absent = nil
  google.protobuf.Timestamp revoked_at = 15; // absent = nil
  google.protobuf.Timestamp created_at = 16;
  string origin = 17;
  string organization_id = 18; // Plan 29; empty = no organization
  string organization_connection_id = 19; // Bound for the entire refresh family
}

message PasswordResetTicket {
  string tenant_id = 1; string id = 2; string token_hash = 3; string user_id = 4;
  string connection = 5; string client_id = 6; string lang = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp used_at = 9; // absent = nil
  google.protobuf.Timestamp created_at = 10;
  string result_url = 11; bool include_email_in_redirect = 12; bool mark_email_verified = 13;
  string origin = 14;
  google.protobuf.Timestamp challenge_passed_at = 15; // absent = nil
  string challenge_result_url = 16;
  string organization_id = 17;
}

message EmailVerificationTicket {
  string tenant_id = 1; string id = 2; string token_hash = 3; string user_id = 4;
  string connection = 5; string client_id = 6; string lang = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp used_at = 9; // absent = nil
  google.protobuf.Timestamp created_at = 10;
  string result_url = 11; bool include_email_in_redirect = 12;
  string email = 13;
  string origin = 14;
}

// A Management API job. type and status are store.JobType and
// store.JobStatus strings. Timestamps that are unset travel as the zero time.
message JobSummary { int64 failed = 1; int64 updated = 2; int64 inserted = 3; int64 total = 4; }
message Job {
  string tenant_id = 1; string id = 2; string type = 3; string status = 4;
  string connection_id = 5; string connection = 6; string external_id = 7;
  optional bytes params_json = 8; // absent = nil map
  bytes input = 9;                // empty = nil
  int64 progress = 10; JobSummary summary = 11; string status_details = 12;
  int64 attempts = 13; string lease_owner = 14;
  google.protobuf.Timestamp lease_until = 15; google.protobuf.Timestamp first_claimed_at = 16;
  google.protobuf.Timestamp created_at = 17; google.protobuf.Timestamp updated_at = 18;
  google.protobuf.Timestamp expires_at = 19;
  int64 file_size = 20;
}
message JobErrorItem { string code = 1; string message = 2; string path = 3; }
message JobErrorItems { repeated JobErrorItem values = 1; }
message JobError {
  int64 index = 1;
  optional bytes user_json = 2; // any JSON value; absent = nil
  JobErrorItems errors = 3;     // absent = nil slice
}

message Operator {
  string tenant_id = 1; string user_id = 2;
  StringList tenants = 3; // tenant names, or ["*"] for every tenant
  google.protobuf.Timestamp created_at = 4; google.protobuf.Timestamp updated_at = 5;
}

// ---- per-entity requests and results ----

message TenantWrite { string tx_id = 1; Tenant value = 2; }
message TenantsGetRequest { string tx_id = 1; string key = 2; } // id, name or domain
message TenantsListRequest { string tx_id = 1; }
message TenantResult { Error error = 1; Tenant value = 2; }
message TenantList { Error error = 1; repeated Tenant values = 2; }

message ClientWrite { string tx_id = 1; Client value = 2; }
message ClientResult { Error error = 1; Client value = 2; }
message ClientList { Error error = 1; repeated Client values = 2; }
// ClientsListPage keeps the clients whose app_type is any of app_types (when
// not empty) and, when has_is_first_party is true, whose is_first_party equals
// is_first_party; orders by created_at, then client_id (byte order); skips
// offset rows and returns at most limit (0 = no limit). total counts the
// matches before paging.
message ClientsListPageRequest {
  string tx_id = 1; string tenant_id = 2; repeated string app_types = 3;
  bool has_is_first_party = 4; bool is_first_party = 5;
  int64 offset = 6; int64 limit = 7;
}
message ClientPage { Error error = 1; repeated Client values = 2; int64 total = 3; }

message ResourceServerWrite { string tx_id = 1; ResourceServer value = 2; }
message ResourceServerResult { Error error = 1; ResourceServer value = 2; }
// ResourceServersList returns the tenant's resource servers ordered by
// created_at, then id.
message ResourceServerList { Error error = 1; repeated ResourceServer values = 2; }

message ClientGrantWrite { string tx_id = 1; ClientGrant value = 2; }
message ClientGrantsFindRequest { string tx_id = 1; string tenant_id = 2; string client_id = 3; string audience = 4; string subject_type = 5; }
message ClientGrantResult { Error error = 1; ClientGrant value = 2; }
// ClientGrantsList filters on the non-empty client_id, audience,
// subject_type, id and after_id, orders by id (byte order), skips offset rows and returns at
// most limit (0 = no limit). total counts the matches before paging.
message ClientGrantsListRequest {
  string tx_id = 1; string tenant_id = 2; string client_id = 3; string audience = 4; string subject_type = 5;
  int64 offset = 6; int64 limit = 7;
  string after_id = 8; // keep only ids that sort after it (byte order)
  string id = 9;       // keep only this id
}
message ClientGrantList { Error error = 1; repeated ClientGrant values = 2; int64 total = 3; }

message UserGrantWrite { string tx_id = 1; UserGrant value = 2; }
message UserGrantsFindRequest { string tx_id = 1; string tenant_id = 2; string client_id = 3; string user_id = 4; string audience = 5; }
message UserGrantResult { Error error = 1; UserGrant value = 2; }
message UserGrantList { Error error = 1; repeated UserGrant values = 2; int64 total = 3; }
// UserGrantsList filters on the non-empty user_id, client_id and audience;
// orders by id (byte order); skips offset rows and returns at most limit (0 =
// no limit). total counts the matches before paging.
message UserGrantsListRequest {
  string tx_id = 1; string tenant_id = 2; string user_id = 3; string client_id = 4; string audience = 5;
  int64 offset = 6; int64 limit = 7;
}

message SigningKeyWrite { string tx_id = 1; SigningKey value = 2; }
message SigningKeyList { Error error = 1; repeated SigningKey values = 2; }
message SigningKeysRotateRequest { string tx_id = 1; string tenant_id = 2; SigningKey next = 3; google.protobuf.Timestamp at = 4; }

message ConnectionWrite { string tx_id = 1; Connection value = 2; }
message ConnectionResult { Error error = 1; Connection value = 2; }
message ConnectionList { Error error = 1; repeated Connection values = 2; }
// ConnectionsListPage filters on a non-empty name (exact) and, when
// strategies is not empty, on any of them; orders by lower-cased name, then
// id; skips offset rows and returns at most limit (0 = no limit). total
// counts the matches before paging.
message ConnectionsListPageRequest {
  string tx_id = 1; string tenant_id = 2; string name = 3; repeated string strategies = 4;
  int64 offset = 5; int64 limit = 6;
}
message ConnectionPage { Error error = 1; repeated Connection values = 2; int64 total = 3; }

message PasswordHistoryAdd { string tx_id = 1; string tenant_id = 2; string user_id = 3; bytes hash = 4; int64 keep = 5; }
message PasswordHistoryList { Error error = 1; repeated bytes values = 2; } // newest first

message UserWrite { string tx_id = 1; User value = 2; }
message UserResult { Error error = 1; User value = 2; }
message UsersFindByLoginRequest { string tx_id = 1; string tenant_id = 2; string connection = 3; string login = 4; }
message UsersRecordLoginRequest { string tx_id = 1; string tenant_id = 2; string user_id = 3; google.protobuf.Timestamp at = 4; string ip = 5; }
message UsersFindByEmailRequest { string tx_id = 1; string tenant_id = 2; string email = 3; }
message UserListResult {
  Error error = 1; repeated User values = 2;
  int64 total = 3; // UsersList: the match count before paging
}

// UserQuery is store.UserQuery: a user search tree with its semantics.
message UserQuery {
  enum Op {
    OP_ALL = 0; OP_AND = 1; OP_OR = 2; OP_NOT = 3; OP_TERM = 4; OP_WILDCARD = 5; OP_RANGE = 6; OP_EXISTS = 7;
  }
  enum Kind { KIND_STRING = 0; KIND_BOOL = 1; KIND_NUMBER = 2; KIND_DATE = 3; }
  Op op = 1;
  repeated UserQuery kids = 2;
  string field = 3;
  Kind kind = 4;
  string value = 5;
  optional string lo = 6; // absent = open
  optional string hi = 7;
  bool lo_incl = 8;
  bool hi_incl = 9;
}

// UsersListRequest: query absent = every user; sort_field empty = the
// default order; limit 0 = no limit.
message UsersListRequest {
  string tx_id = 1; string tenant_id = 2; UserQuery query = 3;
  string sort_field = 4; bool sort_desc = 5; int64 offset = 6; int64 limit = 7;
}
message VersionResult { Error error = 1; int64 value = 2; }
message UsersSetPasswordHashRequest {
  string tx_id = 1; string tenant_id = 2; string user_id = 3; string connection = 4;
  string hash = 5; google.protobuf.Timestamp at = 6;
}

message SessionWrite { string tx_id = 1; LoginSession value = 2; }
message SessionResult { Error error = 1; LoginSession value = 2; }
message SessionList { Error error = 1; repeated LoginSession values = 2; } // newest first
message SessionsAddClientRequest { string tx_id = 1; string tenant_id = 2; string id = 3; string client_id = 4; }

message AuthTransactionWrite { string tx_id = 1; AuthTransaction value = 2; }
message AuthTransactionResult { Error error = 1; AuthTransaction value = 2; }

message AuthCodeWrite { string tx_id = 1; AuthCode value = 2; }
message AuthCodeResult { Error error = 1; AuthCode value = 2; } // Consume may set both
message PushedAuthRequestWrite { string tx_id = 1; PushedAuthRequest value = 2; }
message PushedAuthRequestResult { Error error = 1; PushedAuthRequest value = 2; } // Consume may set both
message DeviceCodeWrite { string tx_id = 1; DeviceCode value = 2; }
message DeviceCodeResult { Error error = 1; DeviceCode value = 2; } // Decide may set both (ALREADY_USED)
message DeviceDecisionRequest {
  string tx_id = 1; string tenant_id = 2; string device_code_hash = 3;
  string status = 4; string user_id = 5; StringList granted_scopes = 6;
  bytes action_effects = 7;
}
message DevicePollRequest {
  string tx_id = 1; string tenant_id = 2; string device_code_hash = 3; google.protobuf.Timestamp at = 4;
}
// outcome is a store.DevicePollOutcome: pending, slow_down, approved, denied,
// expired or invalid. A host rejects any other value.
message DevicePollResult { Error error = 1; DeviceCode code = 2; string outcome = 3; }

message RefreshTokenWrite { string tx_id = 1; RefreshToken value = 2; }
message RefreshTokenResult { Error error = 1; RefreshToken value = 2; }
message RefreshTokenList { Error error = 1; repeated RefreshToken values = 2; } // live tokens, newest first
message RefreshTokensRotateRequest {
  string tx_id = 1; string tenant_id = 2; string old_id = 3; RefreshToken next = 4;
  google.protobuf.Timestamp at = 5; google.protobuf.Duration leeway = 6;
}

message PasswordResetTicketChallengeRequest {
  string tx_id = 1; string tenant_id = 2; string token_hash = 3;
  google.protobuf.Timestamp passed_at = 4; string result_url = 5;
}
message PasswordResetTicketWrite { string tx_id = 1; PasswordResetTicket value = 2; }
message PasswordResetTicketResult { Error error = 1; PasswordResetTicket value = 2; }
message EmailVerificationTicketWrite { string tx_id = 1; EmailVerificationTicket value = 2; }
message EmailVerificationTicketResult { Error error = 1; EmailVerificationTicket value = 2; }

message OperatorWrite { string tx_id = 1; Operator value = 2; }
message OperatorResult { Error error = 1; Operator value = 2; }
message OperatorList { Error error = 1; repeated Operator values = 2; }

message UsersUpgradeImportedHashRequest {
  string tx_id = 1; string tenant_id = 2; string user_id = 3; string connection = 4;
  string imported = 5; string hash = 6; google.protobuf.Timestamp at = 7;
}

message JobWrite { string tx_id = 1; Job value = 2; }
message JobResult { Error error = 1; Job value = 2; }
message JobPage { Error error = 1; repeated Job values = 2; int64 total = 3; }
message JobsListRequest { string tx_id = 1; string tenant_id = 2; int64 offset = 3; int64 limit = 4; }
message JobsCountActiveRequest { string tx_id = 1; string tenant_id = 2; string type = 3; }
message JobsClaimRequest {
  string tx_id = 1; string owner = 2; google.protobuf.Timestamp now = 3; google.protobuf.Duration lease = 4;
}
message JobsRenewRequest {
  string tx_id = 1; string tenant_id = 2; string id = 3; string owner = 4; google.protobuf.Timestamp until = 5;
}
message JobsCheckpointRequest {
  string tx_id = 1; string tenant_id = 2; string id = 3; string owner = 4;
  int64 progress = 5; JobSummary summary = 6; repeated JobError errors = 7;
}
message JobsFinishRequest {
  string tx_id = 1; string tenant_id = 2; string id = 3; string owner = 4;
  string status = 5; string details = 6; google.protobuf.Timestamp at = 7;
}
message JobErrorList { Error error = 1; repeated JobError values = 2; }
message JobsAppendFileRequest {
  string tx_id = 1; string tenant_id = 2; string id = 3; string owner = 4;
  int64 seq = 5; bytes chunk = 6; // at most 1 MiB
}
message JobFileChunk { Error error = 1; bytes data = 2; }

// Atomic protection operations; opaque receipts are resolved by the server.
message ProtectionKey {
 string tenant_id = 1; string kind = 2; string connection_id = 3;
 string identifier = 4; string ip = 5;
}
message ProtectionLimit {
 ProtectionKey key = 1; string algorithm = 2; int64 capacity = 3;
 google.protobuf.Duration window = 4;
 google.protobuf.Duration refill = 5;
 google.protobuf.Duration lockout = 6;
}
message ProtectionBlock { ProtectionKey key = 1; google.protobuf.Timestamp blocked_until = 2; }
message ProtectionRequest {
 string tx_id = 1; string tenant_id = 2; string receipt_id = 3;
 repeated ProtectionLimit limits = 4; string outcome = 5;
 google.protobuf.Timestamp now = 6; google.protobuf.Timestamp expires_at = 7;
 ProtectionKey filter = 8; string proof_hash = 9;
 string attempt_id = 10; string ip = 11; int64 limit = 12;
}
message ProtectionResult {
 Error error = 1; bool allowed = 2; string tenant_id = 3; string receipt_id = 4;
 google.protobuf.Timestamp retry_at = 5; repeated ProtectionBlock blocks = 6;
 int64 count = 7;
}

// ---- private custom-domain and encrypted TLS persistence (Plan 23) ----
// These records are never public API DTOs. Ciphertext is an opaque sealed
// envelope: never send plaintext TLS private keys or provider credentials.
message CustomDomain {
  string tenant_id = 1; string id = 2; string domain = 3; string type = 4;
  string source = 5; string origin_host = 6; int64 generation = 7; int64 revision = 8;
  string status = 9; string tls_policy = 10; string custom_client_ip_header = 11;
  string relying_party_identifier = 12; StringMap domain_metadata = 13;
  string verification_method = 14; string proof_record_name = 15;
  string proof_record_value = 16; string proof_status = 17; optional bytes proof_token = 18;
  google.protobuf.Timestamp proof_created_at = 19;
  google.protobuf.Timestamp proof_verified_at = 20; google.protobuf.Timestamp last_proof_check_at = 21;
  google.protobuf.Timestamp proof_failure_since = 22; string lifecycle = 23;
  google.protobuf.Timestamp next_attempt_at = 24; int64 attempt_count = 25;
  string last_failure = 26; optional bytes proxy_key_hash = 27; string active_certificate_key = 28;
  google.protobuf.Timestamp created_at = 29; google.protobuf.Timestamp updated_at = 30;
  bool custom_client_ip_header_null = 31;
}
message HostBinding {
  string host = 1; string tenant_id = 2; string domain_id = 3;
  int64 generation = 4; string kind = 5; bool active = 6;
}
message TLSPublicData {
  int64 version = 1; string directory_url = 2; string account_url = 3; string order_url = 4;
  string status = 5; string challenge_type = 6; string identifier = 7; string token = 8;
  string key_authorization = 9; string record_name = 10; string record_value = 11;
  string dns_record_id = 12; optional bytes certificate_chain_pem = 13; StringList sans = 14;
  google.protobuf.Timestamp not_before = 15; google.protobuf.Timestamp not_after = 16;
}
message TLSAsset {
  string key = 1; string kind = 2; string tenant_id = 3; string domain_id = 4;
  int64 generation = 5; int64 revision = 6; optional bytes ciphertext = 7;
  TLSPublicData public_data = 8; google.protobuf.Timestamp expires_at = 9;
}
message TLSLease {
  string key = 1; string owner = 2; int64 fence = 3; google.protobuf.Timestamp until = 4;
}
// Probe both repositories without a tenant ID or mutation. A held transaction
// must supply tx_id so the probe observes the same backing transaction view.
message CustomDomainCapabilitiesRequest { string tx_id = 1; }
message CustomDomainRequest {
  string tx_id = 1; string tenant_id = 2; string id = 3; string host = 4;
  string domain_id = 5; CustomDomain value = 6; HostBinding binding = 7;
  int64 expected_revision = 8; int64 limit = 9;
}
message CustomDomainResult {
  Error error = 1; CustomDomain value = 2; repeated CustomDomain values = 3;
  HostBinding binding = 4; string default_id = 5; google.protobuf.Duration retry_after = 6;
}
message TLSAssetRequest {
  string tx_id = 1; string key = 2; string owner = 3; TLSAsset value = 4;
  TLSLease lease = 5; int64 expected_revision = 6; int64 limit = 7;
  google.protobuf.Duration duration = 8;
}
message TLSAssetResult {
  Error error = 1; TLSAsset value = 2; repeated TLSAsset values = 3; TLSLease lease = 4;
}

message MicrosoftFederationCapabilitiesRequest { string tx_id = 1; }

// Plan 26 typed authorization contract. All calls preserve transaction binding.
message RBACRole { string tenant_id=1; string id=2; string name=3; string description=4; }
message RBACPermissionKey { string resource_server_identifier=1; string permission_name=2; }
message RBACSource { string type=1; string id=2; string name=3; }
message RBACPermissionGrant { RBACPermissionKey key=1; string resource_server_name=2; string description=3; repeated RBACSource sources=4; }
message RBACPage { int64 page=1; int64 per_page=2; string name_filter=3; string from=4; int64 take=5; }
message RBACRequest { string tx_id=1; string tenant_id=2; string id=3; RBACRole role=4; bool add=5; repeated RBACPermissionKey keys=6; repeated string ids=7; RBACPage page=8; string audience=9; }
message RBACSnapshot { ResourceServer api=1; repeated string permissions=2; }
message RBACResponse { Error error=1; RBACRole role=2; repeated RBACRole roles=3; repeated RBACPermissionGrant grants=4; repeated User users=5; int64 total=6; string next=7; RBACSnapshot snapshot=8; }
message RBACCapabilitiesResult { Error error=1; uint32 version=2; }

// ---- Organizations (Plan 29) ----

message OrganizationColorsMsg { string primary=1; string page_background=2; }
message OrganizationBrandingMsg { optional string logo_url=1; optional OrganizationColorsMsg colors=2; }
message OrganizationMsg {
  string tenant_id=1; string id=2; string name=3; string display_name=4;
  optional OrganizationBrandingMsg branding=5; // absent = nil
  optional StringMap metadata=6;               // absent = nil (an empty map is distinct)
  string third_party_client_access=7;
  google.protobuf.Timestamp created_at=8; google.protobuf.Timestamp updated_at=9;
  bool is_app_entitlement_active=10;
}
message OrganizationConnectionMsg {
  string tenant_id=1; string organization_id=2; string connection_id=3;
  bool assign_membership_on_login=4; bool show_as_button=5; bool is_signup_enabled=6;
  optional bool is_enabled=7; string connection_name=8; string organization_access_level=9; string organization_member_access_level=10;
}
message OrganizationPageMsg { int64 page=1; int64 per_page=2; bool include_totals=3; string from=4; int64 take=5; string sort=6; }
// Fields are used by the method that names them: tenant_id/organization_id/
// user_id/role_id/connection_id address rows; ids carries user or role IDs.
message OrganizationsRequest {
  string tx_id=1; string tenant_id=2; string organization_id=3; string name=4;
  OrganizationMsg organization=5; repeated OrganizationConnectionMsg connections=6;
  OrganizationConnectionMsg connection=7; bool flag=8; // create (PutConnection) / add (ChangeMemberRoles)
  string connection_id=9; string user_id=10; string role_id=11; repeated string ids=12;
  OrganizationPageMsg page=13;
}
message OrganizationsResponse {
  Error error=1; OrganizationMsg organization=2; repeated OrganizationMsg organizations=3;
  OrganizationConnectionMsg connection=4; repeated OrganizationConnectionMsg connections=5;
  repeated string ids=6; int64 total=7; string next=8; bool flag=9; // flag: IsMember
}
message OrganizationsCapabilitiesResult { Error error=1; uint32 version=2; }

// ---- Actions (Plan 27) ----

message ActionDependency { string name=1; string version=2; }
message ActionSecretMsg { string name=1; bytes sealed=2; google.protobuf.Timestamp updated_at=3; }
message ActionMsg {
  string tenant_id=1; string id=2; string name=3; string trigger=4; string runtime=5; string code=6;
  repeated ActionDependency dependencies=7; repeated ActionSecretMsg secrets=8;
  string draft_build_id=9; string deployed_version_id=10;
  google.protobuf.Timestamp created_at=11; google.protobuf.Timestamp updated_at=12;
  repeated ActionModuleRefMsg modules=13;
}
message ActionVersionMsg {
  string tenant_id=1; string action_id=2; string id=3; int64 number=4; string code=5; string runtime=6; string build_id=7;
  repeated ActionDependency dependencies=8; repeated ActionSecretMsg secrets=9; google.protobuf.Timestamp created_at=10;
  repeated ActionModuleRefMsg modules=11;
}
message ActionBuildMsg {
  string tenant_id=1; string id=2; string status=3;
  repeated ActionDependency requested=4; repeated ActionDependency resolved=5; repeated string errors=6;
  string artifact_sha256=7; google.protobuf.Timestamp built_at=8;
}
message ActionBindingMsg {
  string tenant_id=1; string trigger=2; string id=3; string action_id=4; string display_name=5;
  google.protobuf.Timestamp created_at=6; google.protobuf.Timestamp updated_at=7;
}
message ActionBoundMsg { ActionBindingMsg binding=1; ActionMsg action=2; ActionVersionMsg version=3; }
message ActionExecutionResultMsg {
  string job_id=6; int32 job_attempt=7;
  string action_name=1; string error_id=2; string error_msg=3;
  google.protobuf.Timestamp started_at=4; google.protobuf.Timestamp ended_at=5;
}
message ActionExecutionMsg {
  string tenant_id=1; string id=2; string trigger=3; string status=4;
  repeated ActionExecutionResultMsg results=5; google.protobuf.Timestamp created_at=6; google.protobuf.Timestamp updated_at=7;
}
message ActionContinueMsg {
  string tenant_id=1; string state_hash=2; string session_id=3; bytes sealed=4;
  google.protobuf.Timestamp expires_at=5; google.protobuf.Timestamp created_at=6;
}
message ActionsRequest {
  string tx_id=1; string tenant_id=2; string id=3; string name=4; string trigger=5;
  string action_id=6; string version_id=7; string build_id=8; string state_hash=9; bool force=10;
  int64 page=11; int64 per_page=12;
  google.protobuf.Timestamp time=13; // before/now cutoff
  ActionMsg action=14; ActionBuildMsg build=15; ActionExecutionMsg execution=16; ActionContinueMsg continue_state=17;
  repeated ActionBindingMsg bindings=18;
  string session_id=19;
  ActionModuleMsg module=20; ActionJobMsg job=21;
  google.protobuf.Duration lease=22; int64 max_jobs=23;
  google.protobuf.Timestamp lease_until=24;
}
message ActionsResponse {
  Error error=1; ActionMsg action=2; repeated ActionMsg actions=3; int64 total=4;
  ActionVersionMsg version=5; repeated ActionVersionMsg versions=6; ActionBuildMsg build=7;
  repeated ActionBoundMsg bound=8; ActionExecutionMsg execution=9; ActionContinueMsg continue_state=10; int64 count=11;
  bool bindings_initialized=12;
  ActionModuleMsg module=13; repeated ActionModuleMsg modules=14;
  ActionModuleVersionMsg module_version=15; repeated ActionModuleVersionMsg module_versions=16;
  repeated ActionModuleUserMsg module_users=17; repeated ActionJobMsg jobs=18;
}
message ActionsArtifactChunk {
  Error error=1; string tx_id=2; string tenant_id=3; string build_id=4;
  bytes data=5; int64 total_size=6; bytes sha256=7;
}
message ActionsCapabilitiesResult { Error error=1; uint32 version=2; }

// Module references are resolved into all four fields before persistence.
message ActionModuleRefMsg {
  string module_id=1; string module_name=2; string version_id=3; int64 version_number=4;
}
message ActionModuleMsg {
  string tenant_id=1; string id=2; string name=3; string code=4;
  repeated ActionDependency dependencies=5; repeated ActionSecretMsg secrets=6;
  string draft_build_id=7; int64 latest_version_number=8; bool all_changes_published=9;
  google.protobuf.Timestamp created_at=10; google.protobuf.Timestamp updated_at=11;
}
message ActionModuleVersionMsg {
  string tenant_id=1; string module_id=2; string id=3; int64 number=4; string code=5; string build_id=6;
  repeated ActionDependency dependencies=7; repeated ActionSecretMsg secrets=8;
  google.protobuf.Timestamp created_at=9;
}
message ActionModuleUserMsg { ActionMsg action=1; bool in_draft=2; bool in_deployed=3; }
message ActionJobMsg {
  string tenant_id=1; string id=2; string trigger=3; string status=4; bytes sealed=5; int64 attempts=6;
  google.protobuf.Timestamp next_at=7; google.protobuf.Timestamp lease_until=8;
  google.protobuf.Timestamp created_at=9; google.protobuf.Timestamp updated_at=10;
  repeated string execution_ids=11; repeated string module_version_ids=12;
}

message OrganizationInvitationMsg {
  string tenant_id=1;
  string organization_id=2;
  string id=3;
  string client_id=4;
  string inviter_name=5;
  string invitee_email=6;
  string connection_id=7;
  StringList roles=8;
  bytes user_metadata_json=9;
  bytes app_metadata_json=10;
  string ticket_hash=11;
  bytes wrapped_ticket=12;
  bool send_invitation_email=13;
  google.protobuf.Timestamp created_at=14;
  google.protobuf.Timestamp updated_at=15;
  google.protobuf.Timestamp expires_at=16;
}

message InvitationReceiptMsg {
  string tenant_id=1;
  string organization_id=2;
  string invitation_id=3;
  string transaction_id=4;
  string user_id=5;
  google.protobuf.Timestamp accepted_at=6;
}

message OrganizationClientMsg {
  string tenant_id=1;
  string organization_id=2;
  string client_id=3;
  bool use_for_member_access=4;
}

message OrganizationDiscoveryDomainMsg {
  string tenant_id=1;
  string organization_id=2;
  string id=3;
  string domain=4;
  string status=5;
  string verification_host=6;
  string verification_txt=7;
  bool use_for_organization_discovery=8;
}

message OrganizationsIIRequest {
 string tx_id=1; string tenant_id=2; string organization_id=3; string id=4;
 string client_id=5; string grant_id=6; string transaction_id=7; string user_id=8;
 string ticket_hash=9; string domain=10; repeated string ids=11;
 OrganizationPageMsg page=12; bool create=13; google.protobuf.Timestamp now=14;
 OrganizationInvitationMsg invitation=15; repeated OrganizationClientMsg clients=16;
 OrganizationDiscoveryDomainMsg discovery_domain=17;
}
message OrganizationsIIResponse {
 Error error=1; OrganizationInvitationMsg invitation=2; repeated OrganizationInvitationMsg invitations=3;
 InvitationReceiptMsg receipt=4; OrganizationClientMsg client=5; repeated OrganizationClientMsg clients=6;
 repeated ClientGrant grants=7; repeated OrganizationMsg organizations=8;
 OrganizationDiscoveryDomainMsg discovery_domain=9; repeated OrganizationDiscoveryDomainMsg discovery_domains=10;
 int64 total=11; string next=12; bool flag=13;
}
